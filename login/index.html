<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 | AMAS 亚洲宣教神学院</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/portal.css?v=202609121833">
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <img src="../assets/img/school-seal.webp" alt="AMAS">
    <h1>亚洲宣教神学院</h1>
    <div class="en">ASIA MISSIONARY ASSOCIATION SEMINARY</div>
  </div>

  <div class="card">
    <div id="disabledNotice" class="notice" hidden>
      <b>门户系统尚未启用。</b>账号与学习系统正在部署中，目前暂不可登录；如需咨询请<a class="link" href="../index.html#contact">联系招生同工</a>。
    </div>
    <!-- 与上面那条是两回事：配置齐全、只是登录组件没加载下来（境内网络／离线／拦截插件）。
         对这种情况说「正在部署中」是假话，而且会把唯一有效的自救动作——重试——藏起来。 -->
    <div id="offlineNotice" class="notice" hidden>
      <b>登录组件没能加载。</b>门户本身已就绪，是当前网络取不到登录所需的外部组件；换个网络或重新载入通常即可。若持续如此请<a class="link" href="../index.html#contact">联系招生同工</a>。
      <div><button type="button" class="notice-act" id="btnReload">重新载入</button></div>
    </div>

    <h2>登录</h2>
    <p class="sub">使用电子邮箱或学号登录你的 AMAS 账号</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="fId">电子邮箱 / 学号</label>
        <input id="fId" name="identifier" autocomplete="username" placeholder="请输入邮箱地址或学号" required>
      </div>
      <div class="field">
        <label for="fPw">密码</label>
        <input id="fPw" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </div>
      <div class="row">
        <span></span>
        <a class="link" href="../forgot-password/">忘记密码？</a>
      </div>
      <button class="btn" id="btnLogin" type="submit">进入 AMAS</button>
      <div class="msg err" id="err" role="alert"></div>
    </form>

    <div class="quick">
      <a href="../index.html#admissions"><b>申请入学</b><span>提交入学申请</span></a>
      <a href="../faculty/verify/"><b>教师验证</b><span>教职工专用通道</span></a>
      <a href="../help/"><b>帮助中心</b><span>常见问题解答</span></a>
    </div>
  </div>

  <div class="foot">
    还没有账号？<a href="../register/">注册</a> · <a href="../index.html">返回官网</a><br>
    🔒 AMAS 采用标准安全机制保护您的信息与隐私
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-config.js?v=202609121833"></script>
<script src="../assets/js/portal/auth.js?v=202609121833"></script>
<script>
(function(){
  const A = window.AmasAuth;
  const err = document.getElementById("err");
  const ERR = {
    not_configured: "系统尚未启用，暂不可登录。",
    invalid_input: "请输入账号与密码。",
    bad_credentials: "账号或密码不正确。",           // 统一文案，不区分账号是否存在（§5.3）
    rate_limited: "尝试次数过多，请 15 分钟后再试。",
    alias_login_unavailable: "学号登录暂未开通，请先使用邮箱登录。",
    /* 下面三条是「没能完成登录」，不是「登录被拒」。都要明写不是账号密码的问题 ——
       否则用户会去改一个本来没错的密码，甚至以为自己账号出了事。 */
    network: "网络连不上，没能完成登录。请检查网络后重试（这不是账号或密码的问题）。",
    server: "服务器暂时出错，没能完成登录。请稍后再试（这不是账号或密码的问题）。",
    unknown: "没能确认登录结果，请稍后再试（这不是账号或密码的问题）。",
    /* 密码已经验过了，卡在读权限这一步。别说成登录失败，也别把人送进门户去弹。 */
    roles_unavailable: "已登录，但暂时读不到你的账号权限，没能确定该进哪个空间。请稍后重试。",
  };
  /* 兜底**绝不能**是 bad_credentials：那等于一遇到没见过的状况就指责用户密码错。
     认不出来的就老实说认不出来。 */
  // next 的同源收口在共享层（A.safePath），登录页与 MFA 页共用同一份判据
  const safeNext = () => A.safePath(new URLSearchParams(location.search).get("next"));
  function showErr(code){ err.textContent = ERR[code] || ERR.unknown; err.classList.add("show"); }

  if (!A.CONFIGURED) {
    const offline = A.CONFIG_STATE === "sdk-unavailable";
    document.getElementById(offline ? "offlineNotice" : "disabledNotice").hidden = false;
    document.getElementById("btnLogin").disabled = true;
    if (offline) document.getElementById("btnReload").addEventListener("click", () => location.reload());
  } else {
    // 已登录直接进入工作空间
    A.getSession().then(async s => { if (s) location.replace(A.homeForRoles(await A.getRoles())); });
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    const btn = document.getElementById("btnLogin");
    btn.disabled = true; btn.textContent = "登录中…";
    const r = await A.signIn(document.getElementById("fId").value, document.getElementById("fPw").value);
    if (r.error) { showErr(r.error); btn.disabled = !A.CONFIGURED ? true : false; btn.textContent = "进入 AMAS"; return; }
    /* 登录成功之后还要知道去哪。以前这里用 A.getRoles()，
       而它读不到角色时也返回 []，于是 homeForRoles([]) 把人送进
       portal/applicant/ —— 那页守卫又不放行，来回弹。
       改用 fetchRoles：读不到就**留在登录页**如实说，不瞎送。 */
    const rs = await A.fetchRoles();
    if (rs.failed) {
      showErr("roles_unavailable");
      btn.disabled = false; btn.textContent = "进入 AMAS";
      return;
    }
    location.replace(safeNext() || A.homeForRoles(rs.roles));
  });
})();
</script>
</body>
</html>
