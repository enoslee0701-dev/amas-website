<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>我的课程 | AMAS 学员中心</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202610232303">
<style>
.ofs{display:grid;gap:10px}
.of{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;display:grid;gap:6px}
.of h3{margin:0;font-size:16px;color:var(--navy)}
.of .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.of .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.planned{background:#fdf4e3;color:#7a5a12}.chip.in_progress{background:#e9f3ee;color:var(--ok)}
.chip.completed{background:#eaf0f8;color:#10305a}.chip.cancelled{background:#f3e9e9;color:#8a2c2c}
.sbtn{min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:13px;cursor:pointer;justify-self:start}
.more{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.more .line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.more .line:last-child{border-bottom:0}.more small{color:var(--muted)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202610232303"></script>
<script src="../../../assets/js/portal/auth.js?v=202610232303"></script>
<script src="../../../assets/js/portal/api.js?v=202610232303"></script>
<script src="../../../assets/js/portal/ui.js?v=202610232303"></script>
<script src="../../../assets/js/portal/shell.js?v=202610232303"></script>
<script>
/* 学员管理系统第一期：学员的「我的课程」——教务已把他编入的课程班。
   与「课程目录」分开：目录是 68 门课的清单，这里是他实际在上的班。
   数据来自 my_courses()（0030）：只返回他本人、编班状态为在读的班。 */
(async function(){
  const Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell;
  const mounted = await Shell.mount({ space: "student", title: "我的课程", allow: ["student"] });
  if (!mounted) return;
  const { main } = mounted;

  const MODE = { online: "线上", onsite: "清迈线下", hybrid: "线上 + 线下" };
  const OST = { planned: "未开课", in_progress: "上课中", completed: "已结课", cancelled: "已取消" };
  const d = (v) => v ? String(v).slice(0, 10) : "待定";

  UI.loading(main, 3);
  const { data, error } = await Api.rpc("my_courses");
  if (error || !Array.isArray(data)) {
    return UI.error(main, { message: "这一次没能读到你的课程。这不表示你没有课程，请稍后重试。",
                            onRetry: () => location.reload() });
  }
  main.innerHTML = '<h1>我的课程</h1>' +
    '<p class="lead">教务为你编入的课程班。上课时间与方式以这里为准，有变动时教务会更新。</p>' +
    (data.length
      ? '<div class="ofs">' + data.map(c =>
          '<div class="of"><div class="top"><h3>' + UI.esc(c.title_zh) + (c.section_label ? ' · ' + UI.esc(c.section_label) : "") + '</h3>' +
            '<span class="chip ' + c.offering_status + '">' + (OST[c.offering_status] || c.offering_status) + '</span></div>' +
          '<div class="meta"><span>' + UI.esc(c.academic_year) + ' 学年</span><span>' + UI.esc(MODE[c.delivery_mode] || c.delivery_mode) + '</span>' +
            '<span>' + d(c.starts_on) + ' 至 ' + d(c.ends_on) + '</span>' +
            (c.credits ? '<span>' + c.credits + ' 学分</span>' : "") + '</div>' +
          (c.schedule_note ? '<div>上课安排：' + UI.esc(c.schedule_note) + '</div>' : "") +
          '<div class="who">任课教授：' + UI.esc(c.teachers || "待安排") + '</div>' +
          '<button class="sbtn" data-more="' + c.offering_id + '" aria-expanded="false">出勤与作业</button>' +
          '<div class="more" id="m-' + c.offering_id + '" hidden></div></div>').join("") + '</div>'
      : UI.box("📚", "还没有为你编入课程班", "教务编班后，你的课程会出现在这里。可以先在「课程目录」里了解全部课程。"));

  const ATT = { present: "出席", late: "迟到", excused: "请假", absent: "缺席" };
  main.querySelectorAll("[data-more]").forEach(b => b.addEventListener("click", async () => {
    const box = main.querySelector("#m-" + b.dataset.more);
    const open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open)); box.hidden = open;
    if (open || box.dataset.loaded) return;
    box.innerHTML = UI.skeleton(2);
    const { data: m, error: e } = await Api.rpc("my_course_detail", { p_offering: b.dataset.more });
    if (e || !m) { box.innerHTML = '<p class="who">这一次没能读到，请再点一次。</p>'; b.setAttribute("aria-expanded", "false"); box.hidden = true; return; }
    box.dataset.loaded = "1";
    const att = m.attendance || [], asg = m.assignments || [];
    const cnt = (k) => att.filter(x => x.status === k).length;
    box.innerHTML = (m.final_grade ? '<div class="line"><b>课程总评</b><b>' + UI.esc(m.final_grade) + '</b></div>' : "") +
      '<div class="line"><b>出勤</b><span>' + (att.length ? "出席 " + cnt("present") + " · 迟到 " + cnt("late") + " · 请假 " + cnt("excused") + " · 缺席 " + cnt("absent") + "（共 " + att.length + " 次课）" : "还没有上课记录") + '</span></div>' +
      att.map(x => '<div class="line"><span>' + String(x.held_on).slice(0, 10) + ' · ' + UI.esc(x.topic) +
        (x.materials_url ? ' <a class="link" href="' + UI.esc(x.materials_url) + '" target="_blank" rel="noopener">讲义</a>' : "") + '</span><small>' +
        (x.status ? ATT[x.status] : "未点名") + '</small></div>').join("") +
      '<div class="line"><b>作业</b><span>' + (asg.length ? asg.length + " 份" : "暂无") + '</span></div>' +
      asg.map(x => '<div class="line"><span>' + UI.esc(x.title) + (x.due_on ? ' <small>截止 ' + String(x.due_on).slice(0, 10) + '</small>' : "") +
        (x.comment ? '<br><small>评语：' + UI.esc(x.comment) + '</small>' : "") + '</span><b>' + UI.esc(x.grade || "未评") + '</b></div>').join("");
  }));
})();
</script>
</body>
</html>
