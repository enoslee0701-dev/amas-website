<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>我的资料 | AMAS</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202609140408">
<style>
.sec{margin-bottom:18px}
.sec h2{font-size:16px;color:var(--navy);margin:0 0 4px}
.sec .note{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.lock{display:inline-flex;align-items:center;gap:4px;background:var(--wash);border:1px solid var(--line);
  border-radius:99px;padding:1px 9px;font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap}
.ro{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ro:last-child{border-bottom:0}
.ro>span{color:var(--muted);font-size:13px;flex:0 0 auto}
.ro>b{color:var(--navy);text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
.fld input{width:100%;min-height:46px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit}
.fld input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(23,63,112,.12)}
.fld .h{font-size:12px;color:var(--muted);margin-top:5px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202609140408"></script>
<script src="../../../assets/js/portal/auth.js?v=202609140408"></script>
<script src="../../../assets/js/portal/api.js?v=202609140408"></script>
<script src="../../../assets/js/portal/ui.js?v=202609140408"></script>
<script src="../../../assets/js/portal/shell.js?v=202609140408"></script>
<script>
/* PORTAL-2B 学生资料页（2B-1）
   Single Person Model：人物主数据在 profiles，学籍数据在 student_records，
   本页不复制第二份姓名/邮箱/生日。
   本人可维护字段与教务维护字段严格分区，后者在 UI 上明确标注「由教务维护」；
   真正的门禁在服务端——update_my_contact 的函数签名本身就是字段白名单。 */
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell;
  const mounted = await Shell.mount({ space: "student", title: "我的资料", allow: ["student"] });
  if (!mounted) return;
  const { main } = mounted;

  const ST = { pre_enrolled: "待正式注册", active: "在读" };
  const PW = { bth: "正式 B.Th 学籍", common_learning: "共同学习", undecided: "未选择" };
  const HQ = { approved: "总校已确认", pending: "待确认", rejected: "总校未通过" };

  UI.loading(main, 4);
  const [{ data: prof, error }, { data: pc }] = await Promise.all([
    Api.rpc("my_student_profile"),
    Api.select("program_catalog", { columns: "code,name_zh,short_label" }),
  ]);
  if (error) return UI.error(main, { message: error.message, onRetry: () => location.reload() });

  const self = (prof && prof.self_editable) || {};
  const reg = (prof && prof.registrar_managed) || {};
  const pcMap = Object.fromEntries((pc || []).map(p => [p.code, p]));
  const prog = reg.program_code ? pcMap[reg.program_code] : null;
  const hq = reg.hq_approval;
  const d = (v) => v ? new Date(v).toLocaleDateString("zh-CN") : "—";
  const ro = (k, v) => `<div class="ro"><span>${UI.esc(k)}</span><b>${UI.esc(v || "—")}</b></div>`;

  main.innerHTML =
    '<h1>我的资料</h1>' +
    '<p class="lead">联系方式可以自行维护；学号、学籍状态与修读项目由 AMAS 教务处维护，如有出入请联系教务同工。</p>' +

    '<div class="card sec">' +
      '<h2>我可以修改的资料</h2>' +
      '<p class="note">这些信息用于教务与你联系，请保持可用。</p>' +
      '<form id="f" novalidate>' +
        '<div class="fld"><label for="nm">姓名</label>' +
          '<input id="nm" value="' + UI.esc(self.display_name || "") + '" maxlength="60">' +
          '<div class="h">用于门户显示。正式学籍姓名以入学申请与总校记录为准。</div></div>' +
          /* 待办「完善联系方式」（my_action_items，0019_student_role_gating.sql:158 起）
           把他送到这一页来，理由是「你还没有填写联系电话」。
           可这一页原来什么都不接：页面上不说他是来补什么的，也没有一步能到那一格 ——
           键盘用户得自己在表单里找（本轮实测 St3/St4）。
           这里不猜他从哪来，只按**这一页自己读到的事实**说：电话是空的就说它空着。
           入口是按钮、由他按下才移焦点 —— 不在载入时抢焦点。 */
        '<div id="phNote"></div>' +
      '<div class="fld"><label for="ph">联系电话</label>' +
          '<input id="ph" value="' + UI.esc(self.phone || "") + '" maxlength="40" inputmode="tel">' +
          '<div class="h">教务需要时会通过这个号码联系你。</div></div>' +
        '<div class="fld"><label for="ct">备用联系方式</label>' +
          '<input id="ct" value="' + UI.esc(self.contact_note || "") + '" maxlength="120">' +
          '<div class="h">微信 / Line / 备用邮箱等，可留空。</div></div>' +
        '<button class="btn" id="save" type="submit" style="width:auto;padding:0 26px">保存</button>' +
        '<div class="msg err" id="err" role="alert"></div>' +
      '</form>' +
    '</div>' +

    '<div class="card sec">' +
      '<h2>学籍资料<span class="lock">🔒 由教务维护</span></h2>' +
      '<p class="note">以下内容由 AMAS 教务处按总校记录维护，学生无法自行修改。如发现错误，请联系教务同工更正。</p>' +
      ro("登录邮箱", reg.email) +
      ro("学号", reg.student_number || "待教务录入") +
      ro("学籍状态", ST[reg.status] || (prof.has_student_record ? reg.status : "尚无学籍记录")) +
      ro("修读项目", prog ? prog.name_zh + (prog.short_label ? "（" + prog.short_label + "）" : "") : "—") +
      ro("学习路径", PW[reg.pathway] || "—") +
      ro("学籍建立时间", d(reg.created_at)) +
      (reg.activated_at ? ro("正式注册时间", d(reg.activated_at)) : "") +
    '</div>' +

    (hq ? '<div class="card sec">' +
      '<h2>AMAS 总校审核<span class="lock">🔒 由教务维护</span></h2>' +
      '<p class="note">学籍建立以总校审核确认为前提。这里只显示结论摘要。</p>' +
      ro("审核结论", HQ[hq.status] || hq.status) +
      ro("确认时间", d(hq.confirmed_at)) +
      (hq.reference ? ro("批文编号", hq.reference) : "") +
      (hq.note ? ro("说明", hq.note) : "") +
    '</div>' : "");

  const err = document.getElementById("err");
  /* 这一块有两个状态：还没填 / 已经填好（刚存完）。
     「已经填好」那一版同时给出**完成出口** —— 待办是从学员中心点过来的，
     做完了得有一条路回去，而不是让他自己在导航里找。 */
  const phNote = document.getElementById("phNote");
  /* 三种状态，各说各的事：
       empty   还没填 —— 说清楚为什么要填，并给一步到那一格的入口；
       done    刚存好 —— 给完成出口（回学员中心）；
       pending 存好之后**又改了** —— 这一版还没保存。
     第三种是必须的：只有前两种时，他存完再改号码，页面还停在
       「联系电话已经填好了 · 回到学员中心 →」——
     把**上一版**的结论说成当前这一版，还顺手邀请他带着没保存的改动离开
     （本轮实测 Se2/Se3）。这与本页既有的 sameVersion 口径是同一条原则。 */
  let savedPhone = (self.phone || "").trim();          // 服务端已经存着的那一版
  function renderPhNote(state){
    const box = document.getElementById("phNote");
    if (!box) return;
    box.innerHTML =
      state === "done"
      ? '<div class="msg ok show" style="margin:0 0 12px" role="status">' +
        '联系电话已经填好了。' +
        '<div style="margin-top:8px"><a class="link" href="' + A.ROOT + 'portal/student/">' +
        '回到学员中心 →</a></div></div>'
      : state === "pending"
      ? '<div class="msg warn show" style="margin:0 0 12px" role="status">' +
        '你刚改的这一版<b>还没保存</b>。保存之后再离开。</div>'
      : state === "stale"
      /* 在途期间他又改了：成功的是**提交出去的那一版**，不是眼前这一版。
         两版都要说清楚，输入一个字都不动，也不给「回学员中心」那条出口
         —— 那等于邀请他带着没保存的改动离开。 */
      ? '<div class="msg warn show" style="margin:0 0 12px" role="status">' +
        '刚才提交的那一版（电话：<b>' + UI.esc(savedPhone || "（留空）") + '</b>）已经保存；' +
        '你之后改的这一版<b>还没保存</b>。</div>'
      : '<div class="msg info show" style="margin:0 0 12px" role="status">' +
        '<b>你还没有填写联系电话。</b>教务在需要时会用这个号码联系你。' +
        '<div style="margin-top:8px"><button class="btn ghost" type="button" data-gophone ' +
        'style="width:auto;padding:0 18px">去填联系电话</button></div></div>';
    const phNote = box;
    const jump = box.querySelector("[data-gophone]");
    if (jump) jump.addEventListener("click", () => {
      const el = document.getElementById("ph");
      el?.focus?.();
      if (el && el.setSelectionRange) { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
    });
  }
  let phState = (self.phone || "").trim() ? null : "empty";
  if (phState) renderPhNote("empty");
  /* 改了还没保存就离开时拦一下。共享层早就有 UI.formGuard（申请表单在用），
     这一页一直没挂 —— 用户改了手机号或联系方式，顺手点导航里的
     「首页 / 我的申请 / 帮助 / 退出」，输入就没了，连句提醒都没有。
     只在**确实改过**时拦：没改过或已经存好就不打扰。 */
  let dirty = false;
  ["nm", "ph", "ct"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", () => {
      dirty = true;
      /* 存好之后又动了电话这一格：那块提示不能再说「已经填好了」。 */
      if (id === "ph" && (phState === "done" || phState === "stale")) {
        phState = "pending"; renderPhNote("pending");
      }
    });
  });
  UI.formGuard(() => dirty);

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    const btn = document.getElementById("save");
    btn.disabled = true;
    /* 提交的是**这一刻**的这三个值。RPC 在途期间用户可能继续打字，
       所以把提交版本先拍下来 —— 成功只对这一版成立。 */
    const sentSnap = ["nm", "ph", "ct"].map((id) => (document.getElementById(id) || {}).value || "").join("\u0001");
    const sentPhone = (document.getElementById("ph") || {}).value.trim();   // 这一次**发出去的**那一版

    const { data: d2, error: e2 } = await Api.rpc("update_my_contact", {
      p_display_name: document.getElementById("nm").value.trim() || null,
      p_phone: document.getElementById("ph").value.trim(),
      p_contact_note: document.getElementById("ct").value.trim(),
    });
    btn.disabled = false;
    if (e2) { err.textContent = e2.message; err.classList.add("show"); return; }
    /* 成功要按契约验：update_my_contact 成功返回 jsonb_build_object('ok', true)
       （migrations/0017_student_experience.sql）。只凭「没有 error」就报已保存，
       结构对不上时会把没写成的当成写成了。属防御性边界，不声称真实服务上发生过。 */
    if (!d2 || d2.ok !== true) {
      err.textContent = "没能确认这次修改有没有保存成功，请稍后刷新核实。";
      err.classList.add("show");
      return;
    }
    /* 成功只清**这一版**的 dirty。监督独立复现（event7bd）：电话填 A 提交，
       await 期间改成 B，A 成功回来后无条件 dirty=false —— 页面上是还没保存的 B，
       离开却不再提醒，B 就这么丢了。
       版本变了就保住 dirty，并且成功文案不能暗示「你现在看到的这版已保存」。 */
    const nowSnap = ["nm", "ph", "ct"].map((id) => (document.getElementById(id) || {}).value || "").join("\u0001");
    const sameVersion = nowSnap === sentSnap;
    if (sameVersion) dirty = false;
    UI.toast(sameVersion ? "资料已保存" : "刚才提交的那一版已保存；之后改的还没保存");
    /* 存完之后把那块提示按**现在框里的值**改写：填好了就说填好了，并给回学员中心的路。
       只在这一版就是提交的那一版时才敢说「已经填好」—— 否则他之后改的那一版还没存。 */
    /* 原来只在 sameVersion 时更新这块提示 —— 于是「首次为空 → 填上 → 在途又改 →
       旧版成功」这条路上，提示会一直停在「你还没有填写联系电话」：
       既否认了刚存进去的那一版，也没说眼前这一版还没保存（本轮实测 Sp3/Sp4）。
       现在两支都更新，并且各说各的版本。 */
    savedPhone = sentPhone;
    if (sameVersion) {
      phState = savedPhone ? "done" : "empty";
    } else {
      phState = "stale";
    }
    renderPhNote(phState);
  });
})();
</script>
</body>
</html>
