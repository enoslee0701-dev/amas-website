<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>成绩单 | AMAS 学员中心</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202610232256">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202610232256"></script>
<script src="../../../assets/js/portal/auth.js?v=202610232256"></script>
<script src="../../../assets/js/portal/api.js?v=202610232256"></script>
<script src="../../../assets/js/portal/ui.js?v=202610232256"></script>
<script src="../../../assets/js/portal/shell.js?v=202610232256"></script>
<script src="../../../assets/js/portal/sis.js?v=202610232256"></script>
<script>
/* 学员管理系统：学员打印自己的学习记录（my_transcript，0033）。 */
(async function(){
  const A = window.AmasAuth, UI = window.AmasUI, Api = window.AmasApi, Shell = window.AmasShell, S = window.AmasSis;
  const mounted = await Shell.mount({ space: "student", title: "成绩单", allow: ["student"] });
  if (!mounted) return;
  const { main } = mounted;
  async function load(){
    UI.loading(main, 5);
    const { data, error } = await Api.rpc("my_transcript");
    if (error) return UI.error(main, { message: "这一次没能读到你的成绩单，请稍后重试。", onRetry: load });
    if (!data) return main.innerHTML = UI.box("🎓", "还没有学籍记录", "建档后可以在这里打印成绩单。");
    main.innerHTML = '<div class="bar no-print" style="margin-bottom:12px"><a class="link" href="' + A.ROOT + 'portal/student/records/">← 返回成绩与进度</a>' +
      '<button class="sbtn pri" id="print">打印 / 存为 PDF</button></div>' + S.transcriptHtml(data);
    main.querySelector("#print").addEventListener("click", () => window.print());
  }
  load();
})();
</script>
</body>
</html>
