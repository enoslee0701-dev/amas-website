body{background:#f5f6f3}.attendance{max-width:820px;margin:auto;padding:20px 16px 115px}.att-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.att-head h1{font-size:25px;margin:5px 0}.att-head small,.muted{color:#617080}.att-panel{background:#fff;border:1px solid #e0e5df;border-radius:16px;padding:18px;margin-top:18px}.att-fields{display:flex;flex-wrap:wrap;gap:12px}.att-fields label{display:grid;gap:6px;flex:1;min-width:150px}input,select,button{font:inherit;min-height:44px}input,select{width:100%;box-sizing:border-box;border:1px solid #c6cec9;border-radius:8px;padding:9px;background:#fff}.att-row{padding:16px 0;border-bottom:1px solid #e4e8e2}.att-row:last-child{border-bottom:0}.att-row strong{display:block;margin-bottom:10px}.att-options{display:flex;gap:6px;flex-wrap:wrap}.att-options button{font-size:14px;white-space:nowrap;border:1px solid #c7d0ca;background:#fff;color:#304a43;border-radius:9px;padding:7px 13px;min-width:48px}.att-options button[aria-pressed=true]{background:#204c40;color:#fff;border-color:#204c40}.att-options button[data-status=excused][aria-pressed=true]{background:#946218;border-color:#946218}.att-options button[data-status=absent][aria-pressed=true]{background:#a53c3c;border-color:#a53c3c}.att-note{margin-top:10px;font-size:14px}.att-savebar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce3dd;padding:12px 16px;z-index:5}.att-savebar>div{max-width:820px;margin:auto;display:flex;align-items:center;gap:16px;justify-content:space-between}.att-savebar .btn{width:auto;padding:0 30px}.att-empty{padding:20px 0;color:#617080}.att-summary{margin:14px 0 0;line-height:1.8}.sbtn{border:1px solid #bdd0c4;border-radius:8px;padding:9px 12px;background:#edf4ef;color:#244b3b}.att-note.muted{display:block}.att-panel h2{font-size:18px;margin-top:0}button:disabled{opacity:.6;cursor:wait}#status{scroll-margin-top:16px}#history{margin:14px 0}.att-row[hidden]{display:none}@media(max-width:460px){.att-options{gap:5px}.att-options button{flex:1;padding:7px 4px}.att-head h1{font-size:23px}}
</style>
<style>
.attendance{max-width:900px}.att-panel{padding:16px;margin-top:14px}.att-head h1{font-size:23px}.att-intro{font-size:14px;color:#617080;margin:8px 0}.att-fields{gap:10px}.att-fields label{min-width:130px}.att-lesson details{margin-top:8px}.att-lesson summary{cursor:pointer;color:#617080;font-size:14px;min-height:44px;align-content:center}.att-roster-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.att-roster-head h2{margin:0}.att-toolbar{display:flex;align-items:center;gap:8px;margin-top:12px}.att-toolbar input{flex:1;min-width:0}.att-toolbar .sbtn{white-space:nowrap;flex-shrink:0}.att-summary{font-size:13px;margin:10px 0;line-height:1.8;text-align:left;width:100%;border:0;background:transparent;min-height:44px;padding:0}.att-hint{font-size:12px;color:#617080;margin:8px 0 0}.att-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.att-person{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:68px;padding:8px 5px;border:1px solid #d5ddd8;border-radius:10px;background:#f7f8f6;color:#3d4c45;cursor:pointer;overflow-wrap:anywhere}.att-person strong{font-size:15px;font-weight:650;line-height:1.35}.att-badge{font-size:12px;line-height:1.3}.att-person[data-current-status=present]{background:#edf6ef;border-color:#b5d6bf;color:#24573a}.att-person[data-current-status=late]{background:#fff6e5;border-color:#e7ca86;color:#78520a}.att-person[data-current-status=excused]{background:#eef3ff;border-color:#b8c9e7;color:#355a90}.att-person[data-current-status=absent]{background:#fff0ef;border-color:#e5b7b3;color:#9d3830}.att-person:focus-visible,.sbtn:focus-visible{outline:3px solid #2d6ea1;outline-offset:2px}.att-person[hidden]{display:none}.att-savebar>div{max-width:900px}.att-dialog{background:#fff;border:0;border-radius:18px;padding:20px;width:100%;max-width:400px;max-height:100%;overflow:auto;margin:auto;box-sizing:border-box;box-shadow:0 15px 70px #142b3940}.att-editor-overlay[open]{display:grid;position:fixed;inset:0;z-index:50;background:#122b3d80;padding:16px;place-items:center;box-sizing:border-box;overflow:auto}.att-modal-open{overflow:hidden}.att-dialog h2{margin:0 0 6px;font-size:22px}.att-dialog p{margin:0 0 16px;font-size:14px;color:#617080}.att-dialog .att-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.att-dialog .att-options button{min-height:48px;font-size:16px}.att-dialog details{margin:16px 0}.att-dialog summary{cursor:pointer;min-height:44px;align-content:center;font-size:14px}.att-dialog .att-note{width:100%;font-size:16px}.att-dialog .dialog-back{width:100%;margin-top:8px}.att-board{padding:0;border:0;width:100%;max-width:none;height:100vh;max-height:none;margin:0;background:#f5f6f3}.att-board[open]{display:flex;flex-direction:column;position:fixed;inset:0;z-index:40}.att-board .att-panel{margin:0;border:0;border-radius:0;display:flex;flex-direction:column;flex:1;min-height:0;padding:16px}.att-board #roster{overflow:auto;align-content:start;flex:1;min-height:0;padding:3px}.att-board .att-savebar{position:static;flex-shrink:0;padding-bottom:max(12px,env(safe-area-inset-bottom))}.att-board .att-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.att-board #openBoard{display:none}.att-board-date{font-size:13px;color:#617080;margin:5px 0 0}.att-person:disabled{cursor:default}.att-board:not([open]),.att-editor-overlay:not([open]){display:none}@media(max-width:560px){.attendance{padding:14px 12px 105px}.att-panel{padding:12px}.att-grid,.att-board .att-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.att-person{min-height:64px}.att-roster-head h2{font-size:18px}.att-summary{font-size:12px}.att-board .att-panel{padding:12px}.att-options button{flex:initial}}
</style>

<body>
<script src="../../assets/vendor/supabase-js@2.116.0/supabase.min.js"></script>
<script src="../../assets/js/supabase-config.js?v=202610271413"></script>
<script src="../../assets/js/portal/auth.js?v=202610271413"></script>
<script src="../../assets/js/portal/api.js?v=202610271413"></script>
<script src="../../assets/js/portal/ui.js?v=202610271413"></script>
<script>
(async function(){
 const A=window.AmasAuth,Api=window.AmasApi,UI=window.AmasUI;
 A.watchSession();const ctx=await A.requireRoleAal2(['attendance_clerk']);if(!ctx)return;
 const main=document.createElement('main');main.className='attendance';document.body.appendChild(main);
 main.innerHTML='<header class="att-head"><div><small id="attendanceWho">AMAS · 考勤负责人</small><h1>10月班考勤</h1></div><button id="out" type="button" class="link">退出登录</button></header>'+
 '<p class="att-intro">确认到齐后一键出席，点姓名修改请假、缺席或迟到。保存后生效。</p>'+
 '<section class="att-panel att-lesson"><div class="att-fields"><label for="day">上课日期<input type="date" id="day"></label><label for="session">课次<select id="session"></select></label></div><details id="newTitle"><summary>课程 / 主题（选填）</summary><input id="title" aria-label="课程或主题" maxlength="120" placeholder="例如：第3课"></details><button type="button" class="link" id="reload">重新读取这一天</button></section>'+
 '<section class="att-panel" id="rosterPanel"><div id="status" class="msg" role="status" tabindex="-1"></div><div class="att-roster-head"><div><h2 id="rosterTitle">本班名单</h2><p id="boardDate" class="att-board-date"></p></div><button id="openBoard" type="button" class="sbtn">全屏点名</button><button id="closeBoard" type="button" class="sbtn" hidden>返回</button></div><div class="att-toolbar"><input id="search" type="search" aria-label="查找姓名" placeholder="查找姓名"><button id="present" type="button" class="sbtn">一键出席</button></div><p class="att-hint">只将未登记成员设为出席，已标记的请假、缺席和迟到保留。</p><button id="summary" type="button" class="att-summary link" aria-live="polite" aria-pressed="false" title="点击切换：只看未登记 / 全部成员"></button><div id="incomplete" class="notice" hidden><p id="incompleteText"></p><button id="backToMark" type="button" class="sbtn">返回补登</button> <button id="saveIncomplete" type="button" class="sbtn">保存未完成记录</button></div><div id="roster" class="att-grid"></div></section>'+
 '<footer class="att-savebar" id="savebar"><div><span id="saveState" role="status">正在读取…</span><button class="btn" id="save" type="button" disabled>保存考勤</button></div></footer>'+
 '<div id="board" class="att-board" role="dialog" aria-modal="true" aria-labelledby="rosterTitle" hidden></div>'+
 '<div id="memberEditor" class="att-editor-overlay" role="dialog" aria-modal="true" aria-labelledby="memberName" hidden><div class="att-dialog"><h2 id="memberName"></h2><p>点选状态，即可返回全班名单。</p><div id="memberOptions" class="att-options" role="group" aria-label="考勤状态"></div><details id="noteDetails"><summary>考勤备注（选填）</summary><label for="memberNote" class="muted">勿填病情等隐私</label><input id="memberNote" class="att-note" maxlength="500" placeholder="例如：已提前请假"></details><button id="closeMember" class="sbtn dialog-back" type="button">返回名单</button></div></div>';
 A.getProfile().then(p=>{if(p?.display_name&&!A.sessionEnded())main.querySelector('#attendanceWho').textContent=p.display_name+' · 考勤负责人';}).catch(()=>{});
 const $=s=>main.querySelector(s);const STATES=[['','未登记'],['present','出席'],['late','迟到'],['excused','请假'],['absent','缺席']];
 let data=null,selected=null,draft=new Map(),dirty=false,busy=false,uncertain=false,loadedDay='',editing=null,returnCard=null,boardSearch='',onlyUnmarked=false,boardOnlyUnmarked=false;
 const panelHome=document.createComment('roster panel'),saveHome=document.createComment('save controls');
 $('#rosterPanel').before(panelHome);$('#savebar').before(saveHome);
 $('#memberOptions').innerHTML=STATES.map(([v,t])=>'<button type="button" data-status="'+v+'" aria-pressed="false">'+t+'</button>').join('');
 $('#day').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 $('#out').onclick=()=>{if(!dirty||confirm('还有未保存的考勤，确定退出吗？')){dirty=false;A.signOut();}};
 function say(text,error=false){const el=$('#status');el.className='msg show '+(error?'err':'ok');el.textContent=text;}
 function state(){ $('#save').disabled=busy||!dirty||uncertain||!data?.roster.length;$('#present').disabled=busy||uncertain||!data?.roster.length;$('#openBoard').disabled=busy||!data?.roster.length;
 main.querySelectorAll('.att-person,[data-status],#memberNote').forEach(el=>el.disabled=busy||uncertain);
 $('#saveState').textContent=busy?'正在处理…':!data?'名单未读取，请重试':uncertain?'结果待核实，请重新读取':dirty?'有未保存的修改':'已与系统记录同步';
 ['#day','#session','#reload','#title','#search','#summary','#backToMark','#saveIncomplete'].forEach(id=>$(id).disabled=busy||(!data&&['#session','#title','#search'].includes(id))); 
 }
 function counts(){$('#incomplete').hidden=true;const c={};for(const v of draft.values())c[v.status]=(c[v.status]||0)+1;$('#summary').textContent=STATES.map(([s,t])=>t+' '+(c[s]||0)).join(' · ');state();}
 function filter(){const q=$('#search').value.trim().toLowerCase();main.querySelectorAll('.att-person').forEach(el=>el.hidden=!el.dataset.name.includes(q)||(onlyUnmarked&&el.dataset.currentStatus!==''));}
 function paintPerson(id){const el=$('#roster').querySelector('[data-id="'+id+'"]'),m=draft.get(id);if(!el||!m)return;const name=data.roster.find(p=>p.id===id)?.name||'未填姓名',label=STATES.find(s=>s[0]===m.status)[1];el.dataset.currentStatus=m.status;el.querySelector('.att-badge').textContent=label+(m.note?' · 有备注':'');el.setAttribute('aria-label',name+'，'+label+(m.note?'，有备注':'')+'，点击修改');}
 function isOpen(id){return $(id).hasAttribute('open');}
 function topLayer(){return isOpen('#memberEditor')?$('#memberEditor'):isOpen('#board')?$('#board'):null;}
 function syncLayers(){const top=topLayer();Array.from(main.children).forEach(el=>{if(top&&el!==top){el.setAttribute('aria-hidden','true');el.style.pointerEvents='none';}else{el.removeAttribute('aria-hidden');el.style.pointerEvents='';}});document.body.classList.toggle('att-modal-open',!!top);}
 function openLayer(el,focus){el.hidden=false;el.setAttribute('open','');el.removeAttribute('aria-hidden');el.style.pointerEvents='';focus.focus();syncLayers();}
 function closeMember(){if(!isOpen('#memberEditor'))return;$('#memberEditor').hidden=true;$('#memberEditor').removeAttribute('open');editing=null;syncLayers();if(returnCard?.isConnected)returnCard.focus();}
 function closeBoard(){if(isOpen('#memberEditor'))closeMember();$('#board').hidden=true;$('#board').removeAttribute('open');panelHome.after($('#rosterPanel'));saveHome.after($('#savebar'));$('#closeBoard').hidden=true;$('#search').value=boardSearch;onlyUnmarked=boardOnlyUnmarked;$('#summary').setAttribute('aria-pressed',String(onlyUnmarked));filter();syncLayers();$('#openBoard').focus();}
 function fitBoard(){if(isOpen('#board'))$('#board').style.height=window.innerHeight+'px';}
 document.addEventListener('keydown',e=>{const top=topLayer();if(!top||e.isComposing)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();if(isOpen('#memberEditor'))closeMember();else closeBoard();return;}if(e.key!=='Tab')return;const controls=Array.from(top.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),summary,[tabindex="0"]')).filter(el=>el.getClientRects().length>0),first=controls[0],last=controls[controls.length-1];if(!first)return;if(e.shiftKey&&(document.activeElement===first||!controls.includes(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||!controls.includes(document.activeElement))){e.preventDefault();first.focus();}});
 window.addEventListener('resize',fitBoard);
 function editPerson(id){if(busy||uncertain||!draft.has(id))return;editing=id;returnCard=$('#roster').querySelector('[data-id="'+id+'"]');const m=draft.get(id);$('#memberName').textContent=data.roster.find(p=>p.id===id)?.name||'未填姓名';$('#memberNote').value=m.note;$('#noteDetails').open=false;main.querySelectorAll('[data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===m.status)));openLayer($('#memberEditor'),$('#memberOptions').querySelector('[aria-pressed="true"]'));}
 function renderRoster(){
  $('#roster').innerHTML=data.roster.length?data.roster.map(p=>'<button type="button" class="att-person" data-id="'+p.id+'" data-name="'+UI.esc((p.name||'').toLowerCase())+'" aria-haspopup="dialog" aria-controls="memberEditor"><strong>'+UI.esc(p.name||'未填姓名')+'</strong><span class="att-badge"></span></button>').join(''):'<p class="att-empty">本班暂时没有名单，请联系教务核对分班。</p>';
  main.querySelectorAll('.att-person').forEach(b=>{paintPerson(Number(b.dataset.id));b.onclick=()=>editPerson(Number(b.dataset.id));});$('#boardDate').textContent=loadedDay+(selected?.title?' · '+selected.title:' · 新建当日考勤');filter();counts();
 }
 main.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{if(busy||uncertain||!draft.has(editing))return;draft.get(editing).status=b.dataset.status;dirty=true;paintPerson(editing);counts();filter();closeMember();});
 $('#memberNote').oninput=()=>{if(busy||uncertain||!draft.has(editing))return;draft.get(editing).note=$('#memberNote').value;dirty=true;paintPerson(editing);counts();};
 $('#closeMember').onclick=closeMember;
 $('#openBoard').onclick=()=>{if(busy||!data?.roster.length)return;boardSearch=$('#search').value;boardOnlyUnmarked=onlyUnmarked;onlyUnmarked=false;$('#summary').setAttribute('aria-pressed','false');$('#search').value='';filter();$('#board').append($('#rosterPanel'),$('#savebar'));$('#closeBoard').hidden=false;openLayer($('#board'),$('#closeBoard'));fitBoard();};
 $('#closeBoard').onclick=closeBoard;
 function selectSession(id){selected=data.sessions.find(s=>s.id===id)||null;if(selected?.roster)data.roster=selected.roster;else data.roster=data.currentRoster;draft=new Map(data.roster.map(p=>[p.id,{id:p.id,status:'',note:''}]));for(const m of selected?.marks||[])if(draft.has(m.id))draft.set(m.id,{id:m.id,status:m.status,note:m.note});dirty=false;uncertain=false;$('#newTitle').hidden=!!selected;$('#title').value='';renderRoster();}
 function validate(d){return d&&d.cohort==='10月班'&&d.day===$('#day').value&&Array.isArray(d.roster)&&Array.isArray(d.sessions)&&new Set(d.roster.map(p=>p.id)).size===d.roster.length&&d.roster.every(p=>Number.isSafeInteger(p.id)&&typeof p.name==='string')&&d.sessions.every(s=>(!s.roster||(Array.isArray(s.roster)&&s.roster.every(p=>Number.isSafeInteger(p.id)&&typeof p.name==='string')&&new Set(s.roster.map(p=>p.id)).size===s.roster.length))&&typeof s.id==='string'&&typeof s.title==='string'&&Number.isSafeInteger(s.version)&&Array.isArray(s.marks)&&s.marks.every(m=>Number.isSafeInteger(m.id)&&STATES.some(x=>x[0]===m.status)&&typeof m.note==='string'));}
 async function call(name,args){let timer;try{return await Promise.race([Api.rpc(name,args),new Promise(resolve=>{timer=setTimeout(()=>resolve({error:true}),20000);})]);}catch(e){return {error:true};}finally{clearTimeout(timer);}}
 async function load(){busy=true;state();const result=await call('attendance_day',{p_day:$('#day').value});busy=false;
  if(result.error||!validate(result.data)){data=null;$('#roster').innerHTML='<p class="att-empty">未能读取名单，这不表示没有记录。</p>';say('读取失败，请重试。',true);state();return false;}
  data=result.data;data.currentRoster=data.roster;loadedDay=data.day;$('#session').innerHTML=data.sessions.length?data.sessions.map(s=>'<option value="'+UI.esc(s.id)+'">'+UI.esc(s.title||'当日考勤')+'</option>').join(''):'<option value="">新建当日考勤</option>';
  selectSession(data.sessions.some(s=>s.id===selected?.id)?selected.id:data.sessions[0]?.id);return true;
 }
 $('#day').onchange=async()=>{if(dirty&&!confirm('这一天有未保存的修改，确定切换日期吗？')){$('#day').value=loadedDay;return;}dirty=false;uncertain=false;await load();};
 $('#session').onchange=()=>{if(dirty&&!confirm('有未保存的修改，确定切换课次吗？')){$('#session').value=selected?.id||'';return;}selectSession($('#session').value);};
 $('#reload').onclick=async()=>{if(dirty&&!confirm(uncertain?'重新读取以核实系统记录；未保存的修改会丢弃，继续吗？':'丢弃未保存修改并重新读取吗？'))return;if(await load())say('已重新读取，请核对考勤。');};
 $('#search').oninput=filter;
 $('#summary').onclick=()=>{onlyUnmarked=!onlyUnmarked;$('#summary').setAttribute('aria-pressed',String(onlyUnmarked));filter();};
 $('#backToMark').onclick=()=>{$('#incomplete').hidden=true;onlyUnmarked=true;$('#search').value='';$('#summary').setAttribute('aria-pressed','true');filter();$('#roster').querySelector('.att-person:not([hidden])')?.focus();};
 $('#saveIncomplete').onclick=()=>{if(!$('#incomplete').hidden)persist();};
 $('#title').oninput=()=>{dirty=true;state();};
 $('#present').onclick=()=>{if(!data||busy||uncertain)return;let changed=false;for(const m of draft.values())if(m.status===''){m.status='present';changed=true;}if(!changed)return;dirty=true;main.querySelectorAll('.att-person').forEach(b=>paintPerson(Number(b.dataset.id)));counts();filter();};
 $('#save').onclick=()=>{if(busy||uncertain||!dirty||!data)return;const missing=[...draft.values()].filter(m=>!m.status).length;if(missing){$('#incompleteText').textContent='还有 '+missing+' 人未登记。未登记不会算作出席；可返回补登，也可保存未完成记录稍后继续。';$('#incomplete').hidden=false;$('#backToMark').focus();return;}persist();};
 async function persist(){
  if(busy||uncertain||!dirty||!data)return;busy=true;state();main.querySelectorAll('[data-status],[data-note]').forEach(el=>el.disabled=true);
  const r=await call('attendance_save',{p_day:loadedDay,p_session:selected?.id||null,p_version:selected?.version||0,p_title:$('#title').value,p_entries:[...draft.values()]});busy=false;
  if(r.error||!r.data||typeof r.data.ok!=='boolean'||(r.data.ok&&(!r.data.session||!Number.isSafeInteger(r.data.version)))){uncertain=true;say('没有收到可靠的保存结果。请重新读取这一天核实，暂时不要重复登记。',true);state();return;}
  if(!r.data.ok){const msg={conflict:'记录已被其他人修改，请重新读取后核对。',reload_required:'这一天已有考勤，请重新读取核对，系统没有重复新建。',outside_roster:'班级名单已变化，请重新读取。',outside_cohort:'无权修改这次考勤。',validation_failed:'内容未通过检查，请核对状态和备注。'};uncertain=true;say(msg[r.data.error]||'保存未完成，请重新读取核对。',true);state();return;}
  dirty=false;selected={id:r.data.session,version:r.data.version};if(await load()){const missing=[...draft.values()].filter(m=>!m.status).length;say(missing?'未完成记录已保存，还有 '+missing+' 人未登记。':'考勤已保存。');}
 }
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
 await load();
})();
</script>
