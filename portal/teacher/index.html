<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>教师工作台 | AMAS</title>
<link rel="icon" href="../../assets/img/favicon.png">
<link rel="stylesheet" href="../../assets/css/portal.css?v=202610282255">
</head>
<body>
<script src="../../assets/vendor/supabase-js@2.116.0/supabase.min.js"></script>
<script src="../../assets/js/supabase-config.js?v=202610282255"></script>
<script src="../../assets/js/portal/auth.js?v=202610282255"></script>
<script src="../../assets/js/portal/api.js?v=202610282255"></script>
<script src="../../assets/js/portal/ui.js?v=202610282255"></script>
<script src="../../assets/js/portal/shell.js?v=202610282255"></script>
<script>
/* 教师工作台。

   本页原来直接用 A.requireRoleAal2 + 手写 brandbar，**没有走 Shell** ——
   于是教师空间是四个空间里唯一没有导航条的：登录进来只有这一页，
   「我的资料」之类的页面根本无从进入。现改为 Shell.mount，与其余三个空间一致。
   身份条与退出键由 Shell 渲染，这里不再自己写一份。

   教职档案读 public.teacher_profiles（tp_select：user_id = auth.uid() 或管理员，
   0004_teacher_verification.sql:277）。该表对 authenticated **撤销了写权限**
   （0004:281），所以本页只读、不给编辑入口。 */
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell;
  const mounted = await Shell.mount({ space: "teacher", title: "教师工作台",
                                      allow: ["teacher", "mentor"], requireAal2: true });
  if (!mounted) return;
  const { main, ctx } = mounted;

  const isTeacher = ctx.roles.includes("teacher");
  const isMentor = ctx.roles.includes("mentor");
  const heading = isTeacher ? (isMentor ? "教学与导师工作台" : "教师工作台") : "导师工作台";
  document.title = heading + " | AMAS";
  const TS = { active: "在职", leave: "休假", suspended: "已暂停", departed: "已离任" };
  const d = (v) => v ? new Date(v).toLocaleDateString("zh-CN") : "—";

  UI.loading(main, 3);
  const { data: tp, error } = isTeacher ? await Api.select("teacher_profiles", {
    columns: "staff_number,public_name,status,verified_at",
    eq: { user_id: ctx.session.user.id },
    single: true,
  }) : { data: null, error: null };

  /* 三种情况分开说，不混为一谈：
       有档案      显示工号与状态
       没有档案    验证通过后教务才建档，如实说「还没有」而不是「读取失败」
       读取出错    说读不到并给刷新，不能把「出错」显示成「没有档案」 */
  const tpBox = error
    ? '<div class="msg warn show">暂时读不到教职档案，请稍后刷新；若持续如此请联系教务同工。</div>'
    : tp
    ? '<div class="msg info show">教职工号：<b>' + UI.esc(tp.staff_number || "待教务分配") +
      '</b> ｜ 状态：<b>' + UI.esc(TS[tp.status] || tp.status) +
      '</b> ｜ 验证时间：' + d(tp.verified_at) + '</div>'
    : '<div class="msg info show">还没有教职档案记录。教师身份通过验证后，教务会建立这份档案。</div>';

  main.innerHTML =
    '<h1>' + heading + '</h1>' +
    '<p class="lead">' + (isTeacher ? '只处理教务排给你的课程班。课程总评提交后，由教务审核发布。' : '只查看教务分配给你的学员，记录学习陪伴与反馈。') + '</p>' +
    (isTeacher ? '<h3 style="color:var(--navy);margin:20px 0 8px">我的教师档案</h3>' + tpBox : '') +
    '<p class="note"><a class="link" href="' + A.ROOT + 'portal/teacher/profile/">维护我的联系方式</a></p>' +

    '<h3 style="color:var(--navy);margin:22px 0 8px">工作入口</h3>' +
    '<div class="spaces">' +
      (isTeacher ? '<a href="' + A.ROOT + 'portal/teacher/classes/"><span class="ic">📚</span><span><b>我的课程</b>' +
        '<span>上课登记、点名、作业评分、课程总评</span></span></a>' : '') +
      (isMentor ? '<a href="' + A.ROOT + 'portal/teacher/mentees/"><span class="ic">🤝</span><span><b>我带的学员</b>' +
        '<span>查看已分配学员的进度、写陪伴记录</span></span></a>' : '') +
    '</div>';
})();
</script>
</body>
</html>
