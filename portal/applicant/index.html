<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>申请者中心 | AMAS</title>
<link rel="icon" href="../../assets/img/favicon.png">
<link rel="stylesheet" href="../../assets/css/portal.css?v=202609132127">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../assets/js/supabase-config.js?v=202609132127"></script>
<script src="../../assets/js/portal/auth.js?v=202609132127"></script>
<script src="../../assets/js/portal/api.js?v=202609132127"></script>
<script src="../../assets/js/portal/ui.js?v=202609132127"></script>
<script src="../../assets/js/portal/shell.js?v=202609132127"></script>
<script>
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell;
  const mounted = await Shell.mount({
    space: "applicant", title: "申请者中心",
    allow: ["applicant","student","registrar","academic_admin","super_admin"],
  });
  if (!mounted) return;
  const { main, profile } = mounted;

  const ST = {
    draft:{t:"草稿",a:"继续填写",d:"申请尚未提交。"},
    submitted:{t:"已提交",a:"查看申请",d:"已进入招生流程，等待教务查阅。"},
    under_review:{t:"审核中",a:"查看申请",d:"招生同工正在审核。"},
    needs_information:{t:"需补充资料",a:"立即补充",d:"有资料需要你补充后重新提交。"},
    accepted:{t:"已录取",a:"查看结果",d:"录取不等于学籍建立；学籍须由 AMAS 总校审核确认后由教务建档。"},
    rejected:{t:"未通过",a:"查看结果",d:""},
  };

  UI.loading(main, 4);
  const [{ data: rows, error }, { data: pc }] = await Promise.all([
    Api.rpc("my_application"),
    Api.select("program_catalog", { columns: "code,name_zh,short_label", order: { column: "sort_order", asc: true } }),
  ]);
  if (error) return UI.error(main, { message: error.message, onRetry: () => location.reload() });
  const app = rows && rows[0];
  const pcMap = Object.fromEntries((pc || []).map(p => [p.code, p]));

  /* 待补充项数：读不到 ≠ 没有。原来只解构 data，读失败时 rq 是 null，
     pending 就成了 0，那条「有 N 项资料需要补充」的横幅**直接消失** ——
     申请人看到「需补充资料」的状态，却看不到任何待办，会以为已经补完了。 */
  let pending = 0, reqTotal = 0, pendingUnknown = false;
  if (app && app.status === "needs_information") {
    const { data: rq, error: rqErr } = await Api.select("application_requirements", {
      columns: "id,resolved", eq: { application_id: app.id },
    });
    if (rqErr || !Array.isArray(rq)) pendingUnknown = true;
    else { reqTotal = rq.length; pending = rq.filter(r => !r.resolved).length; }
  }

  const name = profile && profile.display_name ? profile.display_name : "";
  const s = app ? (ST[app.status] || { t: app.status, a: "查看申请", d: "" }) : null;
  const code = app && app.form_data && Array.isArray(app.form_data.programs) ? app.form_data.programs[0] : null;
  const prog = code ? pcMap[code] : null;

  /* PORTAL-blueprint §234 规定这一页是「状态卡 + 下一步 + **通知**」。
     通知这一块此前整个没有：my_application 明明返回了
     applicant_visible_message（教务写给申请人的话，
     见 migrations/0008_applications.sql:197/201），申请详情页与历史页都把它
     显示成「招生同工留言」，唯独申请人自己的首页不显示 —— 教务让他补材料、
     或者给了录取说明，他登进来只看到一个状态标签和一句固定描述，
     得再点一层才知道对方说了什么。
     这里用的是**已经取回来的同一份数据**，不额外发请求。
     留言是服务端来的文本，一律走 UI.esc，不当 HTML 解析。 */
  /* 留言**是不是真的有一句话**要按 —— 空串、全空白都不算。
     下面「没有列条目」那一支会让他「按上面的留言」补，而这一块只有有内容时才渲染；
     两处必须用同一个判断，否则会把他指向一段不存在的说明。
     全空白还会渲染出一个「招生同工留言：」后面什么都没有的空块。 */
  const noticeText = app ? String(app.applicant_visible_message || "").trim() : "";
  const notice = noticeText
    ? `<div class="msg info show" style="margin-top:10px"><b>招生同工留言：</b>${UI.esc(noticeText)}</div>`
    : "";

  /* 「需补充资料」底下其实有三种**不同**的下一步，此前都压成同一句
     「有资料需要你补充后重新提交」加一个「立即补充」：

       · 还有没标完的       —— 去补（原有说法不动）；
       · 条目全部标完了     —— 就差**重新提交**这一下。服务端正是按 unresolved = 0
         放行的（0008_applications.sql:241-246），他要是不知道还差这一步，
         就会守着一个「需补充资料」的状态一直等教务，而教务那边什么也不会来；
       · 教务只写了留言、没列条目 —— review_application 的 p_requirements 是可选的
         （0008 那一段 `if p_action = 'needs_information' and p_requirements is not null`），
         所以这种情况是真会出现的。那就没有「都已完成」这回事，只能按留言补。

     这里不新增任何业务规则，只是把服务端已有的那条规则如实说给他听。 */
  let nextNote = "", actionLabel = s ? s.a : "";
  if (app && app.status === "needs_information") {
    const info = (t) => `<div class="msg info show" style="margin-top:10px">${t}</div>`;
    if (pendingUnknown) {
      nextNote = info("没能确认还有多少项资料需要补充（这一次没读到）。请打开申请页查看。");
    } else if (pending) {
      nextNote = info(`有 <b>${pending}</b> 项资料需要补充。`);
    } else if (reqTotal) {
      nextNote = info("需要补充的资料<b>都已标记为完成</b> —— 回到申请页重新提交。");
      actionLabel = "去重新提交";
    } else if (noticeText) {
      nextNote = info("教务这次<b>没有列出</b>具体的补充条目，请按上面的留言补充后重新提交。");
    } else {
      /* 既没有条目、也没有留言 —— 我们这边**没有任何信息**说明要补什么。
         这一支按契约不该出现（招生页至少要填一条：admissions/index.html:716；
         Edge review-application 也直接拒空 requirements：validate.mjs:59-61）。
         但 DB 的 review_application 两个参数都可选、且 grant 给 service_role，
         Edge 目前又未部署，所以真发生时页面得说人话：不猜、不催他提交。 */
      nextNote = info("这次<b>没有列出</b>需要补充的条目，也没有留下说明 —— " +
        "<b>现在无法确认要补什么</b>。请先<a class=\"link\" href=\"" + A.ROOT + "help/\">联系招生同工</a>" +
        "问清楚，不要凭猜测直接重新提交。");
      actionLabel = "查看申请";
    }
  }

  main.innerHTML =
    "<h1>欢迎" + (name ? "，" + UI.esc(name) : "") + "</h1>" +
    '<p class="lead">这里可以提交并跟进你的入学申请。正式学员身份将在教务建档后开通。</p>' +
    (app ? `
      <div class="card" style="margin-bottom:16px">
        <div class="pagehead" style="margin:0">
          <div>
            <h2 style="margin:0;font-size:17px">当前申请 <span class="st ${app.status}">${s.t}</span></h2>
            <div class="who" style="margin-top:6px">${UI.esc(s.d)}</div>
            ${prog
              ? `<div class="who" style="margin-top:4px">申请项目：<b>${UI.esc(prog.name_zh)}</b>${prog.short_label ? "（" + UI.esc(prog.short_label) + "）" : ""}</div>`
              /* 课程目录没读到时，至少把申请人自己填的项目代码显示出来，
                 而不是让整行凭空消失。 */
              : (code ? `<div class="who" style="margin-top:4px">申请项目：<b>${UI.esc(code)}</b></div>` : "")}
            ${notice}
            ${nextNote}
          </div>
          <a class="btn" style="width:auto;padding:0 22px;margin:0" href="application/">${UI.esc(actionLabel)}</a>
        </div>
      </div>` : `
      <div class="card" style="margin-bottom:16px">
        <h2 style="font-size:17px">开始你的入学申请</h2>
        <p class="sub">正式申请包含基本资料、信仰与教会、学历经历、申请意向与个人见证；可随时保存草稿。</p>
        <a class="btn" style="width:auto;padding:0 22px" href="application/">开始填写申请</a>
      </div>`) +
    '<h2 style="font-size:16px;color:var(--navy);margin:20px 0 10px">其他入口</h2>' +
    '<div class="spaces">' +
      '<a href="' + A.ROOT + 'discover.html"><span class="ic">🧭</span><span><b>3 分钟信仰成长快速探索</b><span>初步了解自己的学习起点（结果仅作参考）</span></span></a>' +
      '<a href="' + A.ROOT + 'index.html#courses"><span class="ic">📚</span><span><b>浏览 67 门官方课程</b><span>七大类课程目录与培养项目</span></span></a>' +
      '<a href="' + A.ROOT + 'help/"><span class="ic">💬</span><span><b>帮助中心</b><span>常见问题与联系招生同工</span></span></a>' +
    '</div>';
})();
</script>
</body>
</html>
