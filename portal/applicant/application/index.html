<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>我的申请 | AMAS 申请者中心</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202609130335">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202609130335"></script>
<script src="../../../assets/js/portal/auth.js?v=202609130335"></script>
<script src="../../../assets/js/portal/api.js?v=202609130335"></script>
<script src="../../../assets/js/portal/ui.js?v=202609130335"></script>
<script src="../../../assets/js/portal/shell.js?v=202609130335"></script>
<script src="../../../assets/js/portal/application-form.js?v=202609130335"></script>
<script>
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell, F = window.AmasAppForm;
  const mounted = await Shell.mount({
    space: "applicant", title: "申请者中心",
    allow: ["applicant","student","registrar","academic_admin","super_admin"],
  });
  if (!mounted) return;
  const { main, ctx } = mounted;
  const uid = ctx.session.user.id;

  const ST = {
    draft:{t:"草稿",d:"尚未提交，可继续填写。"},
    submitted:{t:"已提交",d:"已进入招生流程，等待教务查阅。"},
    under_review:{t:"审核中",d:"招生同工正在审核你的申请。"},
    needs_information:{t:"需补充资料",d:"请按下方要求补充后重新提交。"},
    accepted:{t:"已录取",d:"录取不等于学籍建立；学籍须由 AMAS 总校审核确认后由教务建档。"},
    rejected:{t:"未通过",d:"如有疑问请联系招生同工。"},
    withdrawn:{t:"已撤回",d:"此申请已撤回。"},
  };
  const EDITABLE = ["draft","needs_information"];

  let app = null, programs = [], reqs = [], dirty = false, saveTimer = null, step = 0;

  /* 这一页有四条写入：创建草稿、自动保存、标记补件完成、提交申请。
     判据与 portal/admin/*（第六包）同一套：
       network / server_error / unknown（或压根没有错误码）＝ **请求可能已经生效**。
         对这一页来说，重来一次的代价很具体：会多出一份申请、会再走一次审核流程。
       服务端给了错误码 ＝ 确定没执行，如实说并允许重来。 */
  /* 冲突之后要能把编辑救回来。第十九包只做到「不自动重载、编辑留在屏幕上」，
     但用户一点「重新载入」，他刚填的东西还是全没了 —— 等于让他把一份长表单
     手抄一遍（基本资料 / 信仰与教会 / 学历 / 见证）。

     这里改成：先把当前草稿暂存，再去取最新版本，回来给他一键恢复。
     用 **sessionStorage** 而不是 localStorage —— 申请资料里有姓名、教会、
     见证这些个人信息，只应跟着这一个标签页走：刷新还在，标签页一关就没了，
     不跨标签、不长期留在机器上。
     恢复永远由他点，**绝不自动应用**；恢复时只覆盖未锁定的字段，
     免得把锁定字段写回去被服务端整单拒绝（0008 的 lock guard）。 */
  /* 暂存里装的是姓名、教会、见证这些个人资料，所以键名带上命名空间，
     内容带上用户身份：
       · 换一个账号绝不能把上一个人的草稿恢复出来（哪怕 app.id 撞上）；
       · 主动退出时由 auth.js 按 "amas." 前缀一并清掉 —— 神学院的公用电脑上，
         下一个人不该还能在这个标签页里翻到前一个人的申请资料。 */
  const DRAFT_KEY = "amas.draft.application";
  /** 暂存并**明确回报成功与否**。原来这里是 `catch (e) {}` 外加一句
      「存不下就算了」—— 然后照样 location.reload()，把唯一一份未保存的内容
      弄丢了（监督反例 eventd732：setItem 抛 QuotaExceededError，
      reloads=1、saved=false）。配额满、隐私模式、存储被禁用都会走到这里。
      写完还要读回来确认：有的浏览器 setItem 不抛错，但也没真的存下。 */
  function stashDraft(){
    /* **序列化一次**，然后把读回来的字节与它精确比对。
       只判 `!!getItem(...)` 是不够的：键上可能还留着上一次的旧草稿，
       而这一次静默没写进去 —— 读回来是旧值、真值为 true，于是判成功并重载，
       新编辑照样丢（监督反例 event277：ok=true / stored=old / intended=new）。
       `at: Date.now()` 也必须只算一次，否则写入与比对的串天生不同。 */
    const payload = JSON.stringify({
      id: app.id, uid: uid, at: Date.now(),
      form_data: app.form_data, pathway: app.pathway });
    try {
      sessionStorage.setItem(DRAFT_KEY, payload);
      return sessionStorage.getItem(DRAFT_KEY) === payload;
    } catch (e) { return false; }
  }
  function readStash(){
    try {
      const v = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null");
      // 用户身份与申请 id 都要对上；对不上就当没有，绝不跨账号恢复
      return v && v.id === app.id && v.uid === uid ? v : null;
    } catch (e) { return null; }
  }
  function clearStash(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  /** 载入后如果有上次没存成的草稿，给一条提示与两个选择。**不自动应用**。 */
  function offerRestore(){
    const st = readStash();
    if (!st) return;
    /* 申请一旦不可编辑（已提交 / 已录取 / 已拒绝），这份草稿再也写不回去了。
       这时候还给「恢复」等于骗他一次 —— 点下去 save() 会静默跳过，
       他却以为存上了。如实说明，只留「丢弃」。 */
    if (!EDITABLE.includes(app.status)) {
      const b = document.createElement("div");
      b.id = "restoreBox";
      b.className = "msg info show";
      b.setAttribute("role", "status");
      b.style.margin = "12px 0";
      b.textContent = "你上次没能保存成功的编辑还留着，但这份申请现在已不可编辑（" +
        ((ST[app.status] && ST[app.status].t) || app.status) + "），无法写回去。" +
        "如需保留请先自行复制，再丢弃这份草稿。 ";
      const ta = document.createElement("textarea");
      ta.readOnly = true;
      ta.style.cssText = "width:100%;min-height:120px;margin-top:8px;font:12px/1.6 Consolas,monospace";
      ta.value = Object.keys(st.form_data || {}).map((k) => {
        const v = st.form_data[k];
        return k + ": " + (typeof v === "string" ? v : JSON.stringify(v));
      }).join("\n");
      b.appendChild(ta);
      const no = document.createElement("button");
      no.type = "button"; no.className = "link"; no.textContent = "丢弃";
      no.addEventListener("click", () => { clearStash(); b.remove(); });
      b.appendChild(document.createElement("br"));
      b.appendChild(no);
      const host = document.getElementById("appForm") || main;
      (host.parentNode || main).insertBefore(b, host);
      return;
    }
    const box = document.createElement("div");
    box.id = "restoreBox";
    box.className = "msg info show";
    box.setAttribute("role", "status");
    box.style.margin = "12px 0";
    box.textContent = "你上次没能保存成功的编辑还留着（只存在这个标签页里）。" +
      "现在页面上显示的是服务器上的最新版本，你可以对照之后再决定。 ";
    const yes = document.createElement("button");
    yes.type = "button"; yes.className = "link"; yes.textContent = "恢复我的编辑";
    yes.addEventListener("click", () => {
      const locked = new Set(app.locked_fields || []);
      const mine = (st.form_data && typeof st.form_data === "object") ? st.form_data : {};
      // 只覆盖未锁定的字段：锁定字段写回去会被服务端整单拒绝
      Object.keys(mine).forEach((k) => { if (!locked.has(k)) app.form_data[k] = mine[k]; });
      if (st.pathway && !locked.has("pathway")) app.pathway = st.pathway;
      clearStash();
      box.remove();
      render();
      touch();                      // 标记为待保存，按新的 updated_at 存回去
      UI.toast("已恢复你的编辑，正在保存");
    });
    const no = document.createElement("button");
    no.type = "button"; no.className = "link"; no.textContent = "丢弃";
    no.addEventListener("click", () => { clearStash(); box.remove(); });
    box.appendChild(yes); box.appendChild(document.createTextNode(" · ")); box.appendChild(no);
    const host = document.getElementById("appForm") || main;
    (host.parentNode || main).insertBefore(box, host);
  }


  const UNKNOWN_CODES = { network: 1, server_error: 1, unknown: 1 };
  const isUnknown = (e) => !e || !e.code || !!UNKNOWN_CODES[e.code];

  /** 结果不明时的统一呈现：说清楚，并且**只留「刷新核实」这一条出路** ——
      不给「重试」，重试恰恰是这里最不该做的事。 */
  function sayUnknown(el, text){
    el.textContent = text + " ";
    const b = document.createElement("button");
    b.type = "button"; b.className = "link"; b.textContent = "刷新核实";
    b.addEventListener("click", () => location.reload());
    el.appendChild(b);
    el.classList.add("show");
    el.setAttribute("role", "alert");
  }

  let creating = false;


  // ---------- 载入 ----------
  UI.loading(main, 4);
  const [{ data: appRows, error: appErr }, { data: pcRows }] = await Promise.all([
    Api.rpc("my_application"),
    Api.select("program_catalog", { columns: "code,name_zh,short_label,category,intake_note_zh,is_open_for_application", order: { column: "sort_order", asc: true } }),
  ]);
  if (appErr) return UI.error(main, { message: appErr.message, onRetry: () => location.reload() });
  programs = (pcRows || []).filter(p => p.is_open_for_application);
  app = (appRows && appRows[0]) || null;

  if (!app) return renderStart();
  await loadRequirements();
  render();
  // 上次没存成的草稿若还在这个标签页里，给一条提示让他自己决定要不要恢复
  offerRestore();

  async function loadRequirements(){
    if (!app) return;
    const { data } = await Api.select("application_requirements", {
      columns: "id,label,detail,resolved,created_at", eq: { application_id: app.id },
      order: { column: "created_at", asc: true },
    });
    reqs = data || [];
  }

  // ---------- 尚无申请 ----------
  function renderStart(){
    UI.empty(main, {
      title: "还没有正式申请",
      text: "正式入学申请包含基本资料、信仰与教会、学历经历、申请意向与个人见证；可随时保存草稿，稍后继续。",
      actions: [{ id: "new", label: "开始填写正式申请" }],
      handlers: { new: createDraft },
    });
  }

  async function createDraft(){
    if (creating) return;                       // 在途期间吞掉重复点击
    creating = true;
    const startBtn = main.querySelector('[data-act="new"]');
    if (startBtn) startBtn.disabled = true;
    const qs = Object.fromEntries(new URLSearchParams(location.search));
    const form = F.prefillFromQuickApply(qs);
    const { data, error } = await Api.insert("applications", {
      applicant_id: uid, pathway: "undecided", status: "draft", form_data: form,
    });
    if (error) {
      if (isUnknown(error)) {
        /* 不解锁 —— 这一份可能已经建出来了，再点一次就是第二份。 */
        main.innerHTML = "";
        const box = document.createElement("div");
        box.className = "msg err";
        sayUnknown(box, "没有拿到这次创建的结果，无法确认申请是否已经创建。" +
          "请不要重复创建 —— 重复创建会多出一份申请。请先刷新核实当前状态。");
        main.appendChild(box);
        return;
      }
      creating = false;
      if (startBtn) startBtn.disabled = false;
      return UI.toast(error.message, "err");
    }
    creating = false;
    const { data: rows } = await Api.rpc("my_application");
    app = rows && rows[0];
    reqs = [];
    render();
    UI.toast("草稿已创建，内容会自动保存");
  }

  // ---------- 渲染 ----------
  function render(){
    const editable = EDITABLE.includes(app.status);
    const locked = new Set(app.locked_fields || []);
    const s = ST[app.status] || { t: app.status, d: "" };

    main.innerHTML = `
      <h1>我的申请</h1>
      <p class="lead">正式入学申请 · 表单版本 ${UI.esc(app.form_version)}</p>

      <div class="card" style="margin-bottom:18px">
        <div class="pagehead" style="margin:0">
          <div>
            <span class="st ${app.status}">${s.t}</span>
            <div class="who" style="margin-top:6px">${UI.esc(s.d)}</div>
          </div>
          <div style="text-align:right">
            <div class="who" id="saveState">${editable ? "自动保存已开启" : "已锁定，不可编辑"}</div>
            ${editable ? `<button class="link" id="btnWithdraw" style="margin-top:6px">撤回申请</button>` : ""}
          </div>
        </div>
        ${app.applicant_visible_message ? `<div class="msg info show" style="margin-top:12px"><b>招生同工留言：</b>${UI.esc(app.applicant_visible_message)}</div>` : ""}
      </div>

      ${reqs.length ? renderRequirements() : ""}

      ${editable ? `
        <div class="steps" role="tablist" id="stepBar"></div>
        <form id="appForm" class="card" novalidate></form>
        <div class="card" style="margin-top:14px">
          <div class="row">
            <button class="link" id="btnPrev">← 上一步</button>
            <button class="link" id="btnNext">下一步 →</button>
          </div>
          <button class="btn" id="btnSubmit" type="button">提交申请</button>
          <div class="msg err" id="subErr" role="alert"></div>
          <div class="hint">提交后，姓名、出生年月、性别、国籍、初信/受洗日期与申请项目将被锁定；其余字段仍可修改。</div>
        </div>` : `<div class="card">${renderReadonly(locked)}</div>`}

      <div class="card" style="margin-top:18px">
        <h2 style="font-size:16px">状态时间线</h2>
        <div id="tl">${UI.skeleton(2)}</div>
      </div>`;

    if (editable) { buildSteps(); bindEditor(); }
    document.getElementById("btnWithdraw")?.addEventListener("click", withdraw);
    loadTimeline();
  }

  function renderRequirements(){
    const items = reqs.map(r => `
      <li class="rq${r.resolved ? " done" : ""}">
        <label>
          <input type="checkbox" data-req="${r.id}" ${r.resolved ? "checked disabled" : ""}>
          <span><b>${UI.esc(r.label)}</b>${r.detail ? `<em>${UI.esc(r.detail)}</em>` : ""}</span>
        </label>
      </li>`).join("");
    const pending = reqs.filter(r => !r.resolved).length;
    return `<div class="card" style="margin-bottom:18px;border-left:4px solid var(--gold)">
      <h2 style="font-size:16px">需要补充的资料（未完成 ${pending} 项）</h2>
      <p class="sub">补充完成后勾选，全部完成才能重新提交。</p>
      <ul class="rqlist">${items}</ul>
    </div>`;
  }

  function renderReadonly(locked){
    const rows = [];
    for (const st of F.STEPS) for (const f of st.fields) {
      if (f.name.startsWith("__")) continue;
      const v = app.form_data[f.name];
      if (v === undefined || v === "" || (Array.isArray(v) && !v.length)) continue;
      let text;
      if (f.type === "rows") text = (v || []).map(r => Object.values(r).filter(Boolean).join(" · ")).join("；");
      else if (Array.isArray(v)) text = v.join("、");
      else if (typeof v === "boolean") text = v ? "已确认" : "未确认";
      else text = String(v);
      if (f.name === "programs") {
        const p = programs.find(x => x.code === v[0]);
        text = p ? `${p.name_zh}（${p.short_label}）` : text;
      }
      rows.push(`<div class="ro"><span>${UI.esc(f.label)}</span><b>${UI.esc(text)}</b>${locked.has(f.name) ? '<i class="lockmark">已锁定</i>' : ""}</div>`);
    }
    const pw = F.PATHWAYS.find(p => p.value === app.pathway);
    rows.unshift(`<div class="ro"><span>学习路径</span><b>${UI.esc(pw ? pw.label : app.pathway)}</b></div>`);
    return `<h2 style="font-size:16px">申请内容</h2>${rows.join("")}`;
  }

  // ---------- 分步编辑 ----------
  function buildSteps(){
    const bar = document.getElementById("stepBar");
    bar.innerHTML = F.STEPS.map((s, i) =>
      `<button type="button" role="tab" data-step="${i}" class="${i === step ? "on" : ""}" aria-selected="${i === step}">${UI.esc(s.title)}</button>`).join("");
    bar.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { step = +b.dataset.step; buildSteps(); renderStep(); }));
    renderStep();
  }

  function renderStep(){
    const st = F.STEPS[step];
    const locked = new Set(app.locked_fields || []);
    const form = document.getElementById("appForm");
    form.innerHTML = `<h2 style="font-size:16px">${UI.esc(st.title)}</h2>` +
      (st.note ? `<p class="sub">${UI.esc(st.note)}</p>` : "") +
      `<div class="fgrid">${st.fields.map(f => fieldHtml(f, locked)).join("")}</div>`;
    bindFieldEvents();
  }

  function fieldHtml(f, locked){
    const isLocked = locked.has(f.name);
    const v = f.name === "__pathway" ? app.pathway : app.form_data[f.name];
    const dis = isLocked ? "disabled" : "";
    const req = f.required ? ' <span aria-hidden="true" style="color:var(--err)">*</span>' : "";
    const lab = `<label for="fd-${f.name}">${UI.esc(f.label)}${req}${isLocked ? '<i class="lockmark">提交后锁定</i>' : ""}</label>`;
    const hint = f.hint ? `<div class="fhint">${UI.esc(f.hint)}</div>` : "";
    let ctl = "";

    if (f.type === "select") {
      ctl = `<select id="fd-${f.name}" data-f="${f.name}" ${dis}><option value="">请选择</option>` +
        f.options.map(([val, txt]) => `<option value="${val}"${v === val ? " selected" : ""}>${UI.esc(txt)}</option>`).join("") + `</select>`;
    } else if (f.type === "checkboxes") {
      const arr = Array.isArray(v) ? v : [];
      ctl = `<div class="cbs" data-f="${f.name}">` + f.options.map(([val, txt]) =>
        `<label class="cb"><input type="checkbox" value="${val}" ${arr.includes(val) ? "checked" : ""} ${dis}><span>${UI.esc(txt)}</span></label>`).join("") + `</div>`;
    } else if (f.type === "checkbox") {
      ctl = `<label class="cb"><input type="checkbox" id="fd-${f.name}" data-f="${f.name}" ${v ? "checked" : ""} ${dis}><span>${UI.esc(f.label)}</span></label>`;
      return `<div class="full">${ctl}${hint}</div>`;
    } else if (f.type === "textarea") {
      ctl = `<textarea id="fd-${f.name}" data-f="${f.name}" maxlength="${f.max || 2000}" ${dis}>${UI.esc(v || "")}</textarea>`;
    } else if (f.type === "program") {
      const cur = Array.isArray(v) ? v[0] : "";
      ctl = `<select id="fd-programs" data-f="programs" ${dis}><option value="">请选择一个项目</option>` +
        programs.map(p => `<option value="${p.code}"${cur === p.code ? " selected" : ""}>${UI.esc(p.name_zh)}${p.short_label ? "（" + UI.esc(p.short_label) + "）" : ""}</option>`).join("") +
        `</select><div class="fhint">一份申请对应一个主项目；如需申请其他项目，请在本申请结束后另行提交。</div>`;
    } else if (f.type === "pathway") {
      ctl = `<div class="cbs" data-f="__pathway">` + F.PATHWAYS.map(p =>
        `<label class="cb"><input type="radio" name="pathway" value="${p.value}" ${app.pathway === p.value ? "checked" : ""} ${dis}>
          <span><b>${UI.esc(p.label)}</b><em>${UI.esc(p.hint)}</em></span></label>`).join("") + `</div>`;
    } else if (f.type === "rows") {
      const rows = Array.isArray(v) ? v : [];
      ctl = `<div class="rowsets" data-f="${f.name}">` +
        rows.map((r, i) => rowsetHtml(f, r, i, isLocked)).join("") +
        `</div>${isLocked ? "" : `<button type="button" class="btn ghost" data-addrow="${f.name}" style="width:auto;padding:0 18px;margin-top:8px">+ 添加一行</button>`}`;
    } else {
      ctl = `<input id="fd-${f.name}" data-f="${f.name}" type="${f.type === "month" ? "month" : f.type || "text"}" maxlength="${f.max || 200}" value="${UI.esc(v || "")}" ${dis}>`;
    }
    return `<div class="${f.full ? "full" : ""}">${lab}${ctl}${hint}</div>`;
  }

  function rowsetHtml(f, r, i, locked){
    return `<div class="rowset" data-i="${i}">
      <div class="rowset-head"><b>第 ${i + 1} 项</b>${locked ? "" : `<button type="button" class="link" data-delrow="${f.name}:${i}">删除</button>`}</div>
      <div class="fgrid">${f.columns.map(([k, lbl]) =>
        `<div><label>${UI.esc(lbl)}</label><input data-row="${f.name}:${i}:${k}" value="${UI.esc(r[k] || "")}" ${locked ? "disabled" : ""}></div>`).join("")}</div>
    </div>`;
  }

  function bindFieldEvents(){
    const form = document.getElementById("appForm");
    form.querySelectorAll("[data-f]").forEach(el => {
      const name = el.dataset.f;
      if (el.classList.contains("cbs")) {
        el.querySelectorAll("input").forEach(i => i.addEventListener("change", () => {
          if (name === "__pathway") { app.pathway = el.querySelector("input:checked")?.value || "undecided"; }
          else { app.form_data[name] = [...el.querySelectorAll("input:checked")].map(x => x.value); }
          touch();
        }));
      } else {
        el.addEventListener("input", () => {
          app.form_data[name] = el.type === "checkbox" ? el.checked
            : (name === "programs" ? (el.value ? [el.value] : []) : el.value);
          touch();
        });
        el.addEventListener("change", () => {
          app.form_data[name] = el.type === "checkbox" ? el.checked
            : (name === "programs" ? (el.value ? [el.value] : []) : el.value);
          touch();
        });
      }
    });
    form.querySelectorAll("[data-row]").forEach(el => el.addEventListener("input", () => {
      const [fname, idx, key] = el.dataset.row.split(":");
      app.form_data[fname] = app.form_data[fname] || [];
      app.form_data[fname][+idx] = app.form_data[fname][+idx] || {};
      app.form_data[fname][+idx][key] = el.value;
      touch();
    }));
    form.querySelectorAll("[data-addrow]").forEach(b => b.addEventListener("click", () => {
      const n = b.dataset.addrow;
      app.form_data[n] = (app.form_data[n] || []).concat([{}]);
      touch(); renderStep();
    }));
    form.querySelectorAll("[data-delrow]").forEach(b => b.addEventListener("click", () => {
      const [n, i] = b.dataset.delrow.split(":");
      app.form_data[n].splice(+i, 1); touch(); renderStep();
    }));
    document.querySelectorAll("[data-req]").forEach(cb => cb.addEventListener("change", async () => {
      const { error } = await Api.rpc("resolve_requirement", { p_req: cb.dataset.req });
      if (error) {
        if (isUnknown(error)) {
          /* **不把勾去掉** —— 去掉等于断言「没生效」，而这一次恰恰不知道。
             也不让它马上能再点：真生效了的话，第二次就是重复标记。 */
          cb.disabled = true;
          return UI.toast("没能确认这一项有没有标记成功，请刷新后核实。", "err");
        }
        cb.checked = false;
        return UI.toast(error.message, "err");
      }
      await loadRequirements(); render();
      UI.toast("已标记完成");
    }));
  }

  function bindEditor(){
    document.getElementById("btnPrev").addEventListener("click", () => { if (step > 0) { step--; buildSteps(); } });
    document.getElementById("btnNext").addEventListener("click", () => { if (step < F.STEPS.length - 1) { step++; buildSteps(); } });
    document.getElementById("btnSubmit").addEventListener("click", submit);
    UI.formGuard(() => dirty);
  }

  // ---------- 自动保存 ----------
  function touch(){
    dirty = true;
    setSaveState("正在编辑…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 800);
  }
  function setSaveState(t){ const e = document.getElementById("saveState"); if (e) e.textContent = t; }

  /** 保存并**如实回报结果**：{ ok, unclear, message }。

      原来 save() 什么都不返回，submit() 于是 `await save()` 之后直接往下走。
      监督独立复现（event9dbe）：Api.update 被明确拒绝（42501）之后，
      页面先显示「保存失败：…」，紧接着又发出 submit_application 并弹
      「申请已提交」—— **提交的是服务端上那份旧的表单**，用户刚填的内容
      从来没存进去，而他以为交上去了。 */
  async function save(){
    if (!EDITABLE.includes(app.status)) return { ok: true, unclear: false, skipped: true };
    /* PORTAL-blueprint §6 表单行为写明：「草稿本地 debounce 800ms +
       **服务端 updated_at 乐观并发**」。乐观并发这一半此前完全没做 ——
       保存只按 { id } 匹配，于是一个开着的旧标签页会拿它那份过期的
       form_data **整包覆盖**掉别处刚写进去的内容，而且一声不响。
       典型场景：教务把申请退回补充资料并解锁了某个字段（0011 精确解锁），
       申请人另一个早就开着的标签页一到点自动保存，把解锁前的快照写了回去。

       applications 上有 applications_set_updated_at 触发器（0008:51），
       所以把上次读到的 updated_at 一并作为匹配条件：命中 0 行就说明
       这条记录在别处被改过，这一次**确定没保存**。 */
    /* 没有版本基准就**不发这次写入**。原来这里 `if (app.updated_at)` 静默退成
       只按 { id } 匹配 —— 那就是一次无条件整包覆盖，正是本包要防的事。
       失败要朝安全那边关：宁可这一次不保存，也不要盖掉别处的改动。 */
    if (!app.updated_at) {
      setSaveState("没能确认当前版本，这一次没有保存");
      showConflict("没能确认这份申请当前是哪一版，所以这一次没有保存 —— " +
        "直接写会有覆盖别处改动的风险。你填的内容还在页面上，请重新载入取回版本信息。");
      return { ok: false, unclear: false, conflict: true,
               message: "没有可比对的版本基准" };
    }
    const { data: rows, error } = await Api.update("applications",
      { id: app.id, updated_at: app.updated_at },
      { form_data: app.form_data, pathway: app.pathway });
    /* 自动保存失败也要分清楚：读不到结论时这一次可能其实已经存进去了，
       说死「保存失败」会让人以为刚才白填了。 */
    if (error) {
      const unclear = isUnknown(error);
      setSaveState(unclear ? "没能确认是否保存成功，请稍后再看"
                           : "保存失败：" + error.message);
      return { ok: false, unclear: unclear, message: error.message || "" };
    }
    /* Api.update 末尾有 .select()，所以命中的行会回来。0 行 = 条件没匹配上，
       也就是 updated_at 变了 —— 别人改过。这是**确定**的结果（没写进去），
       但不能顺手重试：重试会把过期内容盖上去。留着用户当前的编辑，
       只给「重新载入」这一条出路。 */
    /* 成功必须有**确凿的证据**：一条回来的记录，外加一个新的 updated_at。
       监督独立反例（eventf982）：Api.update 返回 {data:null,error:null} 时，
       原来的判据只拦 []，null 直接穿过去 —— 结果 ok:true、dirty:false、
       页面显示「已保存 02:17:02」，而根本没有任何记录证明写进去了。
       拿不到记录或拿不到新版本号，一律按**结果不明**处理：
       保留 dirty（下次编辑还会再存一次）、并让提交门禁拦住。 */
    if (!Array.isArray(rows)) {
      setSaveState("没能确认是否保存成功，请稍后再看");
      return { ok: false, unclear: true, message: "没有拿到写入结果" };
    }
    if (rows.length === 0) {
      setSaveState("这份申请在别处被改过，这一次没有保存");
      showConflict();
      return { ok: false, unclear: false, conflict: true,
               message: "这份申请在别处被改过（可能是你在另一个标签页改的，或教务刚处理过）" };
    }
    // 保存成功：把服务端新的 updated_at 接上，下一次保存才比得对。
    // 拿不到新版本号就没法继续做并发比对，同样算结果不明，不能宣布成功。
    const nextVersion = rows[0] && rows[0].updated_at;
    if (!nextVersion) {
      setSaveState("没能确认是否保存成功，请稍后再看");
      return { ok: false, unclear: true, message: "没有拿到新的版本号" };
    }
    app.updated_at = nextVersion;
    dirty = false;
    setSaveState("已保存 " + new Date().toLocaleTimeString("zh-CN", { hour12: false }));
    return { ok: true, unclear: false };
  }

  /** 暂存失败时的出口：不重载、不隐藏，把他填的内容原样摊出来，
      并把光标放进去全选好，直接 Ctrl/Cmd+C 就能带走。
      不依赖剪贴板权限（navigator.clipboard 在很多环境下会被拒）。 */
  function showStashFailed(){
    let box = document.getElementById("stashFailBox");
    if (box) { box.querySelector("textarea").select(); return; }
    box = document.createElement("div");
    box.id = "stashFailBox";
    box.className = "msg err show";
    box.setAttribute("role", "alert");
    box.style.margin = "12px 0";
    box.textContent = "这个浏览器现在存不下草稿（可能是隐私模式、存储被禁用或空间已满），" +
      "所以**没有**重新载入 —— 页面上这一份是唯一的副本。" +
      "请先把下面的内容复制保存，再决定要不要重新载入。 ";
    const ta = document.createElement("textarea");
    ta.readOnly = true;
    ta.style.cssText = "width:100%;min-height:160px;margin-top:8px;font:12px/1.6 Consolas,monospace";
    const lines = [];
    Object.keys(app.form_data || {}).forEach((k) => {
      const v = app.form_data[k];
      lines.push(k + ": " + (typeof v === "string" ? v : JSON.stringify(v)));
    });
    ta.value = lines.join("\n");
    box.appendChild(ta);
    const later = document.createElement("button");
    later.type = "button"; later.className = "link"; later.textContent = "我已复制，重新载入";
    later.addEventListener("click", () => location.reload());
    box.appendChild(document.createElement("br"));
    box.appendChild(later);
    const host = document.getElementById("appForm") || main;
    (host.parentNode || main).insertBefore(box, host);
    ta.select();
  }

  /** 冲突提示：**不自动重新载入** —— 那会把用户正在编辑的内容冲掉。
      把选择权交给他：要么先把内容抄走再载入，要么继续编辑别的字段。 */
  function showConflict(customText){
    let box = document.getElementById("conflictBox");
    if (!box) {
      box = document.createElement("div");
      box.id = "conflictBox";
      box.className = "msg err show";
      box.setAttribute("role", "alert");
      box.style.margin = "12px 0";
      const host = document.getElementById("appForm") || main;
      host.parentNode.insertBefore(box, host);
    }
    box.textContent = (customText || ("这份申请在别处被改过，这一次没有保存 —— " +
      "直接再存会把别处的改动覆盖掉。你现在填的内容还在页面上，" +
      "请先记下需要保留的部分，再重新载入取回最新版本。")) + " ";
    if (!box.querySelector("button")) {
      const keep = document.createElement("button");
      keep.type = "button"; keep.className = "link";
      keep.textContent = "保留我的编辑并重新载入";
      keep.addEventListener("click", () => {
        /* 存不下就**绝不重新载入** —— 页面上这一份是唯一的副本。
           留在原地，把内容摊出来让他自己带走。 */
        if (!stashDraft()) { showStashFailed(); return; }
        location.reload();
      });
      const plain = document.createElement("button");
      plain.type = "button"; plain.className = "link";
      plain.textContent = "直接重新载入（丢弃我的编辑）";
      plain.addEventListener("click", () => { clearStash(); location.reload(); });
      box.appendChild(keep);
      box.appendChild(document.createTextNode(" · "));
      box.appendChild(plain);
    }
  }

  // ---------- 提交 / 撤回 ----------
  async function submit(){
    const err = document.getElementById("subErr"); err.classList.remove("show");
    const btn = document.getElementById("btnSubmit");
    /* **先禁用，再去保存。** 原来 disabled 是在 `await save()` 之后才设的，
       而 save() 是一次网络往返 —— 那段时间里按钮还是活的，
       两次点击真的会发出两次 submit_application（实测 2 次）。 */
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = "提交中…";
    clearTimeout(saveTimer);
    const saved = await save();

    /* **当前这一版没确认存进去，就不提交。** 否则交上去的是服务端上那份旧表单，
       而用户以为交的是自己刚填完的那份。两种情况都不往下走，但出路不同：

         明确被拒（RLS/校验/权限等）—— 确定没存上。留着他填的内容，
           说清楚原因，把按钮放开让他改完再交。
         结果不明 —— 不知道存上没有。同样不能提交（提交的可能是旧版本），
           但也不能劝他一直点：给「刷新核实」，让他先看清楚当前是哪一版。 */
    if (saved && !saved.ok) {
      if (saved.unclear) {
        sayUnknown(err, "没能确认你刚才的修改有没有保存成功，所以这次没有提交 —— " +
          "提交的可能是服务器上那份旧的。请先刷新核实当前内容再提交。");
        return;                                  // 刻意不解锁：先核实
      }
      btn.disabled = false; btn.textContent = "提交申请";
      err.textContent = "你刚才的修改没有保存成功（" + (saved.message || "原因未知") +
        "），所以这次没有提交 —— 不然交上去的会是服务器上那份旧的。" +
        "你填的内容还在页面上，请稍后重试或修正后再提交。";
      err.classList.add("show");
      return;
    }

    const { data, error } = await Api.rpc("submit_application", { p_app: app.id });
    const UNKNOWN_SUBMIT = "没有拿到这次提交的结果，无法确认申请是否已经提交。" +
      "请不要重复提交 —— 重复提交会再走一次审核流程。请先刷新核实当前状态。";
    if (error) {
      // 结果不明：刻意**不**解锁按钮，提交是状态变更且会写审核历史
      if (isUnknown(error)) { sayUnknown(err, UNKNOWN_SUBMIT); return; }
      btn.disabled = false; btn.textContent = "提交申请";
      err.textContent = error.message + "（这次没有提交。）"; err.classList.add("show");
      return;
    }
    /* 200 但没有可读结论。原来这里直接 `!data.ok`，data 是 null 就抛
       TypeError —— 页面一句话都没有，而按钮那时已经被放开，人只会再点一次。 */
    if (!data) { sayUnknown(err, UNKNOWN_SUBMIT); return; }
    btn.disabled = false; btn.textContent = "提交申请";
    if (!data.ok) {
      if (data.error === "validation_failed") {
        const names = {}; F.STEPS.forEach(s => s.fields.forEach(f => names[f.name] = f.label));
        names.pathway = "学习路径";
        err.innerHTML = "请完成以下必填项：<b>" + (data.missing || []).map(m => UI.esc(names[m] || m)).join("、") + "</b>";
      } else if (data.error === "requirements_pending") {
        err.textContent = `还有 ${data.count} 项补充资料未标记完成。`;
      } else err.textContent = "提交未成功，请检查后重试。";
      err.classList.add("show");
      return;
    }
    UI.toast("申请已提交");
    const { data: rows } = await Api.rpc("my_application");
    app = rows && rows[0]; dirty = false; await loadRequirements(); render();
  }

  async function withdraw(){
    if (!await UI.confirmDialog({ title: "撤回申请", text: "撤回后该申请将结束，如需再次申请须重新填写。", confirmLabel: "确认撤回", danger: true })) return;
    const { error } = await Api.rpc("withdraw_application", { p_app: app.id, p_reason: null });
    if (error) return UI.toast(error.message, "err");
    UI.toast("申请已撤回");
    const { data: rows } = await Api.rpc("my_application");
    app = (rows && rows[0]) || null;
    app ? render() : renderStart();
  }

  // ---------- 时间线 ----------
  async function loadTimeline(){
    const { data, error } = await Api.rpc("my_application_timeline", { p_app: app.id });
    const box = document.getElementById("tl");
    if (!box) return;
    if (error) return UI.render(box, UI.box("⚠️", "时间线载入失败", error.message));
    box.innerHTML = UI.timeline((data || []).map(h => ({
      title: (ST[h.to_status] || {}).t || h.to_status,
      time: new Date(h.created_at).toLocaleString("zh-CN", { hour12: false }),
      text: h.applicant_visible_message || "",
    })));
  }
})();
</script>
