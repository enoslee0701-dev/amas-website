<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>我的申请 | AMAS 申请者中心</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202609151917">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202609151917"></script>
<script src="../../../assets/js/portal/auth.js?v=202609151917"></script>
<script src="../../../assets/js/portal/api.js?v=202609151917"></script>
<script src="../../../assets/js/portal/ui.js?v=202609151917"></script>
<script src="../../../assets/js/portal/shell.js?v=202609151917"></script>
<script src="../../../assets/js/portal/application-form.js?v=202609151917"></script>
<script>
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell, F = window.AmasAppForm;
  const mounted = await Shell.mount({
    space: "applicant", title: "申请者中心",
    allow: ["applicant","student","registrar","academic_admin","super_admin"],
  });
  if (!mounted) return;
  const { main, ctx } = mounted;
  const uid = ctx.session.user.id;

  const ST = {
    draft:{t:"草稿",d:"尚未提交，可继续填写。"},
    submitted:{t:"已提交",d:"已进入招生流程，等待教务查阅。"},
    under_review:{t:"审核中",d:"招生同工正在审核你的申请。"},
    needs_information:{t:"需补充资料",d:"请按下方要求补充后重新提交。"},
    accepted:{t:"已录取",d:"录取不等于学籍建立；学籍须由 AMAS 总校审核确认后由教务建档。"},
    rejected:{t:"未通过",d:"如有疑问请联系招生同工。"},
    withdrawn:{t:"已撤回",d:"此申请已撤回。"},
  };
  const EDITABLE = ["draft","needs_information"];
  /* 总校确认这一段（只在**已录取**之后显示）。
     文案一律中性，只说这一段自己的结果 —— **不推导**录取或学籍状态：
     录取状态就在上面那个徽章里，学籍由教务另行建档（ST.accepted 已经写明）。 */
  const HQ_T = { pending: "总校确认处理中", approved: "总校确认已通过", rejected: "总校确认未通过" };
  /* 白名单必须是**明确的字符串枚举**，不能拿 `HQ_T[x]` 的真值当判据 ——
     对象字面量的原型上挂着 constructor / toString / hasOwnProperty …，
     它们全是真值：status:"constructor" 会被放行，
     再到渲染那一步就把 `function Object() { [native code] }`
     写到申请人的页面上（本轮实测 C0/C0b）。 */
  const HQ_KEYS = ["pending", "approved", "rejected"];
  const hqLabel = (v) => (typeof v === "string" && HQ_KEYS.indexOf(v) > -1) ? HQ_T[v] : null;
  /* 备注只有是**字符串**才当文本用。服务端字段类型不对（{}、数字…）时
     `.trim` 根本不存在 —— 上一版直接 TypeError，**整个申请页渲染不出来**
     （本轮实测 C3/C3c/G3）。类型不对就按「没有备注」处理：
     status 那一维仍然是可信的，不因为一个附带字段把整段判成未知。 */
  const hqNoteText = () => {
    const v = hq && hq.applicant_visible_note;
    return typeof v === "string" ? v.trim() : "";
  };
  /* 只显式取这三列。批文编号（内部凭据）与确认人（具体哪位管理员）
     **连请求都不发** —— 不是「取回来不显示」。 */
  const HQ_COLS = "status,confirmed_at,applicant_visible_note";

  let app = null, programs = [], catalogFailed = false, reqs = [], reqsUnknown = false, dirty = false, saveTimer = null, step = 0;
  /* hqState: idle=还没读过（什么都不显示，不假装知道） / ok / empty=读到了但没有那一行
     / error=这一次没读到。hqSeq 是读取世代：晚到的旧结果一律不落地。 */
  let hq = null, hqState = "idle", hqSeq = 0, hqBusy = false, hqFocusBack = false;
  /* 放在这里而不是紧挨 loadRequirements：**载入阶段就会调它**，
     `let` 声明在下面的话会撞上暂时性死区（本轮实测：整页 ReferenceError）。 */
  let reqLoadSeq = 0;
  let goFieldBound = false;
  /* 自动保存与手动/闸门发出的保存会重叠。旧那一次回来得晚时，如果照样回写
     app.updated_at，版本就**倒退**了 —— 下一次保存会被乐观并发判成「别处改过」。
     给每次保存一个递增序号，只有**最新发出**的那一次才有资格改版本和清 dirty。 */
  let saveSeq = 0;
  /* 串行化保存用的两个把手：在途/排队的那一次，以及「排队里已经有一次了」。 */
  let saveTail = null, saveQueued = false;

  /* 这一页有四条写入：创建草稿、自动保存、标记补件完成、提交申请。
     判据与 portal/admin/*（第六包）同一套：
       network / server_error / unknown（或压根没有错误码）＝ **请求可能已经生效**。
         对这一页来说，重来一次的代价很具体：会多出一份申请、会再走一次审核流程。
       服务端给了错误码 ＝ 确定没执行，如实说并允许重来。 */
  /* 冲突之后要能把编辑救回来。第十九包只做到「不自动重载、编辑留在屏幕上」，
     但用户一点「重新载入」，他刚填的东西还是全没了 —— 等于让他把一份长表单
     手抄一遍（基本资料 / 信仰与教会 / 学历 / 见证）。

     这里改成：先把当前草稿暂存，再去取最新版本，回来给他一键恢复。
     用 **sessionStorage** 而不是 localStorage —— 申请资料里有姓名、教会、
     见证这些个人信息，只应跟着这一个标签页走：刷新还在，标签页一关就没了，
     不跨标签、不长期留在机器上。
     恢复永远由他点，**绝不自动应用**；恢复时只覆盖未锁定的字段，
     免得把锁定字段写回去被服务端整单拒绝（0008 的 lock guard）。 */
  /* 暂存里装的是姓名、教会、见证这些个人资料，所以键名带上命名空间，
     内容带上用户身份：
       · 换一个账号绝不能把上一个人的草稿恢复出来（哪怕 app.id 撞上）；
       · 主动退出时由 auth.js 按 "amas." 前缀一并清掉 —— 神学院的公用电脑上，
         下一个人不该还能在这个标签页里翻到前一个人的申请资料。 */
  const DRAFT_KEY = "amas.draft.application";
  /** 暂存并**明确回报成功与否**。原来这里是 `catch (e) {}` 外加一句
      「存不下就算了」—— 然后照样 location.reload()，把唯一一份未保存的内容
      弄丢了（监督反例 eventd732：setItem 抛 QuotaExceededError，
      reloads=1、saved=false）。配额满、隐私模式、存储被禁用都会走到这里。
      写完还要读回来确认：有的浏览器 setItem 不抛错，但也没真的存下。 */
  function stashDraft(){
    /* **退出已经开始就一个字都不许再写。**
       auth.js 的 signOut() 会先把 sessionStorage 里所有 amas.* 清掉
       （公用电脑上，下一个人不该翻到前一个人的姓名/教会/见证），
       然后才跳转 —— 而跳转会触发 pagehide，离开守卫正好把它又写了回去。
       监督实测（event335f）：退出之后 sessionStorage 里又出现了旧用户的申请草稿。
       闸设在**唯一的写入口**上，所以离开守卫、visibilitychange、
       以及退出途中才回来的那次保存失败（showExpired 也会暂存），一并挡住。
       isSigningOut() 是 auth.js 既有的导出（auth.js:399/775），不改认证逻辑。 */
    if (A.isSigningOut && A.isSigningOut()) return false;
    /* **序列化一次**，然后把读回来的字节与它精确比对。
       只判 `!!getItem(...)` 是不够的：键上可能还留着上一次的旧草稿，
       而这一次静默没写进去 —— 读回来是旧值、真值为 true，于是判成功并重载，
       新编辑照样丢（监督反例 event277：ok=true / stored=old / intended=new）。
       `at: Date.now()` 也必须只算一次，否则写入与比对的串天生不同。 */
    const payload = JSON.stringify({
      id: app.id, uid: uid, at: Date.now(),
      form_data: app.form_data, pathway: app.pathway });
    try {
      sessionStorage.setItem(DRAFT_KEY, payload);
      return sessionStorage.getItem(DRAFT_KEY) === payload;
    } catch (e) { return false; }
  }
  function readStash(){
    try {
      const v = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null");
      // 用户身份与申请 id 都要对上；对不上就当没有，绝不跨账号恢复
      return v && v.id === app.id && v.uid === uid ? v : null;
    } catch (e) { return null; }
  }
  function clearStash(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  /* 普通离开这条路（点站内导航、刷新、关标签页）。
     共享层的 UI.formGuard 只**提醒** —— beforeunload 弹浏览器那句「确定离开？」，
     他一旦选「离开」，屏幕上这份唯一的编辑就没了。而暂存/恢复这套东西
     页面里早就有（stashDraft / offerRestore），只是这条路上一直没接。
     实测（web-round70 探针）：未到 800ms 防抖、保存还在途、保存被明确拒绝
     这三个时点上离开，回来都是一片空白 —— 401 那一格例外，
     因为登录过期那条路自己会暂存。

     四条边界：
       · 只在 dirty 时存 —— 已保存的正常导航不受影响，也不会把旧东西翻出来；
       · pagehide 与 visibilitychange(hidden) 都挂：手机上被系统回收时
         beforeunload / pagehide 都可能不来，多一个入口多一分机会；
       · 他自己选了「丢弃我的编辑」就不要再塞回去 —— 那是他明确的决定；
       · 存不下就什么都不说：这时候页面正在离开，弹什么他也看不见，
         更不能在别处谎称已经暂存。
     **只绑一次**：bindEditor() 是跟着 render() 走的，绑在那里会随每次重画累积。 */
  let leavingDiscard = false, leaveGuardBound = false;
  function bindLeaveGuard(){
    if (leaveGuardBound) return;
    leaveGuardBound = true;
    const keep = () => { if (dirty && !leavingDiscard) stashDraft(); };
    window.addEventListener("pagehide", keep);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") keep();
    });
  }

  /** 载入后如果有上次没存成的草稿，给一条提示与两个选择。**不自动应用**。 */
  function offerRestore(){
    const st = readStash();
    if (!st) return;
    /* 申请一旦不可编辑（已提交 / 已录取 / 已拒绝），这份草稿再也写不回去了。
       这时候还给「恢复」等于骗他一次 —— 点下去 save() 会静默跳过，
       他却以为存上了。如实说明，只留「丢弃」。 */
    if (!EDITABLE.includes(app.status)) {
      const b = document.createElement("div");
      b.id = "restoreBox";
      b.className = "msg info show";
      b.setAttribute("role", "status");
      b.style.margin = "12px 0";
      b.textContent = "你上次没能保存成功的编辑还留着，但这份申请现在已不可编辑（" +
        ((ST[app.status] && ST[app.status].t) || app.status) + "），无法写回去。" +
        "如需保留请先自行复制，再丢弃这份草稿。 ";
      const ta = document.createElement("textarea");
      ta.readOnly = true;
      ta.style.cssText = "width:100%;min-height:120px;margin-top:8px;font:12px/1.6 Consolas,monospace";
      ta.value = Object.keys(st.form_data || {}).map((k) => {
        const v = st.form_data[k];
        return k + ": " + (typeof v === "string" ? v : JSON.stringify(v));
      }).join("\n");
      b.appendChild(ta);
      const no = document.createElement("button");
      no.type = "button"; no.className = "link"; no.textContent = "丢弃";
      no.addEventListener("click", () => { clearStash(); b.remove(); });
      b.appendChild(document.createElement("br"));
      b.appendChild(no);
      const host = document.getElementById("appForm") || main;
      (host.parentNode || main).insertBefore(b, host);
      return;
    }
    const box = document.createElement("div");
    box.id = "restoreBox";
    box.className = "msg info show";
    box.setAttribute("role", "status");
    box.style.margin = "12px 0";
    box.textContent = "你上次没能保存成功的编辑还留着（只存在这个标签页里）。" +
      "现在页面上显示的是服务器上的最新版本，你可以对照之后再决定。 ";
    const yes = document.createElement("button");
    yes.type = "button"; yes.className = "link"; yes.textContent = "恢复我的编辑";
    yes.addEventListener("click", () => {
      const locked = new Set(app.locked_fields || []);
      const mine = (st.form_data && typeof st.form_data === "object") ? st.form_data : {};
      // 只覆盖未锁定的字段：锁定字段写回去会被服务端整单拒绝
      Object.keys(mine).forEach((k) => { if (!locked.has(k)) app.form_data[k] = mine[k]; });
      if (st.pathway && !locked.has("pathway")) app.pathway = st.pathway;
      clearStash();
      box.remove();
      render();
      touch();                      // 标记为待保存，按新的 updated_at 存回去
      UI.toast("已恢复你的编辑，正在保存");
    });
    const no = document.createElement("button");
    no.type = "button"; no.className = "link"; no.textContent = "丢弃";
    no.addEventListener("click", () => { clearStash(); box.remove(); });
    box.appendChild(yes); box.appendChild(document.createTextNode(" · ")); box.appendChild(no);
    const host = document.getElementById("appForm") || main;
    (host.parentNode || main).insertBefore(box, host);
  }


  const UNKNOWN_CODES = { network: 1, server_error: 1, unknown: 1 };
  const isUnknown = (e) => !e || !e.code || !!UNKNOWN_CODES[e.code];

  /** 结果不明时的统一呈现：说清楚，并且**只留「刷新核实」这一条出路** ——
      不给「重试」，重试恰恰是这里最不该做的事。 */
  function sayUnknown(el, text){
    el.textContent = text + " ";
    const b = document.createElement("button");
    b.type = "button"; b.className = "link"; b.textContent = "刷新核实";
    b.addEventListener("click", () => location.reload());
    el.appendChild(b);
    el.classList.add("show");
    el.setAttribute("role", "alert");
  }

  let creating = false;


  // ---------- 载入 ----------
  UI.loading(main, 4);
  const [{ data: appRows, error: appErr }, { data: pcRows, error: pcErr }] = await Promise.all([
    Api.rpc("my_application"),
    Api.select("program_catalog", { columns: "code,name_zh,short_label,category,intake_note_zh,is_open_for_application", order: { column: "sort_order", asc: true } }),
  ]);
  if (appErr) return UI.error(main, { message: appErr.message, onRetry: () => location.reload() });
  /* 目录读不到 ≠ 没有可选项目，更 ≠ 他选的那个不开放。读不到就别下判断。 */
  catalogFailed = !!pcErr || !Array.isArray(pcRows);
  /* 判据写对了、执行不到等于没写：pcRows 是 {} 这类非数组真值时，
     (pcRows || []).filter 直接抛 —— 整页空白，连那句「没读到」都渲染不出来。 */
  programs = Array.isArray(pcRows) ? pcRows.filter(p => p.is_open_for_application) : [];
  /* 「没读到」和「确实没有」是两件事，不能合成一件。
     原来这里是 `app = (appRows && appRows[0]) || null; if (!app) return renderStart();`：
     服务端给出无结论（{data:null,error:null}）或非数组真值时，appErr 是空的，
     app 被置成 null，页面于是落到 renderStart()「还没有正式申请 / 开始填写正式申请」。
     那是在替服务端下判断 —— 他刷新之后看到的是「你没有申请」，还被递上创建入口，
     点下去就建出第二份。createDraft 与撤回后的重读早就按这条规矩修过了
     （`!Array.isArray(rows)` 就当没读到），首屏这一处一直漏着。 */
  if (!Array.isArray(appRows)) return renderAppUnknown();

  app = appRows[0] || null;

  if (!app) return renderStart();
  await loadRequirements();
  await loadHq();
  render();
  // 上次没存成的草稿若还在这个标签页里，给一条提示让他自己决定要不要恢复
  offerRestore();
  bindLeaveGuard();

  /* 总校确认这一行：申请人读**自己那一行**。
     权限不是本页给的 —— 0012_student_core.sql:224-231 的 RLS 策略里写着
     `a.applicant_id = auth.uid()`，而 :232 只 revoke 了 insert/update/delete。
     **这只是仓库源码里的写法，不等于线上那套已经验证过**；
     真实权限要等受控演练（B3）才谈得上验收。
     这里不写 SQL、不改权限，只是把已经允许的读取用起来。 */
  async function loadHq(){
    if (!app || app.status !== "accepted") return;      // 别的状态连请求都不发
    const seq = ++hqSeq;
    const { data, error } = await Api.select("application_hq_approvals", {
      columns: HQ_COLS, eq: { application_id: app.id },
    });
    if (seq !== hqSeq) return;                          // 过期的那一次，丢掉
    if (error) { hqState = "unknown"; hq = null; return; }
    /* 「空」只认**明确的空数组**这一种。
       上一版把 `!Array.isArray(data)` 和 `[]` 并成了同一个 empty ——
       那是把「契约之外的形状」当成了「确实没有记录」，两回事：
       非数组（网关页、被改写的响应体）、多行（这张表 application_id 是主键，
       0012:36 —— 出现多行就说明我们读到的东西不是契约里那张表）、
       行里没有契约内的 status —— 这些一律算**未知**，并给「重新读取」。 */
    if (!Array.isArray(data)) { hqState = "unknown"; hq = null; return; }
    if (data.length === 0) { hqState = "empty"; hq = null; return; }
    if (data.length !== 1) { hqState = "unknown"; hq = null; return; }
    const r = data[0];
    if (!r || typeof r !== "object" || !hqLabel(r.status)) {
      hqState = "unknown"; hq = null; return;
    }
    hqState = "ok"; hq = r;
  }

  /** 重读这一段：只重读，不整页刷新（整页刷新会把没保存的东西一起带走）。 */
  async function reloadHq(){
    if (hqBusy) return;
    hqBusy = true;
    const btn = document.querySelector("[data-hqreload]");
    if (btn) { btn.disabled = true; btn.textContent = "正在读取…"; }   // 两个入口共用这一条路
    try { await loadHq(); } finally { hqBusy = false; }
    hqFocusBack = true;                                 // 重画之后把焦点还给他
    render();
  }

  /** 这一段的呈现。读不到就说读不到，不猜。 */
  function renderHq(){
    if (!app || app.status !== "accepted" || hqState === "idle") return "";
    const head = '<div class="card" id="hqBox" style="margin-top:14px" tabindex="-1" data-hq>' +
      '<h2 style="font-size:15px;margin:0 0 8px">总校确认进度</h2>';
    /* 每一种**已经读到**的状态都要给得出手动更新的入口 ——
       原来只有「未知」那一支有按钮，于是他在「处理中」或「还没查到记录」时
       只能整页刷新才能看到教务那边的新进展（整页刷新会把没保存的东西一起带走）。
       这里不做自动轮询：什么时候更新由他自己决定。 */
    const btn = (label) => '<div style="margin-top:10px">' +
      '<button class="btn ghost" type="button" data-hqreload style="width:auto;padding:0 18px">' +
      label + '</button></div>';
    const tail = '<div class="who" style="margin-top:8px">' +
      '这一段只反映总校确认的进度；录取状态见上方，学籍由教务另行建档。</div></div>';
    if (hqState === "unknown") {
      return head +
        '<div class="msg warn show" role="status">暂时无法获取总校确认进度。' +
        btn("重新读取") + '</div>' + tail;
    }
    if (hqState === "empty") {
      /* 措辞只说**我们这一次查到了什么**，不替服务端断言「从未有人记录过」：
         真实 RLS 还没有验证过（B3 未解除），空结果也可能是别的原因。 */
      return head + '<div class="msg info show" role="status">当前未查询到总校确认记录。</div>' +
        btn("更新进度") + tail;
    }
    const label = hqLabel(hq && hq.status);
    if (!label) {                                       // 契约之外的值：不编，也不当成任何一种
      return head + '<div class="msg warn show" role="status">暂时无法获取总校确认进度。' +
        btn("重新读取") + '</div>' + tail;
    }
    const ts = hq.confirmed_at ? Date.parse(hq.confirmed_at) : NaN;
    const when = Number.isFinite(ts)                    // 读不成时间就不显示，不写出 Invalid Date
      ? '<div class="who" style="margin-top:6px">时间：' +
        UI.esc(new Date(ts).toLocaleString("zh-CN")) + '</div>' : "";
    /* 备注**不进 innerHTML**：这里只放一个空容器，正文在渲染之后用 textContent 写进去。 */
    const note = hqNoteText()
      ? '<div class="msg info show" style="margin-top:10px"><b>总校说明：</b>' +
        '<span data-hqnote></span></div>' : "";
    return head + '<div><b>' + UI.esc(label) + '</b></div>' + when + note + btn("更新进度") + tail;
  }

  async function loadRequirements(){
    if (!app) return;
    /* 这一页有两条路会读补件清单：「重新读取」按钮，和勾「已补」之后的重读
       （tickRequirement 末尾）。两边重叠时，**先发的那次可能后落地**，
       把更新的那一份盖回旧的（监督点名，实测 T7：慢的重读后到，
       页面退回勾选前的三条）。晚到的旧结果一律不落地。 */
    const myGen = ++reqLoadSeq;
    /* 原来只解构 data：读失败时 reqs = []，而 render() 是
       `${reqs.length ? renderRequirements() : ""}` —— **整张「需要补充的资料」
       卡片消失**。申请人看到的是状态「需补充资料 · 请按下方要求补充后重新提交」，
       下方却空无一物；点提交又会被服务端 requirements_pending 挡回来
       （0008_applications.sql:243）。他被要求补一份自己看不见的材料。 */
    const { data, error } = await Api.select("application_requirements", {
      /* field 这一列是 0011 加的：补件条目可以指定它对应哪个表单字段，
         review_application 会把这些 field 从 locked_fields 里精确解锁。
         以前这里根本没取它，于是申请人只看得到一行文字，得自己在六步里找那个
         「不再是灰的」框。 */
      columns: "id,label,detail,field,resolved,created_at", eq: { application_id: app.id },
      order: { column: "created_at", asc: true },
    });
    if (myGen !== reqLoadSeq) return;          // 被更晚的一次读顶掉
    reqsUnknown = !!error || !Array.isArray(data);
    reqs = Array.isArray(data) ? data : [];
  }

  /* 读不到申请状态时的落点：如实说没读到，只给「刷新」这一条出路。
     **不给创建入口** —— 这里最不该做的事就是让他再建一份。 */
  function renderAppUnknown(){
    main.innerHTML = UI.box("🔄", "这一次没读到你的申请状态",
      "服务端没有给出可读的结果，所以现在无法确认你是否已经有一份申请。" +
      "请刷新页面核实 —— 不要重复创建，重复创建会多出一份申请。") +
      '<button class="btn" type="button" id="btnAppReload" style="width:auto;padding:0 22px;margin-top:12px">刷新页面</button>';
    document.getElementById("btnAppReload")?.addEventListener("click", () => location.reload());
  }

  // ---------- 尚无申请 ----------
  function renderStart(){
    UI.empty(main, {
      title: "还没有正式申请",
      text: "正式入学申请包含基本资料、信仰与教会、学历经历、申请意向与个人见证；可随时保存草稿，稍后继续。",
      actions: [{ id: "new", label: "开始填写正式申请" }],
      handlers: { new: createDraft },
    });
  }

  async function createDraft(){
    if (creating) return;                       // 在途期间吞掉重复点击
    creating = true;
    const startBtn = main.querySelector('[data-act="new"]');
    if (startBtn) startBtn.disabled = true;
    const qs = Object.fromEntries(new URLSearchParams(location.search));
    const form = F.prefillFromQuickApply(qs);
    const { data, error } = await Api.insert("applications", {
      applicant_id: uid, pathway: "undecided", status: "draft", form_data: form,
    });
    if (error) {
      if (isUnknown(error)) {
        /* 不解锁 —— 这一份可能已经建出来了，再点一次就是第二份。 */
        main.innerHTML = "";
        const box = document.createElement("div");
        box.className = "msg err";
        sayUnknown(box, "没有拿到这次创建的结果，无法确认申请是否已经创建。" +
          "请不要重复创建 —— 重复创建会多出一份申请。请先刷新核实当前状态。");
        main.appendChild(box);
        return;
      }
      creating = false;
      if (startBtn) startBtn.disabled = false;
      return UI.toast(error.message, "err");
    }
    /* 这里**不再**把 creating 放开。创建已经成功，旧的那个入口从此不该
       再能发出第二次 insert；成功之后页面要么进表单、要么进下面那张
       「已创建但没读到」的卡，两者都没有创建入口。
       （监督点名的那段重读窗口：实测没有复现 —— 入口按钮在 insert 之前
        就已 disabled，只有失败分支才解锁。这里是把那道封锁写明确，
        不再依赖「正好还 disabled 着」。）

       草稿**已经建出来了**。这一读若失败，原来 app 被赋成 null，紧接着
       render() 取 app.status 就抛 TypeError，页面当场坏掉，回到
       「还没有正式申请」—— 他很可能会再点一次，建出第二份。 */
    const { data: rows, error: reErr } = await Api.rpc("my_application");
    reqs = []; reqsUnknown = false;
    if (reErr || !Array.isArray(rows) || !rows[0]) {
      main.innerHTML = UI.box("📝", "草稿已创建，但这一次没读到它的内容",
        "你的申请草稿已经建好了。这一次没能读到最新内容，所以这里暂时不显示表单。" +
        "请刷新页面继续填写 —— 不要重新创建，否则会出现第二份申请。") +
        '<button class="btn" type="button" id="btnDraftReload" style="width:auto;padding:0 22px;margin-top:12px">刷新页面</button>';
      document.getElementById("btnDraftReload")?.addEventListener("click", () => location.reload());
      return;
    }
    app = rows[0];
    render();
    UI.toast("草稿已创建，内容会自动保存");
  }

  // ---------- 渲染 ----------
  function render(){
    const editable = EDITABLE.includes(app.status);
    const locked = new Set(app.locked_fields || []);
    const s = ST[app.status] || { t: app.status, d: "" };

    main.innerHTML = `
      <h1>我的申请</h1>
      <p class="lead">正式入学申请 · 表单版本 ${UI.esc(app.form_version)}</p>

      <div class="card" style="margin-bottom:18px">
        <div class="pagehead" style="margin:0">
          <div>
            <span class="st ${app.status}">${s.t}</span>
            <div class="who" style="margin-top:6px">${UI.esc(s.d)}</div>
          </div>
          <div style="text-align:right">
            <div class="who" id="saveState">${editable ? "自动保存已开启" : "已锁定，不可编辑"}</div>
            ${editable ? `<button class="link" id="btnWithdraw" style="margin-top:6px">撤回申请</button>` : ""}
          </div>
        </div>
        ${/* 分项补件说明常是多行；不加 pre-wrap 会挤成一行，他读不清哪项是哪项。转义仍走 UI.esc。 */ ""}
        ${app.applicant_visible_message ? `<div class="msg info show" style="margin-top:12px"><b>招生同工留言：</b><span style="white-space:pre-wrap">${UI.esc(app.applicant_visible_message)}</span></div>` : ""}
      </div>
      ${renderHq()}

      ${reqs.length ? renderRequirements() : ""}
      ${/* 读到几项、同时又带着 error 的情况是存在的 —— 那时 reqs 非空，
           原来 `reqs.length ? … : (reqsUnknown ? …)` 会直接短路，
           那条「没读到」永远不显示，等于把 error 忽略掉。服务端给了 error，
           这份清单就不能当作完整的：已经拿到的照常显示，**另外**说清楚它可能不全。
           只在「需补充资料」这个状态下说 —— 别的状态本来就不该有这张卡，
           那时候它不出现并不是在断言什么。 */
        reqsUnknown && app.status === "needs_information" ? renderRequirementsUnknown(reqs.length) : ""}

      ${editable ? `
        <div class="steps" role="tablist" id="stepBar"></div>
        <form id="appForm" class="card" novalidate></form>
        <div class="card" style="margin-top:14px">
          <div class="row">
            <button class="link" id="btnPrev">← 上一步</button>
            <button class="link" id="btnNext">下一步 →</button>
          </div>
          <button class="btn" id="btnSubmit" type="button">提交申请</button>
          <div class="msg err" id="subErr" role="alert" tabindex="-1"></div>
          <div class="hint">提交后，姓名、出生年月、性别、国籍、初信/受洗日期与申请项目将被锁定；其余字段仍可修改。</div>
        </div>` : `<div class="card">${renderReadonly(locked)}</div>`}

      <div class="card" style="margin-top:18px">
        <h2 style="font-size:16px">状态时间线</h2>
        <div id="tl">${UI.skeleton(2)}</div>
      </div>`;

    if (editable) { buildSteps(); bindEditor(); }
    document.getElementById("btnReqReload")?.addEventListener("click", () => location.reload());
    /* 总校说明**不经 innerHTML**：容器是空的，正文在这里用 textContent 放进去。 */
    const hqNote = main.querySelector("[data-hqnote]");
    if (hqNote && hq) hqNote.textContent = hqNoteText();
    const hqBtn = main.querySelector("[data-hqreload]");
    if (hqBtn) hqBtn.addEventListener("click", reloadHq);
    if (hqFocusBack) {                                  // 是他按的重读：焦点别掉到 body
      hqFocusBack = false;
      /* 但**只恢复被这次重绘打掉的那一份**。按下之后还要等读取回来，
         这段时间他完全可以走开（去导航、去别处）——
         那时无条件 focus 就是把他从别处拽回来（teachers 页同一条边界，
         第九十七包 Ns5 已经栽过一次）。 */
      const now = document.activeElement;
      if (!now || now === document.body || !now.isConnected) {
        (hqBtn || main.querySelector("#hqBox"))?.focus?.();
      }
    }
    /* 补件卡片是 render() 渲染的，绑定就跟着它走 —— 切步骤不该再绑一遍。 */
    bindRequirementTicks();
    /* 「去修改」：跳到那一步并把光标放进那个字段 —— 这是**有意**的导航，
       表单本来就要重绘，和「打字时别重绘」是两回事。
       用**委托**绑在 main 上，并且在处理器里再挡一道：不可编辑的状态下什么都不做。
       只靠「不渲染按钮」不够 —— 那不是防御，只是没给入口。 */
    /* render() 会被反复调用（勾选补件、提交后重读…），而 main 这个元素是**不换**的 ——
       每次都 addEventListener 会一路叠上去，点一次就跑 N 遍。只绑一次。 */
    if (!goFieldBound) { goFieldBound = true;
    main.addEventListener("click", (e) => {
      const b = e.target && e.target.closest && e.target.closest("[data-gofield]");
      if (!b) return;
      if (!app || !EDITABLE.includes(app.status)) return;      // 只读状态：不导航
      const name = b.dataset.gofield;
      const i = stepOfField(name);
      if (i < 0) return;
      if (!document.getElementById("stepBar")) return;         // 表单没渲染出来就别动
      step = i;
      buildSteps();
      focusFormField(name);
    }); }
    document.getElementById("btnWithdraw")?.addEventListener("click", withdraw);
    loadTimeline();
  }

  /* pathway / rows / checkboxes 都不是 fd-<name> 那种输入框：
       __pathway / checkboxes → <div class="cbs" data-f="…"> 里的一组 radio/checkbox
       rows                   → <div class="rowsets" data-f="…"> 里的一排 [data-row] 输入
     承诺了「跳过去并聚焦」，就得聚焦到**这一组里真正能操作的那个控件**上，
     而不是去找一个根本不存在的 fd-education。 */
  function focusFormField(name){
    const n = name === "pathway" ? "__pathway" : name;
    const direct = document.getElementById("fd-" + n);
    if (direct && !direct.disabled) {
      direct.focus(); direct.scrollIntoView({ block: "center" }); return true;
    }
    const holder = document.querySelector('[data-f="' + n.replace(/"/g, '\\"') + '"]');
    if (holder) {
      const ctl = holder.querySelector(
        "input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])");
      if (ctl) { ctl.focus(); ctl.scrollIntoView({ block: "center" }); return true; }
    }
    /* rows 一行都没有时，能操作的只有「+ 添加一行」。 */
    const add = document.querySelector('[data-addrow="' + n.replace(/"/g, '\\"') + '"]');
    if (add && !add.disabled) { add.focus(); add.scrollIntoView({ block: "center" }); return true; }
    if (holder) holder.scrollIntoView({ block: "center" });
    return false;
  }

  /* 写成函数声明而不是 const：render() 的调用点在这些定义之前，
     const 那时还处于 TDZ，整张页面会当场渲染不出来。（同一个坑本轮踩过。） */
  function fieldLabel(n){
    for (const st of F.STEPS) for (const f of st.fields) if (f.name === n) return f.label;
    return null;
  }
  /** 补件条目指定了字段时，把「是哪个字段、在第几步、现在能不能改」说清楚。 */
  function requirementFieldLine(r){
    if (!r.field) return "";                       // 纯文字说明，不硬造一个字段出来
    const i = stepOfField(r.field);
    const lab = fieldLabel(r.field === "pathway" ? "__pathway" : r.field);
    /* 只读状态（已提交／终态）下这张表单根本没渲染出来 —— 连 stepBar 都不存在。
       上一版只看「这个字段锁没锁」就发导航按钮，而 education 这类字段本来就不在
       提交后的锁定表里（0008:251），于是只读页上照样出现「去修改」，
       一点就调 buildSteps() 给不存在的 stepBar 设 innerHTML，当场 TypeError。
       能不能导航，取决于**这份申请现在能不能编辑**，不是单看某个字段。 */
    if (!EDITABLE.includes(app.status)) {
      const where = (i >= 0 && lab) ? `对应字段：<b>${UI.esc(lab)}</b>（第 ${i + 1} 步）` :
        `对应字段：<b>${UI.esc(r.field)}</b>`;
      return `<div class="who" style="margin-top:4px">${where} —— 申请已提交，现在是<b>只读</b>的，不能修改。</div>`;
    }
    if (i < 0 || !lab) {
      /* 表单版本漂移：这一版里没有这个字段名。照实说，不乱指一个。 */
      return `<div class="who" style="margin-top:4px">对应字段：<b>${UI.esc(r.field)}</b>` +
        `（这一版表单里没有这个字段，请联系招生同工）</div>`;
    }
    const locked = new Set(app.locked_fields || []).has(r.field);
    if (locked) {
      /* 别把人支去点一个灰框。 */
      return `<div class="who" style="margin-top:4px">对应字段：<b>${UI.esc(lab)}</b>（第 ${i + 1} 步）` +
        ` —— 这一项现在仍是<b>锁定</b>的，改不了，请联系招生同工。</div>`;
    }
    return `<div class="who" style="margin-top:4px">对应字段：<b>${UI.esc(lab)}</b>（第 ${i + 1} 步）` +
      `<button class="link" type="button" data-gofield="${UI.esc(r.field)}" style="margin-left:6px">去修改</button></div>`;
  }

  function renderRequirements(){
    const items = reqs.map(r => `
      <li class="rq${r.resolved ? " done" : ""}">
        <label>
          <input type="checkbox" data-req="${r.id}" ${r.resolved ? "checked disabled" : ""}>
          <span><b>${UI.esc(r.label)}</b>${r.detail ? `<em>${UI.esc(r.detail)}</em>` : ""}</span>
        </label>
        ${requirementFieldLine(r)}
      </li>`).join("");
    const pending = reqs.filter(r => !r.resolved).length;
    /* 门户现在**不支持上传附件**（全站没有任何文件输入口）。补件里若有要交材料的，
       他在这一页会找不到地方传，容易以为自己漏了什么。这里如实说一句。
       只说「门户不支持、按招生同工给的方式交」—— **不编造**邮箱或链接、
       **不**声称已另寄、**不**替他判断哪些条目一定是文件、**不**加上传按钮。
       只在「需补充资料」这个状态下出现：普通草稿不该被误导成必须线下交件。 */
    const attachNote = app.status === "needs_information"
      ? `<div class="msg info show" style="margin-top:10px"><b>需要交材料的条目：</b>
门户目前不支持上传附件，请按招生同工告诉你的方式提交；不确定的话，直接问招生同工。</div>`
      : "";
    return `<div class="card" style="margin-bottom:18px;border-left:4px solid var(--gold)">
      <h2 style="font-size:16px">需要补充的资料（未完成 ${pending} 项）</h2>
      ${attachNote}
      <p class="sub">${EDITABLE.includes(app.status)
        ? "补充完成后勾选，全部完成才能重新提交。"
        : "以下是这次申请的补件记录，申请已提交，现在是<b>只读</b>的，不能修改。"}</p>
      <ul class="rqlist">${items}</ul>
    </div>`;
  }

  /* 蓝图 §6：「提交前校验…在**前端提示** + RPC 二次校验」。
     此前只做了后一半 —— application-form.js 里每个字段都标了 required，
     而页面只拿它画了一个红星，此外一处没用：「下一步」无条件前进、步骤条看不出
     哪一步还差、只有等服务端 validation_failed 回来才知道缺什么，而那条消息
     只给字段名不说在第几步（四十来个字段、六个步骤，得自己翻）。

     这里只做**提示**，不封死：必填与格式的权威判定在
     application_validate_form，他坚持提交就照样提交，由服务端判。 */
  /* application_validate_program（0010_program_catalog.sql:55-63）要求三件事：
       **恰好一项**、在目录里、且 is_open_for_application。
     上一包只做了后两件 —— 只看 arr[0] 开不开放。于是一份历史草稿
     programs=["bth","cert"]：下拉是单选、只显示第一个，第二个代码根本看不见；
     数量那条没人判，这一步显示成已完成；提交被退回，而他看着下拉里明明选着
     一个正常项目，没有任何东西能解释。 */
  function programIssue(){
    const arr = Array.isArray(app.form_data.programs) ? app.form_data.programs : [];
    /* 顺序要紧：空、多个这两条**根本不需要目录**，不能被「目录没读到」一起短路掉。
       （上一版把 catalogFailed 放在最前面，结果目录一失败，连「他压根没选」都不提了 ——
        那是相对再上一版的退化。）
       目录读不到只说明**这一个开不开放无法确认**，仅此而已。 */
    if (!arr.length) return { kind: "empty", codes: arr };
    if (arr.length > 1) return { kind: "multi", codes: arr };
    if (catalogFailed) return { kind: "unknown", codes: arr };
    return programs.some(p => p.code === arr[0])
      ? { kind: "none", codes: arr } : { kind: "closed", codes: arr };
  }
  const progName = (code) => {
    const p = programs.find(x => x.code === code);
    return p ? p.name_zh : String(code);
  };
  /** 项目那块警告的内容。fieldHtml 与 refreshProgramSync 都用它，省得两处说法不一致。 */
  function programWarnHtml(){
    const it = programIssue();
    if (it.kind === "multi") {
      /* 不静默丢他原来的值：两个都列出来，由他自己选定一个。 */
      return `<div class="msg warn show" style="margin:6px 0">这份草稿里存了 <b>${it.codes.length}</b> 个项目：` +
        it.codes.map(c => UI.esc(progName(c))).join("、") +
        `。一份申请<b>只能对应一个</b>，这样提交会被退回。<br>` +
        `下拉里现在选中的是「${UI.esc(progName(it.codes[0]))}」—— 换一个，或者` +
        `<button class="btn ghost" type="button" data-progfix style="width:auto;padding:0 14px;margin-left:4px">只保留选中的这一个</button></div>`;
    }
    if (it.kind === "closed") {
      return `<div class="msg warn show" style="margin:6px 0">你之前选的这个项目<b>已不开放申请</b>，` +
        `这样提交会被退回。请换一个开放的项目。</div>`;
    }
    return "";
  }

  function isBlankField(f){
    const v = f.name === "__pathway" ? app.pathway : app.form_data[f.name];
    /* 项目这一项的规则是明确的（0010_program_catalog.sql:55-63）：
       恰好一项、在目录里、且 is_open_for_application。
       选了一个已经停招的，跟没选一样交不上去 —— 但**目录读不到时不下判断**。 */
    if (f.name === "programs") {
      const k = programIssue().kind;
      return !(k === "none" || k === "unknown");   // unknown = 目录没读到，不下判断
    }
    if (v === null || v === undefined) return true;
    if (Array.isArray(v)) {
      if (f.type === "rows") {
        return !v.some(r => r && Object.values(r).some(x => String(x == null ? "" : x).trim()));
      }
      return v.length === 0;
    }
    if (typeof v === "boolean") return false;          // 勾选框：false 也是填了
    return String(v).trim() === "";
  }
  function missingRequired(){
    const out = [];
    F.STEPS.forEach((st, i) => st.fields.forEach(f => {
      if (!f.required || !isBlankField(f)) return;
      /* 「选了但已停招」不是「没填」，清单里要说出真正的原因。 */
      let why = "";
      if (f.name === "programs") {
        const it = programIssue();
        if (it.kind === "multi") why = "（存了 " + it.codes.length + " 个，只能对应一个）";
        else if (it.kind === "closed") why = "（已不开放申请，请换一个）";
      }
      out.push({ label: f.label + why, step: i, stepTitle: st.title, name: f.name });
    }));
    return out;
  }
  /* 服务端回的是列名（pathway），表单里那一项叫 __pathway。 */
  function stepOfField(name){
    const n = name === "pathway" ? "__pathway" : name;
    for (let i = 0; i < F.STEPS.length; i++) if (F.STEPS[i].fields.some(f => f.name === n)) return i;
    return -1;
  }
  /** 把缺项按步骤分组显示，并给「去补填」（以及可选的「仍然提交」）。 */
  function renderMissing(err, items, withAnyway){
    const byStep = new Map();
    for (const it of items) {
      const k = it.step;
      if (!byStep.has(k)) byStep.set(k, { title: it.stepTitle || (F.STEPS[k] && F.STEPS[k].title) || "", items: [] });
      byStep.get(k).items.push(it.label);
    }
    const lines = [...byStep.entries()].map(([i, g]) => i >= 0
      ? `<li>第 ${i + 1} 步「${UI.esc(g.title)}」：${g.items.map(UI.esc).join("、")}</li>`
      : `<li>${g.items.map(UI.esc).join("、")}</li>`).join("");
    err.innerHTML = `<b>这几项还没填：</b><ul style="margin:6px 0 8px 18px">${lines}</ul>` +
      `<button class="btn" type="button" data-gofix style="width:auto;padding:0 16px;margin-right:8px">去补填</button>` +
      (withAnyway ? `<button class="btn ghost" type="button" data-submitanyway style="width:auto;padding:0 16px">仍然提交</button>` : "") +
      `<div class="who" style="margin-top:6px">必填与格式最终以服务端判定为准，这里只是提前提醒。</div>`;
    err.classList.add("show");
    const first = items.find(it => it.step >= 0);
    err.querySelector("[data-gofix]")?.addEventListener("click", () => {
      if (first) { step = first.step; buildSteps(); }
      err.classList.remove("show");
      /* 重建之后，他刚才按的那个按钮已经不在了 —— 焦点会掉到 <body>，
         键盘用户被扔回页首，得重新 Tab 一遍才能回到表单（本轮实测 K3d）。
         直接送到第一个缺的字段：这也正是这个按钮承诺的事。 */
      if (first && first.name && focusFormField(first.name)) return;
      document.querySelector(`[data-step="${step}"]`)?.focus();
    });
    err.querySelector("[data-submitanyway]")?.addEventListener("click", () => submit(true));
  }

  /** 被服务端以 requirements_pending 挡回来时该说什么（蓝图 P1-14：
      「RPC 拒绝并**回列缺失项**」）。

      服务端按 unresolved = 0 放行重新提交（0008_applications.sql:241-246），
      挡回来时只回一个数字。页面原来把那个数字原样念出来：
      「还有 2 项补充资料未标记完成。」—— 哪两项、在哪里，一个字没有；
      而同一个函数的 validation_failed 分支早就是逐项列出 +「去补填」。
      补件清单客户端手里就有（reqs），这里把它用上。

      **读不到 ≠ 没有**：客户端能列出的条数和服务端说的对不上时，如实说明差额，
      不假装我们知道全部，也不把服务端的数字改写成自己的。 */
  function renderPendingReqs(err, count){
    const mine = reqs.filter(r => !r.resolved);
    /* **数目要么确定，要么就是不知道。**
       原来写的是 `Number.isFinite(Number(count)) && n >= 0` ——
       而 `Number(null)` 是 0：服务端没给数目时页面会一本正经地说「还有 0 项」。
       非整数、布尔、数字字符串同理，一律按**不知道**处理，不替服务端补一个数。 */
    const known = typeof count === "number" && Number.isInteger(count) && count >= 0;
    const diff = known ? count - mine.length : 0;

    /* 两边对不上时，**服务端的数目是准的，这一页的清单不是**：
         · 我们比服务端少 —— 有条目这一次没读到；
         · 我们比服务端多 —— 多出来的可能是已经完成/被撤下的旧条目
           （监督实测 eventb913：服务端说 1 项，页面说 1 项却列了 2 条，
             一个字的不同步说明都没有，等于把过期条目当成当前要求）。
       两个方向都要说，而且都只指向同一条出路：刷新重新读取。 */
    const stale = !known || diff !== 0;
    const lines = mine.map(r =>
      `<li>${UI.esc(r.label)}${r.detail ? `（${UI.esc(r.detail)}）` : ""}</li>`).join("");

    let note = "";
    if (!mine.length) {
      note = "这一次没能读到具体是哪几项，可以用下面的入口重新读一次。";
    } else if (!known) {
      note = "这一次没能确认还剩几项，下面这几项是这一页上一次读到的，可能已经不是最新的 —— 可以重新读一次。";
    } else if (diff > 0) {
      note = "另外还有 " + diff + " 项这一次没能读到，可以重新读一次。";
    } else if (diff < 0) {
      note = "这一页列出的比服务端说的多 " + (-diff) + " 项 —— 多出来的可能是已经完成、" +
             "或者已经被撤下的旧条目。以服务端说的为准，可以重新读一次。";
    }

    err.innerHTML =
      `<b>这一次没有提交：${known
        ? "服务端说还有 " + count + " 项补充资料没有标记为「已补」。"
        : "还有补充资料没有标记为「已补」。"}</b>` +
      (lines ? `<div class="who" style="margin:6px 0 2px">${stale
        ? "下面这几项是这一页上一次读到的，**可能不是最新的**："
        : "这几项还没标记："}</div><ul style="margin:2px 0 8px 18px">${lines}</ul>` : "") +
      (note ? `<div class="who" style="margin:6px 0 8px">${note}</div>` : "") +
      (lines ? `<button class="btn" type="button" data-goreq style="width:auto;padding:0 16px;margin-right:8px">去看这几项</button>` : "") +
      (stale ? reqReloadBtn() : "");
    err.classList.add("show");
    err.setAttribute("role", "alert");
    err.querySelector("[data-goreq]")?.addEventListener("click", () => {
      /* 带他到补件卡里**第一条还没完成**的那一项上。 */
      const li = document.querySelector(".rqlist .rq:not(.done)");
      if (!li) return;
      li.scrollIntoView({ block: "center" });
      const cb = li.querySelector("input[type=checkbox]");
      if (cb) cb.focus();
    });
    bindReqReload(err);
  }

  const reqReloadBtn = (label) =>
    `<button class="btn ghost" type="button" data-reqreload style="width:auto;padding:0 16px">${
      label || "重新读取补件清单"}</button>`;
  function bindReqReload(el){
    el.querySelector("[data-reqreload]")?.addEventListener("click", reloadRequirements);
  }

  /** 只**重新读补件清单**，不动表单。

      上一包这个按钮直接 `location.reload()`。可他是在**提交被挡回来之后**
      看到它的 —— 那时候很可能正接着改：共享层 UI.formGuard 只弹一句
      「确定离开？」，而存储被拒时离开守卫那条暂存是空的，
      页面上这一份就是唯一的一份，一重载就没了（监督点名，实测 R1/R2 成立）。

      重画表单用的是 app.form_data —— 他每敲一个字就已经写进去了，所以编辑原样还在；
      step 也保持在他所在的那一步。读不到就说读不到，不假称是最新的，
      更不说「已保存」（这个按钮跟保存没有关系）。 */
  /* 在途锁挂在**模块上**，不挂在按钮上。
     原来只靠 `btn.disabled`，而勾「已补」那条路末尾会 render() ——
     一重画 #subErr 连同那个按钮一起没了，锁也就跟着没了。 */
  let reqReloadBusy = false;
  async function reloadRequirements(){
    if (reqReloadBusy) return;
    reqReloadBusy = true;
    const btn = document.querySelector("#subErr [data-reqreload]");
    if (btn) { btn.disabled = true; btn.textContent = "正在重新读取…"; }
    try { await loadRequirements(); } finally { reqReloadBusy = false; }
    render();                                   // 按 app.form_data 重画：未保存的编辑不丢
    const err = document.getElementById("subErr");
    if (!err) return;
    const left = reqs.filter(r => !r.resolved);
    if (reqsUnknown) {
      /* 读失败也要留一条**能再读一次**的路 —— 不然他只能靠再提交一次来触发，
         那是一次不必要的写入（监督点名，实测 T1/T2）。 */
      err.innerHTML = `<b>这一次没能重新读到补件清单。</b>` +
        `<div class="who" style="margin:6px 0 8px">上面显示的还是刚才那一份，不一定是最新的。` +
        `你填的内容都还在，可以再读一次。</div>` + reqReloadBtn("再读一次");
    } else if (!left.length) {
      err.innerHTML = `<b>刚刚重新读过：补件条目都已经标记为「已补」。</b>` +
        `<div class="who" style="margin-top:6px">可以再试一次提交 —— 能不能交上去由服务端判定。</div>`;
    } else {
      err.innerHTML = `<b>刚刚重新读过：现在还有 ${left.length} 项没有标记为「已补」。</b>` +
        `<ul style="margin:6px 0 8px 18px">${left.map(r => `<li>${UI.esc(r.label)}</li>`).join("")}</ul>` +
        `<div class="who">标记完成之后再提交。</div>`;
    }
    err.classList.add("show");
    bindReqReload(err);                         // 重画之后重新接上，别只剩一句话
    /* render() 把整页重画了，他刚按下的那个按钮已经不在 —— 焦点会掉到 <body>
       （本轮实测 K5e）。落到这条**刚刚变化的消息**上：他按的就是它，
       读屏也正好读到结果。 */
    err.focus();
  }

  function renderRequirementsUnknown(got){
    return `<div class="card" style="margin-bottom:18px;border-left:4px solid var(--gold)">
      <h2 style="font-size:16px">需要补充的资料（这一次${got ? "没读全" : "没能读到"}）</h2>
      <p class="sub">${got
        ? "上面这份清单这一次<b>没有读全</b>，可能还有没显示出来的项目。"
        : "教务要求你补充的项目这一次没能读出来 —— <b>这不表示已经补完了</b>。"}
      在全部补件完成之前，提交会被退回。请刷新页面再看一次；若一直读不到，请联系招生同工。</p>
      <button class="btn" type="button" id="btnReqReload" style="width:auto;padding:0 20px">刷新页面</button>
    </div>`;
  }

  function renderReadonly(locked){
    const rows = [];
    for (const st of F.STEPS) for (const f of st.fields) {
      if (f.name.startsWith("__")) continue;
      const v = app.form_data[f.name];
      if (v === undefined || v === "" || (Array.isArray(v) && !v.length)) continue;
      let text;
      if (f.type === "rows") text = (v || []).map(r => Object.values(r).filter(Boolean).join(" · ")).join("；");
      else if (Array.isArray(v)) text = v.join("、");
      else if (typeof v === "boolean") text = v ? "已确认" : "未确认";
      else text = String(v);
      if (f.name === "programs") {
        const p = programs.find(x => x.code === v[0]);
        text = p ? `${p.name_zh}（${p.short_label}）` : text;
      }
      rows.push(`<div class="ro"><span>${UI.esc(f.label)}</span><b>${UI.esc(text)}</b>${locked.has(f.name) ? '<i class="lockmark">已锁定</i>' : ""}</div>`);
    }
    const pw = F.PATHWAYS.find(p => p.value === app.pathway);
    rows.unshift(`<div class="ro"><span>学习路径</span><b>${UI.esc(pw ? pw.label : app.pathway)}</b></div>`);
    return `<h2 style="font-size:16px">申请内容</h2>${rows.join("")}`;
  }

  // ---------- 分步编辑 ----------
  function buildSteps(){
    /* 步骤条上直接标出哪一步还差几项 —— 不用等提交才知道。 */
    const missByStep = {};
    for (const m of missingRequired()) missByStep[m.step] = (missByStep[m.step] || 0) + 1;
    const bar = document.getElementById("stepBar");
    if (!bar) return;                 // 只读页没有步骤条 —— 别对 null 设 innerHTML
    bar.innerHTML = F.STEPS.map((s, i) =>
      `<button type="button" role="tab" data-step="${i}" class="${i === step ? "on" : ""}" aria-selected="${i === step}">${
        UI.esc(s.title)}<span class="who" data-missbadge="${i}" style="margin-left:5px"></span></button>`).join("");
    bar.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      step = +b.dataset.step; buildSteps(); renderStep();
      /* buildSteps() 把整条步骤条重画了，他刚按下的那个按钮已经被换掉 ——
         焦点掉到 <body>，键盘用户被扔回页首（本轮实测 K1d）。
         重新指到**当前这一步**的标签上：鼠标用户点的本来就是它，无感。 */
      document.querySelector(`[data-step="${step}"]`)?.focus();
    }));
    /* 这条步骤条声明的是 ARIA 的 tabs 模式（容器 role="tablist"，每个按钮
       role="tab" + aria-selected）。认这套约定的人 —— 尤其是读屏用户 ——
       到了标签上就会按 ←/→ 走，Home/End 到首尾。修前按了**毫无反应**，
       只能一个一个 Tab 过去。声明了 role 却不给配套的键盘行为，
       等于对辅助技术说了一句自己做不到的话。
       监听挂在容器上（按钮每次 buildSteps 都会被换掉），只挂一次。 */
    if (!bar.dataset.kbd) {
      bar.dataset.kbd = "1";
      bar.addEventListener("keydown", (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        const n = F.STEPS.length;
        let to = null;
        if (e.key === "ArrowRight") to = (step + 1) % n;          // tabs 模式是环形的
        else if (e.key === "ArrowLeft") to = (step - 1 + n) % n;
        else if (e.key === "Home") to = 0;
        else if (e.key === "End") to = n - 1;
        else return;
        e.preventDefault();                                       // 别让 Home/End 去滚页面
        step = to; buildSteps(); renderStep();
        document.querySelector(`[data-step="${step}"]`)?.focus();
      });
    }
    refreshStepBadges();
    renderStep();
    syncStepNav();
  }

  /* 「← 上一步」「下一步 →」到头之后是**什么都不做**的（:1172-1173 的 if 守卫），
     但它们既不 disabled 也不 aria-disabled —— Tab 照样走得到、读屏照样念成可用。
     键盘用户在第 1 步按「← 上一步」，按下去毫无反应也毫无解释（本轮实测 Kb1/Kb3）。
     到头就如实禁用。

     有个坑得一起接住：**禁用一个正被聚焦的元素会让焦点掉回 <body>**。
     他在倒数第二步按「下一步 →」走到最后一步，这个按钮随即被禁用 ——
     不管的话他就被扔回页首，从头 Tab 一遍。所以先把焦点交给旁边那个还能用的，
     实在没有就交给当前这一步的标签（与点击路径同一套收尾）。 */
  function syncStepNav(){
    const prev = document.getElementById("btnPrev");
    const next = document.getElementById("btnNext");
    if (!prev || !next) return;                 // 只读页没有这两个键
    const want = { prev: step === 0, next: step === F.STEPS.length - 1 };
    for (const [el, off, other] of [[prev, want.prev, next], [next, want.next, prev]]) {
      if (!off || el.disabled) { el.disabled = off; continue; }
      const hadFocus = document.activeElement === el;
      el.disabled = true;
      if (hadFocus) {
        if (!other.disabled) other.focus();
        else document.querySelector(`[data-step="${step}"]`)?.focus();
      }
    }
  }

  /* 项目那条警告也要跟着选择走：他换成开放项目之后，不能还挂着「会被退回」。
     同样只换那一小块 —— 不碰 select 本身，焦点就还在他手上。
     （catalogFailed 那一支的说明不在这个容器里，所以不会被顺手抹掉。） */
  function refreshProgramSync(){
    const cur = Array.isArray(app.form_data.programs) ? app.form_data.programs[0] : "";
    const known = programs.some(p => p.code === cur);
    const sel = document.getElementById("fd-programs");
    if (sel) sel.querySelectorAll("[data-staleprog]").forEach(o => { if (o.value !== cur) o.remove(); });
    const box = document.querySelector("[data-progwarn]");
    if (!box) return;                       // 目录没读到的那一支不带这个容器
    box.innerHTML = programWarnHtml();
  }

  /* 角标要跟着填写走。但**只能改角标**：调 buildSteps() 会连表单一起重绘，
     正在打字的输入框当场失焦。所以这里只写那几个 span 的文字。 */
  function refreshStepBadges(){
    const bar = document.getElementById("stepBar");
    if (!bar) return;
    const by = {};
    for (const m of missingRequired()) by[m.step] = (by[m.step] || 0) + 1;
    bar.querySelectorAll("[data-missbadge]").forEach(el => {
      const n = by[+el.dataset.missbadge] || 0;
      el.textContent = n ? "还差 " + n : "";
    });
  }

  function renderStep(){
    const st = F.STEPS[step];
    const locked = new Set(app.locked_fields || []);
    const form = document.getElementById("appForm");
    form.innerHTML = `<h2 style="font-size:16px">${UI.esc(st.title)}</h2>` +
      (st.note ? `<p class="sub">${UI.esc(st.note)}</p>` : "") +
      `<div class="fgrid">${st.fields.map(f => fieldHtml(f, locked)).join("")}</div>`;
    bindFieldEvents();
  }

  function fieldHtml(f, locked){
    const isLocked = locked.has(f.name);
    const v = f.name === "__pathway" ? app.pathway : app.form_data[f.name];
    const dis = isLocked ? "disabled" : "";
    const req = f.required ? ' <span aria-hidden="true" style="color:var(--err)">*</span>' : "";
    const lab = `<label for="fd-${f.name}">${UI.esc(f.label)}${req}${isLocked ? '<i class="lockmark">提交后锁定</i>' : ""}</label>`;
    const hint = f.hint ? `<div class="fhint">${UI.esc(f.hint)}</div>` : "";
    let ctl = "";

    if (f.type === "select") {
      ctl = `<select id="fd-${f.name}" data-f="${f.name}" ${dis}><option value="">请选择</option>` +
        f.options.map(([val, txt]) => `<option value="${val}"${v === val ? " selected" : ""}>${UI.esc(txt)}</option>`).join("") + `</select>`;
    } else if (f.type === "checkboxes") {
      const arr = Array.isArray(v) ? v : [];
      ctl = `<div class="cbs" data-f="${f.name}">` + f.options.map(([val, txt]) =>
        `<label class="cb"><input type="checkbox" value="${val}" ${arr.includes(val) ? "checked" : ""} ${dis}><span>${UI.esc(txt)}</span></label>`).join("") + `</div>`;
    } else if (f.type === "checkbox") {
      ctl = `<label class="cb"><input type="checkbox" id="fd-${f.name}" data-f="${f.name}" ${v ? "checked" : ""} ${dis}><span>${UI.esc(f.label)}</span></label>`;
      return `<div class="full">${ctl}${hint}</div>`;
    } else if (f.type === "textarea") {
      ctl = `<textarea id="fd-${f.name}" data-f="${f.name}" maxlength="${f.max || 2000}" ${dis}>${UI.esc(v || "")}</textarea>`;
    } else if (f.type === "program") {
      const cur = Array.isArray(v) ? v[0] : "";
      const opts = programs.map(p => `<option value="${p.code}"${cur === p.code ? " selected" : ""}>${UI.esc(p.name_zh)}${p.short_label ? "（" + UI.esc(p.short_label) + "）" : ""}</option>`).join("");
      const known = programs.some(p => p.code === cur);
      if (catalogFailed) {
        /* 读不到目录：他之前选的那个照旧留着、照旧显示，但不评价它 ——
           否则就是拿「我没读到」当「它不开放」。 */
        ctl = `<select id="fd-programs" data-f="programs" ${dis}>` +
          (cur ? `<option value="${UI.esc(cur)}" selected>${UI.esc(cur)}</option>` : `<option value="">请选择一个项目</option>`) +
          opts + `</select>` +
          `<div class="msg warn show" style="margin:6px 0">这一次没能读到课程目录，所以这里列不全可选项目。` +
          (cur ? `你之前选的「${UI.esc(cur)}」保留着，现在无法确认它是否仍然招生。` : "") +
          `请刷新后再选。</div>` +
          /* 目录读不到不影响「存了几个」这件事 —— 数量异常照样要能解释、能纠正。 */
          `<div data-progwarn>${programWarnHtml()}</div>`;
      } else {
        /* 之前选的那个如果已经不在开放目录里（当初开放、后来停招，或从 ?program= 带进来的），
           原来这里没有对应的 option —— 选择器会显示成空白的「请选择一个项目」，
           而 form_data.programs 里那个代码还在。人看见空白以为没选，提交却被退回。 */
        /* 那条警告放进一个**固定容器**里，好在选择变化时只换这一块 ——
           整段重绘会把正在操作的下拉弄失焦。
           残留的那个停招选项打上 data-staleprog：他一换走就把它摘掉，
           否则列表里会一直挂着一个「已不开放申请」的选项。 */
        ctl = `<select id="fd-programs" data-f="programs" ${dis}><option value="">请选择一个项目</option>` +
          (cur && !known ? `<option value="${UI.esc(cur)}" data-staleprog selected>${UI.esc(cur)}（已不开放申请）</option>` : "") +
          opts + `</select>` +
          `<div data-progwarn>${programWarnHtml()}</div>` +
          `<div class="fhint">一份申请对应一个主项目；如需申请其他项目，请在本申请结束后另行提交。</div>`;
      }
    } else if (f.type === "pathway") {
      ctl = `<div class="cbs" data-f="__pathway">` + F.PATHWAYS.map(p =>
        `<label class="cb"><input type="radio" name="pathway" value="${p.value}" ${app.pathway === p.value ? "checked" : ""} ${dis}>
          <span><b>${UI.esc(p.label)}</b><em>${UI.esc(p.hint)}</em></span></label>`).join("") + `</div>`;
    } else if (f.type === "rows") {
      const rows = Array.isArray(v) ? v : [];
      ctl = `<div class="rowsets" data-f="${f.name}">` +
        rows.map((r, i) => rowsetHtml(f, r, i, isLocked)).join("") +
        `</div>${isLocked ? "" : `<button type="button" class="btn ghost" data-addrow="${f.name}" style="width:auto;padding:0 18px;margin-top:8px">+ 添加一行</button>`}`;
    } else {
      ctl = `<input id="fd-${f.name}" data-f="${f.name}" type="${f.type === "month" ? "month" : f.type || "text"}" maxlength="${f.max || 200}" value="${UI.esc(v || "")}" ${dis}>`;
    }
    return `<div class="${f.full ? "full" : ""}">${lab}${ctl}${hint}</div>`;
  }

  function rowsetHtml(f, r, i, locked){
    return `<div class="rowset" data-i="${i}">
      <div class="rowset-head"><b>第 ${i + 1} 项</b>${locked ? "" : `<button type="button" class="link" data-delrow="${f.name}:${i}">删除</button>`}</div>
      <div class="fgrid">${f.columns.map(([k, lbl]) =>
        `<div><label>${UI.esc(lbl)}</label><input data-row="${f.name}:${i}:${k}" value="${UI.esc(r[k] || "")}" ${locked ? "disabled" : ""}></div>`).join("")}</div>
    </div>`;
  }

  function bindFieldEvents(){
    const form = document.getElementById("appForm");
    form.querySelectorAll("[data-f]").forEach(el => {
      const name = el.dataset.f;
      if (el.classList.contains("cbs")) {
        el.querySelectorAll("input").forEach(i => i.addEventListener("change", () => {
          if (name === "__pathway") { app.pathway = el.querySelector("input:checked")?.value || "undecided"; }
          else { app.form_data[name] = [...el.querySelectorAll("input:checked")].map(x => x.value); }
          touch();
        }));
      } else {
        el.addEventListener("input", () => {
          app.form_data[name] = el.type === "checkbox" ? el.checked
            : (name === "programs" ? (el.value ? [el.value] : []) : el.value);
          touch();
        });
        el.addEventListener("change", () => {
          app.form_data[name] = el.type === "checkbox" ? el.checked
            : (name === "programs" ? (el.value ? [el.value] : []) : el.value);
          touch();
        });
      }
    });
    /* 「只保留选中的这一个」：警告那块会被重绘，所以用委托绑在表单上。
       它只是把用户**当前选中的**那一个留下 —— 另一个代码在警告里已经列出来了，
       不是背着他丢掉的。 */
    form.addEventListener("click", (e) => {
      const b = e.target && e.target.closest && e.target.closest("[data-progfix]");
      if (!b) return;
      const sel = document.getElementById("fd-programs");
      if (!sel) return;
      app.form_data.programs = sel.value ? [sel.value] : [];
      touch();
    });
    form.querySelectorAll("[data-row]").forEach(el => el.addEventListener("input", () => {
      const [fname, idx, key] = el.dataset.row.split(":");
      app.form_data[fname] = app.form_data[fname] || [];
      app.form_data[fname][+idx] = app.form_data[fname][+idx] || {};
      app.form_data[fname][+idx][key] = el.value;
      touch();
    }));
    /* renderStep() 把整个表单重画了 —— 他刚按下的那个按钮已经不在，
       焦点会掉到 <body>：键盘用户加/删一行就被扔回页首，得重新 Tab 一遍
       （本轮实测 Rw6 / Rw9）。加完送到新那一行的第一个格子（他下一步就是往里填），
       删完落回这一组的「+ 添加一行」（这一组里最稳的落点）。 */
    form.querySelectorAll("[data-addrow]").forEach(b => b.addEventListener("click", () => {
      const n = b.dataset.addrow;
      app.form_data[n] = (app.form_data[n] || []).concat([{}]);
      touch(); renderStep();
      const idx = app.form_data[n].length - 1;
      const cell = document.querySelector('[data-row^="' + n + ':' + idx + ':"]');
      (cell || document.querySelector('[data-addrow="' + n + '"]'))?.focus();
    }));
    form.querySelectorAll("[data-delrow]").forEach(b => b.addEventListener("click", () => {
      const [n, i] = b.dataset.delrow.split(":");
      app.form_data[n].splice(+i, 1); touch(); renderStep();
      document.querySelector('[data-addrow="' + n + '"]')?.focus();
    }));
  }

  /* [data-req] 的 change 绑定原来写在 bindFieldEvents() 里，而它由 renderStep() 调用 ——
     **每切一次步骤就再绑一遍**，而且是全局查询，打在不随步骤重建的补件卡片上。
     实测一次勾选发了 4 个标记请求。绑定只跟着补件卡片自己的渲染走，并限定在卡片范围内。 */
  function bindRequirementTicks(){
    const list = document.querySelector(".rqlist");
    if (!list) return;
    list.querySelectorAll("[data-req]").forEach(cb => cb.addEventListener("change", async () => {
      if (cb.dataset.busy === "1") return;       // 一次勾选只发一个请求
      cb.dataset.busy = "1";
      try { await tickRequirement(cb); } finally { delete cb.dataset.busy; }
    }));
  }

  async function tickRequirement(cb){
    {
      /* 「已补」是**对数据的断言**。自动保存有 800ms 防抖，他改完马上勾的话，
         那次修改可能还没写进去、甚至根本没写成 —— 这一勾就等于替没落地的数据打包票，
         刷新回来还是旧值。提交那条路早就先 save() 再决定交不交，这里也一样。 */
      if (dirty) {
        clearTimeout(saveTimer);
        const saved = await save();
        if (saved && !saved.ok) {
          cb.checked = false;                       // 确实没标记，勾回去是事实
          return UI.toast(saved.unclear
            ? "没能确认你刚才的修改有没有保存成功，所以这一项没有标记为已补。请刷新核实之后再勾。"
            : "你刚才的修改没有保存成功（" + (saved.message || "原因未知") +
              "），所以这一项没有标记为已补。内容还在页面上，修好再勾。",
            "err");
        }
        /* 这一次保存确认的可能是**旧那一版** —— 等它回来的功夫他又改了。
           那就还没有任何证据说明最新内容落地了，不能标记，也不在这里闷头重存
           （重存等于拿一个未经确认的版本反复覆盖）。 */
        if ((saved && saved.stale) || dirty) {
          cb.checked = false;
          return UI.toast("保存还没跟上你最新的修改（刚才那一版存好时你又改了），" +
            "这一项没有标记为已补。等这一次保存完成后再勾。", "err");
        }
      }
      const { error } = await Api.rpc("resolve_requirement", { p_req: cb.dataset.req });
      if (error) {
        if (isUnknown(error)) {
          /* **不把勾去掉** —— 去掉等于断言「没生效」，而这一次恰恰不知道。
             也不让它马上能再点：真生效了的话，第二次就是重复标记。 */
          cb.disabled = true;
          return UI.toast("没能确认这一项有没有标记成功，请刷新后核实。", "err");
        }
        cb.checked = false;
        return UI.toast(error.message, "err");
      }
      await loadRequirements(); await loadHq(); render();
      UI.toast("已标记完成");
    }
  }

  function bindEditor(){
    document.getElementById("btnPrev").addEventListener("click", () => { if (step > 0) { step--; buildSteps(); } });
    document.getElementById("btnNext").addEventListener("click", () => { if (step < F.STEPS.length - 1) { step++; buildSteps(); } });
    /* 直接把 submit 当处理器会把 MouseEvent 当成第一个参数传进去 ——
       那个对象是真值，会被当成「坚持提交」。必须包一层。 */
    document.getElementById("btnSubmit").addEventListener("click", () => submit());
    UI.formGuard(() => dirty);
  }

  // ---------- 自动保存 ----------
  function touch(){
    dirty = true;
    refreshStepBadges();          // 补填之后当场更新，且不碰表单（不丢焦点）
    refreshProgramSync();         // 项目那条警告同理，跟着选择走
    setSaveState("正在编辑…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 800);
  }
  function setSaveState(t){ const e = document.getElementById("saveState"); if (e) e.textContent = t; }

  /** 保存并**如实回报结果**：{ ok, unclear, message }。

      原来 save() 什么都不返回，submit() 于是 `await save()` 之后直接往下走。
      监督独立复现（event9dbe）：Api.update 被明确拒绝（42501）之后，
      页面先显示「保存失败：…」，紧接着又发出 submit_application 并弹
      「申请已提交」—— **提交的是服务端上那份旧的表单**，用户刚填的内容
      从来没存进去，而他以为交上去了。 */
  /** 保存入口：**同一时刻只允许一笔写在途**，而且严格串行 —— 第二笔必须等第一笔
      落地、接上它确认的新版本之后才发出去。

      监督用有状态 CAS 夹具复现（第一笔还在路上时再存一笔）：两笔带的是**同一个**
      updated_at，服务端的乐观并发只会让先到的那一笔命中，后到的回 0 行。
      于是页面对着用户自己的保存喊「这份申请在别处被改过」，而且成功那一笔确认的
      新版本还会被顶替逻辑丢掉 —— 之后每一次保存都拿着过期版本去比对，笔笔落空，
      他除了重新载入没有别的出路，可根本没有别人改过。
      排队的这一次在**真正开始时**才读页面内容和版本号，所以一次就覆盖排队期间的
      所有修改，不需要排第二次。 */
  function save(){
    if (!saveTail) return trackSave(runSave());
    if (saveQueued) return saveTail;               // 已经排了一次，合并进去
    saveQueued = true;
    /* **前一笔没有确定成功，排队这一笔就不发。**
       原来是 `saveTail.then(start, start)` —— 前一笔是 {ok:false} 还是直接抛错，
       都照样启动下一笔写入。后果实测三种都成立：
         · 明确 0 行冲突之后又写一笔（他中间没有任何新动作）；
         · 结果不明之后又写一笔 —— 那就是拿未知写入去重试；而那一笔要是其实已经
           落地了，新这笔必然落空，页面于是说「这份申请在别处被改过 … 请重新载入」，
           **改动它的正是他自己那一笔**；
         · submit / 已补 这些等待者只拿得到后一笔的结论：前一笔真实的结论是
           「没能确认」（该走「先刷新核实」），却被后一笔的冲突盖成
           「没有保存成功（在别处被改过）…请稍后重试」。
       所以失败要**传播**下去：不再写，把前一笔的结论如实交给等待者。
       他做了新动作（再改一个字）就会重新发起保存 —— 队列不会就此卡死。 */
    const next = (prev) => { saveQueued = false;
      return (prev && prev.ok) ? runSave() : blockedBy(prev); };
    const threw = (e) => { saveQueued = false;
      return blockedBy({ ok: false, unclear: true, message: String((e && e.message) || e || "") }); };
    return trackSave(saveTail.then(next, threw));
  }
  /** 排队的这一笔没有发出去：如实说明，并且把**前一笔**的结论原样带给等待者
      （unclear 决定他们给「刷新核实」还是「改完再来」这条出路）。 */
  function blockedBy(prev){
    const unclear = !!(prev && prev.unclear);
    setSaveState(unclear ? "上一次保存没能确认结果，你的修改还没保存"
                         : "上一次保存没成功，你的修改还没保存");
    return { ok: false, unclear: unclear, blocked: true,
             conflict: !!(prev && prev.conflict),
             expired: !!(prev && prev.expired),
             message: (prev && prev.message) || "上一次保存没成功" };
  }
  function trackSave(p){
    saveTail = p;
    const done = () => { if (saveTail === p) { saveTail = null; saveQueued = false; }
                         refreshStashExport(); };
    p.then(done, done);
    return p;
  }
  async function runSave(){
    if (!EDITABLE.includes(app.status)) return { ok: true, unclear: false, skipped: true };
    /* PORTAL-blueprint §6 表单行为写明：「草稿本地 debounce 800ms +
       **服务端 updated_at 乐观并发**」。乐观并发这一半此前完全没做 ——
       保存只按 { id } 匹配，于是一个开着的旧标签页会拿它那份过期的
       form_data **整包覆盖**掉别处刚写进去的内容，而且一声不响。
       典型场景：教务把申请退回补充资料并解锁了某个字段（0011 精确解锁），
       申请人另一个早就开着的标签页一到点自动保存，把解锁前的快照写了回去。

       applications 上有 applications_set_updated_at 触发器（0008:51），
       所以把上次读到的 updated_at 一并作为匹配条件：命中 0 行就说明
       这条记录在别处被改过，这一次**确定没保存**。 */
    /* 没有版本基准就**不发这次写入**。原来这里 `if (app.updated_at)` 静默退成
       只按 { id } 匹配 —— 那就是一次无条件整包覆盖，正是本包要防的事。
       失败要朝安全那边关：宁可这一次不保存，也不要盖掉别处的改动。 */
    if (!app.updated_at) {
      setSaveState("没能确认当前版本，这一次没有保存");
      showConflict("没能确认这份申请当前是哪一版，所以这一次没有保存 —— " +
        "直接写会有覆盖别处改动的风险。你填的内容还在页面上，请重新载入取回版本信息。");
      return { ok: false, unclear: false, conflict: true,
               message: "没有可比对的版本基准" };
    }
    /* 记下**发出去的是哪一版**。保存是一次往返，这期间他完全可能继续改；
       旧响应回来时若无条件 dirty = false，就等于拿旧版本的成功替新内容背书。 */
    const sentSnap = JSON.stringify({ form_data: app.form_data, pathway: app.pathway });
    const myGen = ++saveSeq;
    const { data: rows, error } = await Api.update("applications",
      { id: app.id, updated_at: app.updated_at },
      { form_data: app.form_data, pathway: app.pathway });
    /* 自动保存失败也要分清楚：读不到结论时这一次可能其实已经存进去了，
       说死「保存失败」会让人以为刚才白填了。 */
    if (error) {
      /* 登录过期要单独认出来：它确定没写进去，但出路和别的失败不一样 ——
         不是改一改再存，是先去把登录办回来。 */
      if (error.code === "unauthenticated") {
        setSaveState("登录已过期，这一次没有保存");
        showExpired("这一次没有保存");
        return { ok: false, unclear: false, expired: true, message: error.message || "" };
      }
      const unclear = isUnknown(error);
      setSaveState(unclear ? "没能确认是否保存成功，请稍后再看"
                           : "保存失败：" + error.message);
      return { ok: false, unclear: unclear, message: error.message || "" };
    }
    /* Api.update 末尾有 .select()，所以命中的行会回来。0 行 = 条件没匹配上，
       也就是 updated_at 变了 —— 别人改过。这是**确定**的结果（没写进去），
       但不能顺手重试：重试会把过期内容盖上去。留着用户当前的编辑，
       只给「重新载入」这一条出路。 */
    /* 成功必须有**确凿的证据**：一条回来的记录，外加一个新的 updated_at。
       监督独立反例（eventf982）：Api.update 返回 {data:null,error:null} 时，
       原来的判据只拦 []，null 直接穿过去 —— 结果 ok:true、dirty:false、
       页面显示「已保存 02:17:02」，而根本没有任何记录证明写进去了。
       拿不到记录或拿不到新版本号，一律按**结果不明**处理：
       保留 dirty（下次编辑还会再存一次）、并让提交门禁拦住。 */
    if (!Array.isArray(rows)) {
      setSaveState("没能确认是否保存成功，请稍后再看");
      return { ok: false, unclear: true, message: "没有拿到写入结果" };
    }
    if (rows.length === 0) {
      setSaveState("这份申请在别处被改过，这一次没有保存");
      showConflict();
      return { ok: false, unclear: false, conflict: true,
               message: "这份申请在别处被改过（可能是你在另一个标签页改的，或教务刚处理过）" };
    }
    // 保存成功：把服务端新的 updated_at 接上，下一次保存才比得对。
    // 拿不到新版本号就没法继续做并发比对，同样算结果不明，不能宣布成功。
    const nextVersion = rows[0] && rows[0].updated_at;
    if (!nextVersion) {
      setSaveState("没能确认是否保存成功，请稍后再看");
      return { ok: false, unclear: true, message: "没有拿到新的版本号" };
    }
    /* 这一次已经被更晚发出的保存顶掉了：它的版本号是**旧**的，回写就会让版本倒退。
       既不改版本，也不清 dirty —— 由那一次更晚的保存去下结论。 */
    if (myGen !== saveSeq) {
      /* 串行化之后正常路径到不了这里；留着是因为丢掉版本的后果太重。
         **只向前接**：晚到的旧响应不会让版本倒退，但它确认过的版本也不能扔 ——
         扔了就等于往后每一次保存都拿过期版本去比对。 */
      const a = Date.parse(app.updated_at), b = Date.parse(nextVersion);
      if (!isNaN(a) && !isNaN(b) && b > a) app.updated_at = nextVersion;
      return { ok: true, unclear: false, stale: true, superseded: true };
    }
    app.updated_at = nextVersion;
    /* 只有页面上这一刻的内容还是发出去的那一版时，才能说「都保存好了」。
       在途期间又改过的话，**保持 dirty** —— 新的那一笔还没落地。 */
    const nowSnap = JSON.stringify({ form_data: app.form_data, pathway: app.pathway });
    const stale = nowSnap !== sentSnap;
    if (!stale) {
      dirty = false;
      /* 都落到服务端了，暂存就没有意义了 —— 留着它，下次刷新会跳出
         「你上次**没能保存成功**的编辑还留着」，而那一份其实早就存上了。
         离开守卫让这种陈旧暂存变得更容易出现，所以在这里收掉。 */
      clearStash();
      setSaveState("已保存 " + new Date().toLocaleTimeString("zh-CN", { hour12: false }));
    } else {
      setSaveState("刚才那一版已保存，你之后的修改还没保存");
    }
    return { ok: true, unclear: false, stale: stale };
  }

  /** 暂存失败时的出口：不重载、不隐藏，把他填的内容原样摊出来，
      并把光标放进去全选好，直接 Ctrl/Cmd+C 就能带走。
      不依赖剪贴板权限（navigator.clipboard 在很多环境下会被拒）。 */
  /** 把当前草稿摊成可复制的纯文本。**导出与比对共用这一份** ——
      否则「有没有变」和「他复制走的是什么」会对不上。
      pathway 不在 form_data 里（单独存在 app.pathway），所以显式带上：
      少了它，只改学习路径的那一次会被判成「没变」而直接放行。 */
  function draftExportText(){
    const lines = [];
    Object.keys(app.form_data || {}).forEach((k) => {
      const v = app.form_data[k];
      lines.push(k + ": " + (typeof v === "string" ? v : JSON.stringify(v)));
    });
    lines.push("pathway: " + (app.pathway == null ? "" : app.pathway));
    return lines.join("\n");
  }

  /* 确认的**基准**：他被要求复制的是哪一份。

     这个基准只能由**他自己的动作**推进，绝不能跟着自动重画走。
     监督实测（event0ff8）：上一版把基准放在每次渲染的闭包里 ——
     存储一直被拒时自动保存每 800ms 失败一次就重画一遍，
     新闭包顺手把基准推成了最新内容；他**没有重新复制**，
     等 1400ms 之后点「我已复制」就直接走了。文案拦不住这种绕过。

     所以：自动重画只更新**显示**（内容必须最新）并如实提示「请重新复制」，
     基准原地不动；只有他点确认那一下才把基准推到他眼前这一份，
     并且那一下**不放行** —— 要他再确认一次、期间没再改，才算数。

     「请重新复制」同样要粘住：一次性提示会被下一次重画抹掉。 */
  let stashRecopy = false, stashBaseline = null, stashAct = null, stashProceed = null;
  /** 复制框只要在屏幕上，它就是他要抄走的那一份 —— 不能停在旧内容上。
      登录过期那条路每次自动保存失败都会重新走一遍 showExpired，顺带刷新了；
      冲突那条路不会（showConflict 不碰这个框），于是框里一直是旧的，
      他完全可能照着抄走。这里让**每一次保存尝试结束**都刷新一遍：
      只更新显示与提示，基准照旧不动。 */
  function refreshStashExport(){
    if (document.getElementById("stashFailBox")) showStashFailed(stashAct, stashProceed, false);
  }
  function showStashFailed(actionLabel, onProceed, focus){
    const act = actionLabel || "重新载入";
    const proceed = onProceed || (() => location.reload());
    stashAct = act; stashProceed = proceed;      // 刷新时按同一条路的动作重画
    let box = document.getElementById("stashFailBox");
    const first = !box;
    if (first) {
      box = document.createElement("div");
      box.id = "stashFailBox";
      box.className = "msg err show";
      box.setAttribute("role", "alert");
      box.style.margin = "12px 0";
      const host = document.getElementById("appForm") || main;
      (host.parentNode || main).insertBefore(box, host);
      stashBaseline = null; stashRecopy = false;   // 新出现的框：从头开始
    }
    const cur = draftExportText();
    if (stashBaseline === null) stashBaseline = cur;   // 首次出现：他要复制的就是这一份
    else if (cur !== stashBaseline) stashRecopy = true; // 自动重画：只提示，不推进基准
    /* **每次都重画**，内容和动作都可能已经不是上一次那一套了。
       原来这里是「发现框已经在就 select() 然后 return」——
       监督实测（eventde1b）：存储一直被拒时他对着这个框继续改、再点一次
       「去重新登录」，人是留下了，可框里导出的还是上一版；
       他照着复制、点「我已复制」一走，后面改的那几笔谁也不知道去哪了。
       动作同理：从「冲突 → 重新载入」切到「过期 → 去重新登录」时，
       按钮的文字与回调都停在旧的那一套（点下去是重新载入，不是去登录）。
       textContent 一赋值就会把旧的 textarea 与旧按钮（连同旧回调）一起清掉。 */
    box.textContent = (stashRecopy ? "你刚才又改了内容，下面这一份**已经重新导出** —— " +
        "请重新复制之后再点一次。 " : "") +
      "这个浏览器现在存不下草稿（可能是隐私模式、存储被禁用或空间已满），" +
      "所以**没有**" + act + " —— 页面上这一份是唯一的副本。" +
      "请先把下面的内容复制保存，再决定要不要" + act + "。 ";
    const ta = document.createElement("textarea");
    ta.readOnly = true;
    ta.style.cssText = "width:100%;min-height:160px;margin-top:8px;font:12px/1.6 Consolas,monospace";
    ta.value = cur;
    box.appendChild(ta);
    const later = document.createElement("button");
    later.type = "button"; later.className = "link"; later.textContent = "我已复制，" + act;
    later.addEventListener("click", () => {
      /* 确认时**再比一次**：他很可能在复制之后、点这个按钮之前又改了一笔，
         而自动保存的 800ms 防抖还没到点 —— 就这么走了，那一笔既没存下、
         也不在他复制走的那一份里（监督实测 event0c63）。
         变了就留在这一页、把导出刷新成最新的，请他重新复制；没变才放行。 */
      const now = draftExportText();
      if (now !== stashBaseline) {
        /* 他确认的不是他被要求复制的那一份。**只有这一下**能推进基准 ——
           推到他眼前这一份，但这一次不放行：请他复制之后再确认一次。 */
        stashBaseline = now;
        stashRecopy = true;
        showStashFailed(act, proceed, true);
        return;
      }
      stashRecopy = false;
      proceed();
    });
    box.appendChild(document.createElement("br"));
    box.appendChild(later);
    /* 只有**他自己触发**的那一次才抢焦点。自动保存每 800ms 失败一次就选中一遍，
       会把正在打字的人从输入框里拽出来。 */
    if (first || focus) ta.select();
  }

  /** 冲突提示：**不自动重新载入** —— 那会把用户正在编辑的内容冲掉。
      把选择权交给他：要么先把内容抄走再载入，要么继续编辑别的字段。 */
  function showConflict(customText){
    let box = document.getElementById("conflictBox");
    if (!box) {
      box = document.createElement("div");
      box.id = "conflictBox";
      box.className = "msg err show";
      box.setAttribute("role", "alert");
      box.style.margin = "12px 0";
      const host = document.getElementById("appForm") || main;
      host.parentNode.insertBefore(box, host);
    }
    box.textContent = (customText || ("这份申请在别处被改过，这一次没有保存 —— " +
      "直接再存会把别处的改动覆盖掉。你现在填的内容还在页面上，" +
      "请先记下需要保留的部分，再重新载入取回最新版本。")) + " ";
    if (!box.querySelector("button")) {
      const keep = document.createElement("button");
      keep.type = "button"; keep.className = "link";
      keep.textContent = "保留我的编辑并重新载入";
      keep.addEventListener("click", () => {
        /* 存不下就**绝不重新载入** —— 页面上这一份是唯一的副本。
           留在原地，把内容摊出来让他自己带走。 */
        if (!stashDraft()) { showStashFailed(); return; }
        location.reload();
      });
      const plain = document.createElement("button");
      plain.type = "button"; plain.className = "link";
      plain.textContent = "直接重新载入（丢弃我的编辑）";
      plain.addEventListener("click", () => {
        leavingDiscard = true;                  // 他明确要丢，离开守卫别再塞回来
        clearStash(); location.reload();
      });
      box.appendChild(keep);
      box.appendChild(document.createTextNode(" · "));
      box.appendChild(plain);
    }
  }

  /** 登录过期（蓝图验收矩阵 P1-16：「session 过期后操作 → 明确提示并跳登录，
      非静默失败」）。这一次**确定**没写进去，而且他再点多少次都一样。

      三件事必须一起做，少一件他就白填了：
        1) **先把当前编辑暂存**。他一离开这一页去登录，屏幕上这份就是唯一的一份；
           暂存/恢复这套东西页面里早就有（stashDraft / offerRestore），
           只是登录过期这条路上一直没接。
        2) 说清楚是登录过期、这一次没有保存/提交 —— 不是「稍后重试」：
           登录没恢复之前，重试多少次都一样。
        3) 给一条真能走的出路：带 ?next= 回到本页的登录入口
           （A.withNext 自带同源校验，不自己拼）。
      **不自动跳转**：跳了他连提示都来不及看，正填着的东西也会被打断。 */
  function showExpired(what){
    const loginHref = A.withNext("login/");
    /** 走之前**再存一次**。错误回包那一刻存的那一份，到他点链接时可能已经旧了：
        提示出现之后他又改了一笔，而自动保存的 800ms 防抖还没到点 ——
        原生 <a> 一跳，最后那一笔就再也没有了。
        存不下就**留在这一页**：把内容摊出来让他自己带走，绝不盲跳。 */
    const leave = (e) => {
      if (e) e.preventDefault();
      if (stashDraft()) { location.href = loginHref; return; }
      showStashFailed("去重新登录", () => { location.href = loginHref; }, true);
    };
    const stashed = stashDraft();
    let box = document.getElementById("expiredBox");
    if (!box) {
      box = document.createElement("div");
      box.id = "expiredBox";
      box.className = "msg err show";
      box.setAttribute("role", "alert");
      box.style.margin = "12px 0";
      const host = document.getElementById("appForm") || main;
      (host.parentNode || main).insertBefore(box, host);
    }
    box.textContent = "你的登录已过期，" + what + "。" +
      (stashed ? "你填的内容已经暂存在这个标签页里，重新登录后回到这一页可以一键恢复。 "
               : "这个浏览器存不下暂存，请先自行复制一份再离开。 ");
    if (!box.querySelector("a")) {
      const a = document.createElement("a");
      a.className = "link";
      a.href = loginHref;                      // 保留真实地址：能看见要去哪、也能新标签页打开
      a.textContent = "去重新登录";
      a.addEventListener("click", leave);
      box.appendChild(a);
    }
    /* 存不下就把内容摊出来让他自己带走 —— 绝不让他带着「已暂存」的错觉离开。 */
    if (!stashed) showStashFailed("去重新登录", () => { location.href = loginHref; });
  }

  // ---------- 提交 / 撤回 ----------
  async function submit(force){
    const err = document.getElementById("subErr"); err.classList.remove("show");
    const btn = document.getElementById("btnSubmit");
    /* 先在前端说清楚缺什么、在第几步。不封死：给「仍然提交」这条路。 */
    if (!force) {
      const miss = missingRequired();
      if (miss.length) { renderMissing(err, miss, true); return; }
    }
    /* **先禁用，再去保存。** 原来 disabled 是在 `await save()` 之后才设的，
       而 save() 是一次网络往返 —— 那段时间里按钮还是活的，
       两次点击真的会发出两次 submit_application（实测 2 次）。 */
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = "提交中…";
    clearTimeout(saveTimer);
    const saved = await save();

    /* **当前这一版没确认存进去，就不提交。** 否则交上去的是服务端上那份旧表单，
       而用户以为交的是自己刚填完的那份。两种情况都不往下走，但出路不同：

         明确被拒（RLS/校验/权限等）—— 确定没存上。留着他填的内容，
           说清楚原因，把按钮放开让他改完再交。
         结果不明 —— 不知道存上没有。同样不能提交（提交的可能是旧版本），
           但也不能劝他一直点：给「刷新核实」，让他先看清楚当前是哪一版。 */
    /* save() 成功 ≠ 交得上去：它确认的可能是**旧那一版**（等它回来的功夫他又改了），
       或者已经被更晚的保存顶掉。这时候交上去的会是服务器上那份旧的。
       不自动重存、不自动重试 —— 留着他的编辑，说清楚，让他自己再交一次。 */
    if (saved && saved.ok && (saved.stale || saved.superseded || dirty)) {
      btn.disabled = false; btn.textContent = "提交申请";
      err.textContent = "你在保存过程中又改了内容，这一次没有提交 —— " +
        "交上去的会是保存前那一版。等这一次保存完成之后再提交。";
      err.classList.add("show");
      return;
    }
    if (saved && !saved.ok) {
      /* 登录过期：showExpired 已经暂存并给出了登录入口，这里只说清这一次没交。
         按钮放开 —— 他登录回来还在这一页，还得靠它再交一次。 */
      if (saved.expired) {
        btn.disabled = false; btn.textContent = "提交申请";
        err.textContent = "你的登录已过期，这一次没有提交。请先按上面的提示重新登录，再回来提交。";
        err.classList.add("show");
        return;
      }
      if (saved.unclear) {
        sayUnknown(err, "没能确认你刚才的修改有没有保存成功，所以这次没有提交 —— " +
          "提交的可能是服务器上那份旧的。请先刷新核实当前内容再提交。");
        return;                                  // 刻意不解锁：先核实
      }
      btn.disabled = false; btn.textContent = "提交申请";
      err.textContent = "你刚才的修改没有保存成功（" + (saved.message || "原因未知") +
        "），所以这次没有提交 —— 不然交上去的会是服务器上那份旧的。" +
        "你填的内容还在页面上，请稍后重试或修正后再提交。";
      err.classList.add("show");
      return;
    }

    const { data, error } = await Api.rpc("submit_application", { p_app: app.id });
    const UNKNOWN_SUBMIT = "没有拿到这次提交的结果，无法确认申请是否已经提交。" +
      "请不要重复提交 —— 重复提交会再走一次审核流程。请先刷新核实当前状态。";
    if (error) {
      // 结果不明：刻意**不**解锁按钮，提交是状态变更且会写审核历史
      if (isUnknown(error)) { sayUnknown(err, UNKNOWN_SUBMIT); return; }
      /* 保存过得去、偏偏提交这一下过期：一样要暂存 + 给出路，
         而不是甩一句「登录状态已失效」就完了。 */
      if (error.code === "unauthenticated") {
        btn.disabled = false; btn.textContent = "提交申请";
        showExpired("这一次没有提交");
        err.textContent = "你的登录已过期，这一次没有提交。请先按上面的提示重新登录，再回来提交。";
        err.classList.add("show");
        return;
      }
      btn.disabled = false; btn.textContent = "提交申请";
      err.textContent = error.message + "（这次没有提交。）"; err.classList.add("show");
      return;
    }
    /* 200 但没有可读结论。原来这里直接 `!data.ok`，data 是 null 就抛
       TypeError —— 页面一句话都没有，而按钮那时已经被放开，人只会再点一次。 */
    if (!data) { sayUnknown(err, UNKNOWN_SUBMIT); return; }
    btn.disabled = false; btn.textContent = "提交申请";
    if (!data.ok) {
      if (data.error === "validation_failed") {
        /* 服务端可能判出前端没料到的缺项（条件必填、格式、一致性）。
           同样按步骤分组说清楚，并给「去补填」—— 不要只甩一串字段名。 */
        const names = {}; F.STEPS.forEach(s => s.fields.forEach(f => names[f.name] = f.label));
        names.pathway = "学习路径";
        renderMissing(err, (data.missing || []).map(m => ({
          label: names[m] || m, step: stepOfField(m),
          stepTitle: (F.STEPS[stepOfField(m)] || {}).title, name: m,
        })), false);
        return;
      } else if (data.error === "requirements_pending") {
        renderPendingReqs(err, data.count);
        return;
      } else err.textContent = "提交未成功，请检查后重试。";
      err.classList.add("show");
      return;
    }
    UI.toast("申请已提交");
    /* 提交**已经成功**了，接下来只是重读最新状态。这一读若失败，原来
       `app = rows && rows[0]` 会把 app 置空，紧接着 render() 取 app.status 就抛
       TypeError —— 页面停在「草稿 · 尚未提交」上，等于告诉他没交成。
       不能就地崩，也不能让那句「尚未提交」留在屏幕上。 */
    const { data: rows, error: reErr } = await Api.rpc("my_application");
    dirty = false;
    if (reErr || !Array.isArray(rows) || !rows[0]) {
      btn.disabled = true; btn.textContent = "已提交";   // 已经交过了，别让他再点
      sayUnknown(err, "你的申请已经提交成功。但这一次没能读到最新状态，" +
        "页面上显示的可能还是提交前的样子 —— 请刷新核实，不要重复提交。");
      return;
    }
    app = rows[0]; await loadRequirements(); await loadHq(); render();
  }

  /* 撤回是**不可逆**的，可它原来一道闸都没有：确认框关掉之后、
     withdraw_application 回来之前，#btnWithdraw 还在、还能点 —— 再点一次就是第二笔。
     按契约第二笔会被 0008 的
     `status in ('accepted','rejected','withdrawn') → invalid_state` 挡掉，
     于是他刚撤回成功，页面转脸弹一句服务端原文的错（本轮实测 Wd3/Wd4：
     withdraw_application 发出了 2 次）。
     createDraft() 早就有闸了（creating 互斥 + insert 之前就 disable 入口），
     偏偏更该有闸的这一个没有。

     闸从**点开确认框那一刻**就落下，不然确认框开着的时候还能再点出一个来。
     取消就放开；确认之后到结果回来之前，入口禁用。 */
  let withdrawing = false;
  async function withdraw(){
    if (withdrawing) return;                 // 确认框开着 / 请求在途：吞掉重复点击
    withdrawing = true;
    let agreed = false;
    try {
      agreed = await UI.confirmDialog({ title: "撤回申请", text: "撤回后该申请将结束，如需再次申请须重新填写。", confirmLabel: "确认撤回", danger: true });
    } finally {
      if (!agreed) withdrawing = false;      // 取消（或对话框自己出错）就放开
    }
    if (!agreed) return;
    const wdBtn = document.getElementById("btnWithdraw");
    if (wdBtn) wdBtn.disabled = true;
    const { data: wd, error } = await Api.rpc("withdraw_application", { p_app: app.id, p_reason: null });
    if (error) {
      /* 结果不明时**不放开** —— 这一笔可能已经生效了，再发一次正是这里最不该做的事。
         能确定没生效（服务端给了明确错误码）才让他重来。 */
      if (isUnknown(error)) {
        return UI.toast("没能确认这次撤回有没有生效。请刷新页面核实当前状态，不要重复撤回。", "err");
      }
      withdrawing = false;
      if (wdBtn) wdBtn.disabled = false;
      return UI.toast(error.message, "err");
    }
    /* 撤回不可逆。服务端成功时返回 {'ok': true}（0008_applications.sql:283）——
       原来只看 error，{data:null, error:null} 这种「没有可读结论」也被当成成功，
       当场弹「申请已撤回」。结果不明就要说不明，不能替服务端断言。 */
    if (!wd || wd.ok !== true) {
      /* 同上：结果不明 —— 闸**不放开**，入口保持禁用，文案也已经说了「不要重复撤回」。 */
      return UI.toast("没能确认这次撤回有没有生效。请刷新页面核实当前状态，不要重复撤回。", "err");
    }
    UI.toast("申请已撤回");
    const { data: rows, error: reErr } = await Api.rpc("my_application");
    /* 撤回**已经生效**。这一读若失败，原来会落到 renderStart()
       「还没有正式申请 / 开始填写正式申请」—— 那是在替服务端断言，
       而且正把他推向再建一份。 */
    if (reErr || !Array.isArray(rows)) {
      main.innerHTML = UI.box("🗂️", "申请已撤回，但最新状态这一次没读到",
        "撤回已经生效。这一次没能读到你当前的申请状态，所以这里暂时不显示。" +
        "请刷新页面核实之后，再决定要不要重新申请。") +
        '<button class="btn" type="button" id="btnWdReload" style="width:auto;padding:0 22px;margin-top:12px">刷新页面</button>';
      document.getElementById("btnWdReload")?.addEventListener("click", () => location.reload());
      return;
    }
    app = rows[0] || null;
    app ? render() : renderStart();
  }

  // ---------- 时间线 ----------
  async function loadTimeline(){
    const { data, error } = await Api.rpc("my_application_timeline", { p_app: app.id });
    const box = document.getElementById("tl");
    if (!box) return;
    if (error) return UI.render(box, UI.box("⚠️", "时间线载入失败", error.message));
    box.innerHTML = UI.timeline((data || []).map(h => ({
      title: (ST[h.to_status] || {}).t || h.to_status,
      time: new Date(h.created_at).toLocaleString("zh-CN", { hour12: false }),
      text: h.applicant_visible_message || "",
    })));
  }
})();
</script>
