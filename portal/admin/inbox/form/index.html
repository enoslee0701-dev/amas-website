<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>入学申请表 | AMAS</title>
<link rel="icon" href="../../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../../assets/css/portal.css?v=202610271250">
<style>
.af-acts{position:sticky;bottom:0;background:var(--wash,#f7f5ef);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<script src="../../../../assets/vendor/supabase-js@2.116.0/supabase.min.js"></script>
<script src="../../../../assets/js/supabase-config.js?v=202610271250"></script>
<script src="../../../../assets/js/portal/auth.js?v=202610271250"></script>
<script src="../../../../assets/js/portal/api.js?v=202610271250"></script>
<script src="../../../../assets/js/portal/ui.js?v=202610271250"></script>
<script src="../../../../assets/js/portal/shell.js?v=202610271250"></script>
<script src="../../../../assets/js/portal/sis.js?v=202610271250"></script>
<script src="../../../../assets/js/portal/school-form.js?v=202610271250"></script>
<script>
/* 总校《神学校入学申请表》（Enos 2026-10-26 提供的 Word 表格）的网页版。
   第一次打开时按官网报名资料预填；教务补填后「保存」写进 submissions.school_form（0038），
   之后以保存的内容为准。「打印」按 A4 排版，可直接打印或存成 PDF 递交总校。 */
(async function(){
  const UI = window.AmasUI, Api = window.AmasApi, Shell = window.AmasShell, A = window.AmasAuth;
  const mounted = await Shell.mount({ space: "admin", title: "管理后台",
                                      allow: ["registrar", "academic_admin", "super_admin"], requireAal2: true });
  if (!mounted) return;
  const { main } = mounted;
  const id = new URLSearchParams(location.search).get("id");
  const back = A.ROOT + "portal/admin/inbox/";

  const F = window.AmasSchoolForm;   /* 栏位、预填规则与整张表的画法在 assets/js/portal/school-form.js，与全班打印页共用 */

  if (!id) return UI.error(main, { message: "没有指定报名记录。请从报名收件箱进入。" });
  UI.loading(main, 4);
  const { data: r, error } = await Api.select("submissions", { columns: "id,name,type,cohort,school_form,data", eq: { id }, single: true });
  if (error) return UI.error(main, { message: "这一次没能读到这份报名，请稍后刷新。", onRetry: () => location.reload() });
  if (!r) return UI.error(main, { message: "找不到这份报名，可能已被删除。" });

  const saved = F.saved(r);
  const V = F.values(r);

  main.innerHTML =
    '<p class="no-print"><a class="link" href="' + back + '">← 返回报名收件箱</a></p>' +
    '<div class="msg info show no-print">' + (saved ? "这是已保存的申请表。" : "已按官网报名资料预填，空白处请补填后点「保存」。") +
      ' 点格子即可修改；打印时可选「另存为 PDF」递交总校。</div>' +
    '<div class="msg err" id="err" role="alert" tabindex="-1"></div>' +
    F.html(V, { editable: true }) +
    '<div class="af-acts no-print"><button class="btn" id="save" style="width:auto;padding:0 22px">保存</button>' +
      '<button class="btn ghost" id="print" style="width:auto;padding:0 22px">打印 / 存 PDF</button><span class="who" id="st"></span></div>';

  const errBox = main.querySelector("#err"), st = main.querySelector("#st");
  let dirty = false, busy = false;
  main.querySelectorAll(".v").forEach(x => x.addEventListener("input", () => { dirty = true; st.textContent = "有未保存的修改"; }));
  main.querySelectorAll(".ck").forEach(b => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    main.querySelectorAll('[data-ck="' + b.dataset.ck + '"]').forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", String(on));
    dirty = true; st.textContent = "有未保存的修改";
  }));
  window.addEventListener("beforeunload", (ev) => { if (dirty) { ev.preventDefault(); ev.returnValue = ""; } });

  function collect(){
    const f = {};
    main.querySelectorAll(".v").forEach(x => { const t = x.innerText.replace(/\n+$/, ""); if (t.trim()) f[x.dataset.k] = t; });
    main.querySelectorAll('.ck[aria-pressed="true"]').forEach(b => { f[b.dataset.ck] = b.dataset.v; });
    return f;
  }

  main.querySelector("#save").addEventListener("click", async () => {
    if (busy) return;
    errBox.classList.remove("show");
    busy = true; st.textContent = "正在保存…";
    try {
      const { data, error: e2 } = await Api.update("submissions", { id: r.id }, { school_form: collect() });
      if (e2 || !Array.isArray(data) || !data.length) {
        st.textContent = "";
        errBox.textContent = "这一次没有保存成功，修改还在页面上，请再点一次「保存」。"; errBox.classList.add("show"); errBox.focus();
        return;
      }
      dirty = false; st.textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
      UI.toast("申请表已保存");
    } finally { busy = false; }
  });
  main.querySelector("#print").addEventListener("click", () => window.print());
})();
</script>
</body>
</html>
