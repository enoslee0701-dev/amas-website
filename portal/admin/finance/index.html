<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>费用管理 | AMAS</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202610282255">
<style>
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi div{background:#fff;border:1px solid #e6e2d8;border-radius:14px;padding:14px 16px;box-shadow:0 6px 18px rgba(16,40,72,.05)}
.kpi b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}.kpi span{font-size:12.5px;color:var(--muted)}
.kpi .owe b{color:#a23a32}
.tw{overflow-x:auto;border:1px solid #e6e2d8;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(16,40,72,.06)}
table.ft{width:100%;border-collapse:collapse;font-size:13.5px}
.ft th,.ft td{padding:9px 10px;border-bottom:1px solid #ece8de;text-align:left;white-space:nowrap}
.ft th{background:#f6f4ee;color:#4b5567;font-weight:600}
.ft td.n{text-align:right;font-variant-numeric:tabular-nums}
.ft tr.void td{color:#a3a09a;text-decoration:line-through}
.ft td.owe{color:#a23a32;font-weight:700}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.frm label{display:grid;gap:4px;font-size:13px;color:#4b5567}
.frm input,.frm select{min-height:42px;padding:8px 10px;border:1px solid #cfd5df;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
.kind-charge{color:#7a5a12}.kind-payment{color:var(--ok)}.kind-waiver{color:#1d3b66}.kind-refund{color:#a23a32}
</style>
</head>
<body>
<script src="../../../assets/vendor/supabase-js@2.116.0/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202610282255"></script>
<script src="../../../assets/js/portal/auth.js?v=202610282255"></script>
<script src="../../../assets/js/portal/api.js?v=202610282255"></script>
<script src="../../../assets/js/portal/ui.js?v=202610282255"></script>
<script src="../../../assets/js/portal/shell.js?v=202610282255"></script>
<script src="../../../assets/js/portal/sis.js?v=202610282255"></script>
<script>
/* 费用管理（0042）：一笔一行的流水账。应收 / 已收 / 减免 / 退款，按币种算每人欠款。
   账目只增不删、不改金额：记错了点「作废」并写原因。可给整个班一次加一笔应收（例如学费）。
   学员名单 = 报名收件箱里的入学申请（已分班的按班列出）。 */
(async function(){
  const A = window.AmasAuth, UI = window.AmasUI, Api = window.AmasApi, Shell = window.AmasShell, I = Shell.icon;
  const mounted = await Shell.mount({ space: "admin", title: "管理后台", allow: ["finance", "registrar", "academic_admin", "super_admin"], requireAal2: true });
  if (!mounted) return;
  const { main } = mounted;
  const KIND = { charge: "应收", payment: "已收", waiver: "减免", refund: "退款" };
  const METHOD = { "": "—", cash: "现金", bank: "银行转账", promptpay: "PromptPay", wechat: "微信", alipay: "支付宝", other: "其他" };
  const CUR = ["THB", "CNY", "USD"];
  const CATS = ["学费", "报名费", "教材费", "住宿费", "其他"];
  let people = [], entries = [], fCohort = "", fPerson = "", busy = false;
  let grandTotals = {}, nextPage = null, pageSnapshot = null, pending = null;
  let notice = "", noticeOk = false;
  const pendingKey = "amas.finance.pending:" + mounted.ctx.session.user.id;
  try { pending = JSON.parse(sessionStorage.getItem(pendingKey) || "null"); } catch (e) {
    return UI.error(main, { message: "无法读取本标签页保留的记账结果，请先检查浏览器存储设置。" });
  }
  const validPending = (p) => p && /^[0-9a-f-]{36}$/i.test(p.request) &&
    ((p.op === "record" && Array.isArray(p.entries) && p.entries.length > 0) ||
     (p.op === "void" && typeof p.entry === "string" && typeof p.reason === "string"));
  if (pending && !validPending(pending)) return UI.error(main, { message: "上一次记账的核对资料不完整，请联系管理员核对流水后再操作。" });
  // getRandomValues is supported by the existing browser floor. No Math.random fallback.
  const requestId = () => {
    const b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const s = Array.from(b, (v) => v.toString(16).padStart(2, "0")).join("");
    return s.slice(0,8)+"-"+s.slice(8,12)+"-"+s.slice(12,16)+"-"+s.slice(16,20)+"-"+s.slice(20);
  };
  async function rpc(name, args) {
    let timer;
    try { return await Promise.race([Api.rpc(name, args), new Promise((resolve) => {
      timer = setTimeout(() => resolve({ data: null, error: { code: "network" } }), 20000);
    })]); } catch (e) { return { data: null, error: { code: "network" } }; }
    finally { clearTimeout(timer); }
  }
  const validTotals = (t) => t && typeof t === "object" && !Array.isArray(t) && Object.entries(t).every(([currency,x]) =>
    CUR.includes(currency) && x && ["charge","payment","waiver","refund"].every(k =>
      (typeof x[k] === "number" || typeof x[k] === "string") && x[k] !== "" && Number.isFinite(Number(x[k])) && Number(x[k]) >= 0));
  async function getPeople() {
    const rows = []; let after = 0;
    for (;;) {
      const r = await rpc("finance_people_page", { p_after: after, p_limit: 200 });
      if (r.error || !r.data || !Array.isArray(r.data.rows)) throw new Error("people");
      if (r.data.rows.some((p) => !Number.isSafeInteger(p.id) || p.id <= after || !validTotals(p.balances))) throw new Error("people shape");
      rows.push(...r.data.rows);
      const next = r.data.next_after;
      if (next === null) break;
      if (!Number.isSafeInteger(next) || next <= after || !r.data.rows.length || next !== r.data.rows[r.data.rows.length-1].id) throw new Error("people cursor");
      after = next;
    }
    if (new Set(rows.map((p) => p.id)).size !== rows.length) throw new Error("duplicate people");
    return rows;
  }
  async function getPage(cursor, snapshot, cohort, person) {
    const r = await rpc("finance_entries_page", {
      p_before_created: cursor ? cursor.created_at : null, p_before_id: cursor ? cursor.id : null,
      p_snapshot: snapshot || null, p_cohort: cohort || null, p_submission: person ? Number(person) : null, p_limit: 100,
    });
    if (r.error || !r.data || !Array.isArray(r.data.rows) || typeof r.data.snapshot !== "string" ||
        (r.data.next !== null && (!r.data.next || typeof r.data.next.id !== "string" || typeof r.data.next.created_at !== "string"))) throw new Error("entries");
    return r.data;
  }
  async function loadScope(cohort, person, refreshPeople) {
    const [rp, rt, re] = await Promise.all([
      refreshPeople ? getPeople() : Promise.resolve(people),
      rpc("finance_totals", { p_cohort: cohort || null }), getPage(null, null, cohort, person),
    ]);
    if (rt.error || !validTotals(rt.data)) throw new Error("totals");
    people = rp; grandTotals = rt.data; entries = re.rows; nextPage = re.next; pageSnapshot = re.snapshot;
    fCohort = cohort; fPerson = person;
  }
  UI.loading(main, 4);
  try { await loadScope("", "", true); }
  catch (e) { return UI.error(main, { message: "这一次没能完整读到费用记录。这不表示没有记录，请稍后刷新；若刚完成系统升级，请联系管理员检查费用服务。", onRetry: () => location.reload() }); }
  const cohorts = () => [...new Set(people.map((p) => p.cohort).filter(Boolean))];
  const pname = (id) => (people.find((p) => p.id === id) || {}).name || "（报名 #" + id + "）";
  const money = (n, c) => (c === "THB" ? "฿" : c === "CNY" ? "¥" : "$") + Number(n).toLocaleString("zh-CN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const sign = (e) => (e.kind === "charge" || e.kind === "refund" ? 1 : -1) * Number(e.amount);
  const owe = (c) => c.charge - c.payment - c.waiver + c.refund;

  function render(){
    const draft = {};
    for (const id of ["who","kind","cat","amt","cur","day","met","ref","note"]) { const el = main.querySelector("#" + id); if (el) draft[id] = el.value; }
    const inScope = (pid) => !fCohort || (people.find((p) => p.id === pid) || {}).cohort === fCohort;
    const T = grandTotals;
    const curs = Object.keys(T).length ? Object.keys(T) : ["THB"];
    const ppl = people.filter((p) => !fCohort || p.cohort === fCohort);
    const rows = ppl.map((p) => ({ p, t: p.balances }));
    const list = entries.filter((e) => inScope(e.submission_id) && (!fPerson || String(e.submission_id) === fPerson));

    main.innerHTML =
      '<h1>费用管理</h1><p class="lead">一笔一行的流水账：应收、已收、减免、退款。记错了点「作废」并写原因，原记录保留可查。</p>' +
      '<div class="msg' + (notice ? ' show ' + (noticeOk ? 'ok' : 'err') : '') + '" id="err" role="alert" tabindex="-1">' + UI.esc(notice) + '</div>' +
      (pending ? '<p class="msg show" role="status">有一笔操作需要核对，请先核实再新增记账。 <button class="sbtn" id="reconcile" type="button">核实上次操作</button></p>' : '') +
      '<div class="bar" style="margin-bottom:14px"><label for="fc" style="font-size:13px">班级</label><select id="fc" class="sbtn"><option value="">全部</option>' +
        cohorts().map((c) => '<option' + (c === fCohort ? " selected" : "") + '>' + UI.esc(c) + '</option>').join("") + '</select>' +
        '<button class="sbtn" type="button" id="csv">' + I("file", 16) + '导出表格（CSV）</button></div>' +
      curs.map((c) => { const x = T[c] || { charge: 0, payment: 0, waiver: 0, refund: 0 };
        return '<div class="kpi"><div><b>' + money(x.charge, c) + '</b><span>应收合计（' + c + '）</span></div><div><b>' + money(x.payment, c) + '</b><span>已收</span></div>' +
          '<div><b>' + money(x.waiver, c) + '</b><span>减免</span></div><div class="owe"><b>' + money(owe(x), c) + '</b><span>未收（欠款）</span></div></div>'; }).join("") +

      '<h2 style="font-size:17px;color:var(--navy);margin:6px 0 10px">记一笔</h2>' +
      '<div class="of"><div class="frm">' +
        '<label>对象<select id="who"><option value="">请选择学员…</option>' + cohorts().map((c) => '<option value="cohort:' + UI.esc(c) + '">【整个' + UI.esc(c) + '】每人一笔</option>').join("") +
          people.map((p) => '<option value="' + p.id + '">' + UI.esc(p.name || "未填姓名") + (p.cohort ? "（" + UI.esc(p.cohort) + "）" : "") + '</option>').join("") + '</select></label>' +
        '<label>类型<select id="kind">' + Object.entries(KIND).map(([k, t]) => '<option value="' + k + '">' + t + '</option>').join("") + '</select></label>' +
        '<label>项目<input id="cat" list="cats" value="学费" maxlength="30"><datalist id="cats">' + CATS.map((c) => '<option value="' + c + '">').join("") + '</datalist></label>' +
        '<label>金额<input id="amt" type="number" min="0.01" step="0.01" inputmode="decimal"></label>' +
        '<label>币种<select id="cur">' + CUR.map((c) => '<option>' + c + '</option>').join("") + '</select></label>' +
        '<label>日期<input id="day" type="date" value="' + new Date().toISOString().slice(0, 10) + '"></label>' +
        '<label>方式<select id="met">' + Object.entries(METHOD).map(([k, t]) => '<option value="' + k + '">' + t + '</option>').join("") + '</select></label>' +
        '<label>收据号 / 转账单号<input id="ref" maxlength="80"></label>' +
        '<label>备注<input id="note" maxlength="500"></label>' +
      '</div><div class="bar" style="margin-top:12px"><button class="sbtn pri" type="button" id="add">' + I("save", 16) + '记账</button></div></div>' +

      '<h2 style="font-size:17px;color:var(--navy);margin:20px 0 10px">每位学员</h2>' +
      (rows.length ? '<div class="tw"><table class="ft"><thead><tr><th>学员</th><th>班级</th>' + curs.map((c) => '<th class="n">应收 ' + c + '</th><th class="n">已收</th><th class="n">欠款</th>').join("") + '<th></th></tr></thead><tbody>' +
        rows.map(({ p, t }) => '<tr><td>' + UI.esc(p.name || "未填姓名") + '</td><td>' + UI.esc(p.cohort || "—") + '</td>' +
          curs.map((c) => { const x = t[c]; if (!x) return '<td class="n">—</td><td class="n">—</td><td class="n">—</td>';
            const o = owe(x); return '<td class="n">' + money(x.charge, c) + '</td><td class="n">' + money(x.payment, c) + '</td><td class="n' + (o > 0 ? " owe" : "") + '">' + money(o, c) + '</td>'; }).join("") +
          '<td><button class="sbtn" type="button" data-only="' + p.id + '">明细</button></td></tr>').join("") + '</tbody></table></div>'
        : UI.box("👥", "还没有学员", "报名收件箱里有入学申请后会出现在这里。")) +

      '<h2 style="font-size:17px;color:var(--navy);margin:20px 0 10px">流水明细' + (fPerson ? " · " + UI.esc(pname(Number(fPerson))) + ' <button class="link" type="button" id="allp">看全部</button>' : "") + '</h2>' +
      (list.length ? '<div class="tw"><table class="ft"><thead><tr><th>日期</th><th>学员</th><th>类型</th><th>项目</th><th class="n">金额</th><th>方式</th><th>单号</th><th>备注</th><th></th></tr></thead><tbody>' +
        list.map((e) => '<tr' + (e.voided_at ? ' class="void" title="已作废：' + UI.esc(e.void_reason || "") + '"' : "") + '><td>' + UI.esc(e.occurred_on) + '</td><td>' + UI.esc(pname(e.submission_id)) + '</td>' +
          '<td class="kind-' + e.kind + '">' + KIND[e.kind] + '</td><td>' + UI.esc(e.category) + '</td><td class="n">' + money(e.amount, e.currency) + '</td>' +
          '<td>' + (METHOD[e.method] || "—") + '</td><td>' + UI.esc(e.reference || "") + '</td><td>' + UI.esc(e.voided_at ? "已作废：" + (e.void_reason || "") : e.note || "") + '</td>' +
          '<td>' + (e.voided_at ? "" : '<button class="sbtn" type="button" data-void="' + e.id + '">作废</button>') + '</td></tr>').join("") + '</tbody></table></div>'
        : UI.box("🧾", "还没有记账", "在上面「记一笔」开始。")) +
      (nextPage ? '<button class="sbtn" id="more" type="button">加载更多明细</button>' : "");

    for (const id of Object.keys(draft)) { const el = main.querySelector("#" + id); if (el) el.value = draft[id]; }
    main.querySelector("#fc").addEventListener("change", (ev) => changeScope(ev.target.value, ""));
    main.querySelector("#add").addEventListener("click", add);
    main.querySelector("#csv").addEventListener("click", csv);
    main.querySelector("#allp")?.addEventListener("click", () => changeScope(fCohort, ""));
    main.querySelector("#more")?.addEventListener("click", more);
    main.querySelector("#reconcile")?.addEventListener("click", reconcile);
    main.querySelectorAll("[data-only]").forEach((b) => b.addEventListener("click", () => changeScope(fCohort, b.dataset.only)));
    main.querySelectorAll("[data-void]").forEach((b) => b.addEventListener("click", () => voidIt(entries.find((e) => e.id === b.dataset.void))));
    main.querySelectorAll("button,select#fc").forEach((b) => { if (busy || (pending && (b.id === "add" || b.hasAttribute("data-void")))) b.disabled = true; });
  }

  function say(message, ok) { notice = message; noticeOk = !!ok; render(); if (!ok) main.querySelector("#err").focus(); }
  const v = (id) => main.querySelector("#" + id).value.trim();
  async function changeScope(cohort, person) {
    if (busy) return; busy = true; render();
    try { await loadScope(cohort, person, false); notice = ""; }
    catch (e) { notice = "这一次没能读到新的筛选结果，仍显示上一次完整读取的内容。"; noticeOk = false; }
    finally { busy = false; render(); }
  }
  async function more() {
    if (busy || !nextPage) return; busy = true; render();
    try {
      const old = nextPage, page = await getPage(old, pageSnapshot, fCohort, fPerson);
      const ids = new Set(entries.map((e) => e.id));
      if (page.rows.some((e) => ids.has(e.id)) || (page.next && page.next.id === old.id)) throw new Error("cursor");
      entries.push(...page.rows); nextPage = page.next;
    } catch (e) { notice = "这一次没能完整读到下一页，已读取的明细仍保留，请重试加载。"; noticeOk = false; }
    finally { busy = false; render(); }
  }
  function savePending(p) {
    try { sessionStorage.setItem(pendingKey, JSON.stringify(p)); pending = p; return true; }
    catch (e) { say("无法保留本次核对资料，本次没有发出记账请求。请开启本标签页存储后再试。"); return false; }
  }
  function clearPending() { sessionStorage.removeItem(pendingKey); pending = null; }
  async function reconcile() {
    if (!pending || busy) return;
    busy = true; render(); const operation = pending; let committed = false;
    try {
      const r = operation.op === "record"
        ? await rpc("finance_record", { p_request: operation.request, p_entries: operation.entries })
        : await rpc("finance_void", { p_request: operation.request, p_entry: operation.entry, p_reason: operation.reason });
      if (r.error || !r.data || typeof r.data.ok !== "boolean" || r.data.error === "request_conflict" || (r.data.ok && r.data.count !== (operation.op === "record" ? operation.entries.length : 1))) {
        notice = "暂时无法确认本次操作的结果。核对资料已保留，请点「核实上次操作」继续核对，避免另记一笔。"; noticeOk = false; return;
      }
      if (!r.data.ok) {
        const messages = { validation_failed: "本次没有记账，请检查学员、金额、日期及其他栏位。", reason_required: "请填写作废原因。", already_voided: "这笔账已经作废，请刷新核对。", not_found: "没有找到这笔账，请刷新核对。" };
        if (!messages[r.data.error]) { notice = "暂时无法确认操作结果，核对资料已保留。"; noticeOk = false; return; }
        clearPending(); notice = messages[r.data.error]; noticeOk = false; return;
      }
      committed = true; clearPending();
      if (operation.op === "record") for (const id of ["amt","ref","note"]) { const el = main.querySelector("#" + id); if (el) el.value = ""; }
      notice = operation.op === "record" ? "已记账 " + r.data.count + " 笔。" : "已作废。"; noticeOk = true;
      await loadScope(fCohort, fPerson, true);
    } catch (e) {
      notice = committed ? "操作已完成，但这一次没能重新读到列表，请刷新查看。" : "暂时无法确认操作结果，核对资料已保留，请先核实。";
      noticeOk = committed;
    } finally { busy = false; render(); }
  }
  async function add() {
    if (busy || pending) return;
    const who = v("who"), amount = Number(v("amt"));
    if (!who) return say("请选择学员（或整个班）。");
    if (!(amount > 0) || amount >= 10000000 || Math.abs(amount * 100 - Math.round(amount * 100)) > 0.000001) return say("请填写大于 0 的金额，最多两位小数且小于 10,000,000。");
    if (!v("day")) return say("请填写日期。");
    const targets = who.startsWith("cohort:") ? people.filter((p) => p.cohort === who.slice(7)).map((p) => p.id) : [Number(who)];
    if (!targets.length || targets.length > 500) return say("每次可为 1 至 500 位学员记账，请分批选择。");
    // Lock before confirmation so rapid repeated clicks cannot open two writes.
    const entry = { kind: v("kind"), category: v("cat") || "其他", amount, currency: v("cur"), occurred_on: v("day"), method: v("met"), reference: v("ref"), note: v("note") };
    busy = true;
    try {
      if (targets.length > 1 && !(await UI.confirmDialog({ title: "给整个班记账", text: "给「" + who.slice(7) + "」" + targets.length + " 位学员每人记一笔" + KIND[entry.kind] + " " + money(amount, entry.currency) + "，确定吗？", confirmLabel: "确定" }))) return;
      if (!savePending({ op: "record", request: requestId(), entries: targets.map((id) => Object.assign({ submission_id: id }, entry)) })) return;
    } finally { busy = false; render(); }
    return reconcile();
  }
  async function voidIt(e) {
    if (!e || busy || pending) return; busy = true;
    try {
      const r = await window.AmasSis.ask({ title: "作废这笔账", text: pname(e.submission_id) + " · " + KIND[e.kind] + " " + money(e.amount, e.currency) + "（" + e.occurred_on + "）。作废后不计入余额，记录保留可查。",
        fields: [{ id: "reason", label: "作废原因（例如：重复录入、金额写错）", type: "textarea", required: true }], confirmLabel: "作废", danger: true });
      if (!r || !savePending({ op: "void", request: requestId(), entry: e.id, reason: r.reason })) return;
    } finally { busy = false; render(); }
    return reconcile();
  }
  async function csv() {
    if (busy) return; busy = true; render();
    try {
      const all = []; let cursor = null, snapshot = null; const ids = new Set();
      do {
        const page = await getPage(cursor, snapshot, fCohort, fPerson); snapshot = page.snapshot;
        for (const e of page.rows) { if (ids.has(e.id)) throw new Error("duplicate"); ids.add(e.id); all.push(e); }
        if (page.next && cursor && page.next.id === cursor.id) throw new Error("cursor");
        cursor = page.next;
      } while (cursor);
      // Quote escaping alone does not prevent spreadsheet formula evaluation.
      const q = (x) => { const text = String(x == null ? "" : x); return '"' + ((typeof x === "string" && /^[=+@\-\t\r]/.test(text)) ? "'" : "") + text.replace(/"/g, '""') + '"'; };
      const head = ["日期","学员","班级","类型","项目","金额","币种","方式","单号","备注","状态"];
      const lines = all.map((e) => [e.occurred_on,pname(e.submission_id),(people.find((p) => p.id === e.submission_id) || {}).cohort || "",KIND[e.kind],e.category,sign(e),e.currency,METHOD[e.method] || "",e.reference,e.note,e.voided_at ? "已作废：" + (e.void_reason || "") : ""].map(q).join(","));
      const url = URL.createObjectURL(new Blob(["\ufeff" + [head.map(q).join(",")].concat(lines).join("\r\n")], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = "AMAS费用明细-" + new Date().toISOString().slice(0,10) + ".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      notice = "已导出 " + all.length + " 笔明细。"; noticeOk = true;
    } catch (e) { notice = "导出未完成，没有下载不完整的文件，请稍后重试。"; noticeOk = false; }
    finally { busy = false; render(); }
  }

  render();
})();
</script>
