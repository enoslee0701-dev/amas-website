<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>学籍管理 | AMAS</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202609140222">
<style>
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;
  font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.tbl td b{color:var(--navy)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.st.pre_enrolled{background:#fdf4e3;color:#7a5a12}
.st.active{background:#e9f3ee;color:var(--ok)}
.num{font-variant-numeric:tabular-nums;word-break:break-all}
.acts2{display:flex;gap:6px;flex-wrap:wrap}
.acts2 button{min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.acts2 button.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.fld{margin-top:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px}
.fld input{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit}
@media(max-width:640px){.tbl th:nth-child(3),.tbl td:nth-child(3){display:none}}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202609140222"></script>
<script src="../../../assets/js/portal/auth.js?v=202609140222"></script>
<script src="../../../assets/js/portal/api.js?v=202609140222"></script>
<script src="../../../assets/js/portal/ui.js?v=202609140222"></script>
<script src="../../../assets/js/portal/shell.js?v=202609140222"></script>
<script>
/* PORTAL-2 学籍管理（教务侧）
   闭环：录取 → 记录总校审核确认 → 建档(pre_enrolled) → 正式注册(active)；学号可经专用通道更正。
   本页所有写操作一律经 student-lifecycle Edge Function（aal2 + 角色复核），
   前端不做任何权限判断——按钮显隐只是展示，真正的门禁在 DB 与 Edge。 */
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell;

  const mounted = await Shell.mount({
    space: "admin", title: "管理后台",
    allow: ["registrar","academic_admin","super_admin"], requireAal2: true,
  });
  if (!mounted) return;
  const { main } = mounted;

  const ST = { pre_enrolled: "待正式注册", active: "在读" };
  const HQ = { pending: "待确认", approved: "总校已确认", rejected: "总校未通过" };
  let tab = "queue", pcMap = {};

  const { data: pc } = await Api.select("program_catalog", { columns: "code,name_zh,short_label" });
  pcMap = Object.fromEntries((pc || []).map(p => [p.code, p]));

  main.innerHTML =
    '<h1>学籍管理</h1>' +
    '<p class="lead">录取不等于学籍。必须先有 AMAS 总校审核确认记录，才能建档；建档后由教务完成正式注册。</p>' +
    '<div class="tabs" role="tablist">' +
      '<button role="tab" data-tab="accepted" aria-selected="false">待总校确认</button>' +
      '<button role="tab" data-tab="queue" aria-selected="true">待建档</button>' +
      '<button role="tab" data-tab="students" aria-selected="false">在册学生</button>' +
      '<button role="tab" data-tab="voids" aria-selected="false">学号纠错</button>' +
    '</div>' +
    '<div class="msg err" id="err" role="alert"></div>' +
    '<div id="panel"></div>';

  const panel = document.getElementById("panel");
  const errBox = document.getElementById("err");
  const sayErr = (m) => { errBox.textContent = m; errBox.classList.add("show"); };
  const showErr = sayErr;                       // 模块内其它地方仍按原名用
  const clearErr = () => errBox.classList.remove("show");

  main.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.tab;
    main.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
    load();
  }));

  load();

  async function load(){
    clearErr();
    panel.innerHTML = UI.skeleton(4);
    if (tab === "accepted")  return renderAccepted();
    if (tab === "queue")     return renderQueue();
    if (tab === "voids")     return renderVoids();
    return renderStudents();
  }

  const progName = (code) => code && pcMap[code] ? pcMap[code].name_zh : (code || "—");

  // ---------- 1. 已录取、等待记录总校确认 ----------
  async function renderAccepted(){
    const { data, error } = await Api.select("applications", {
      columns: "id,applicant_id,status,form_data,decided_at",
      eq: { status: "accepted" }, order: { column: "decided_at", asc: true },
    });
    if (error || !Array.isArray(data)) {
      return UI.error(panel, { message: (error && error.message) || "这一次没能读到已录取的申请。", onRetry: load });
    }
    /* 这一路原来把 error 丢了。读不到总校审核记录时 hqMap 是空的，后果有两层：
       每一行的总校状态都显示「未记录」—— 已经确认过的申请看起来像没确认过；
       同时那个 `status !== "approved"` 的过滤也筛不掉任何东西，已确认的申请
       会重新出现在待确认列表里。而 confirm_hq_approval 是 on conflict do update
       （0012_student_core.sql:331），再记一次会**覆盖**已有的总校结论。
       所以读不到时要明说未知，不能显示成「未记录」。 */
    const { data: hq, error: hqErr } = await Api.select("application_hq_approvals", {
      columns: "application_id,status,approval_reference,confirmed_at",
    });
    /* 判据写对了、执行不到，等于没写：上一版判了 !Array.isArray(hq)，下一行却仍然
       对未验证的值 .map —— hq 是 {} 这类非数组真值时先抛 TypeError，那句「未知」
       根本渲染不出来。Map 一律用已验证过的数组来建。 */
    const hqUnknown = !!hqErr || !Array.isArray(hq);
    const hqRows = Array.isArray(hq) ? hq : [];
    const hqMap = Object.fromEntries(hqRows.map(h => [h.application_id, h]));
    const rows = hqUnknown ? data : data.filter(a => (hqMap[a.id] || {}).status !== "approved");

    if (!rows.length) {
      return panel.innerHTML = hqUnknown
        ? UI.box("—", "没有已录取待处理的申请", "总校审核结论这一次没能读到，所以这里不作「都已记录」的判断。")
        : UI.box("✅", "没有待确认的录取", "已录取的申请都已记录总校审核结论。");
    }

    /* confirm_hq_approval 是 on conflict (application_id) do update
       （0012_student_core.sql:331）—— 再记一次会**覆盖**已有的总校结论。
       既然已经知道这一点，就不能在读不到旧结论时还把写入口摆在那里：
       带着缺失的证据去覆盖一个可能已经存在的决定，比不让他记更糟。
       所以未知时停用入口、给一个重试；读到之后自动恢复。 */
    const hqWarn = hqUnknown
      ? '<div class="msg warn show" style="margin-bottom:12px"><b>这一次没能读到总校审核结论（未知）。</b>' +
        '因此下面每一行的总校状态都显示不出来，列表也可能包含<b>已经确认过</b>的申请。' +
        '再记一次会覆盖已有的总校结论，所以「记录总校确认」已暂时停用。' +
        '<div style="margin-top:10px"><button class="btn ghost" data-hqretry ' +
        'style="width:auto;padding:0 18px">重新读取总校审核结论</button></div></div>'
      : "";

    panel.innerHTML = hqWarn + '<div class="card"><div class="scroller"><table class="tbl">' +
      '<thead><tr><th>姓名</th><th>项目</th><th>录取时间</th><th>总校状态</th><th>操作</th></tr></thead><tbody>' +
      rows.map(a => {
        const d = a.form_data || {};
        const h = hqMap[a.id];
        return '<tr><td><b>' + UI.esc(d.name_zh || "—") + '</b></td>' +
          '<td>' + UI.esc(progName((d.programs || [])[0])) + '</td>' +
          '<td>' + (a.decided_at ? new Date(a.decided_at).toLocaleDateString("zh-CN") : "—") + '</td>' +
          '<td>' + UI.esc(hqUnknown ? "未知" : (h ? (HQ[h.status] || h.status) : "未记录")) + '</td>' +
          '<td><div class="acts2"><button class="pri" data-hq="' + a.id + '"' +
            (hqUnknown ? ' disabled title="总校审核结论这一次没读到，读到之前不记录，以免覆盖已有决定"' : "") +
            '>记录总校确认</button></div></td></tr>';
      }).join("") + '</tbody></table></div></div>';

    /* disabled 之外再拦一道：这是覆盖已有审批结论的写入口，不靠一个属性兜底。 */
    panel.querySelectorAll("[data-hq]").forEach(b =>
      b.addEventListener("click", () => { if (hqUnknown) return; promptHq(b.dataset.hq); }));
    const retry = panel.querySelector("[data-hqretry]");
    if (retry) retry.addEventListener("click", () => {
      retry.disabled = true; retry.textContent = "读取中…";
      renderAccepted();
    });
  }

  // ---------- 2. 总校已确认、等待建档 ----------
  async function renderQueue(){
    const { data, error } = await Api.rpc("admissions_ready_for_enrollment");
    if (error) return UI.error(panel, { message: error.message, onRetry: load });
    if (!data || !data.length) {
      return panel.innerHTML = UI.box("📋", "没有待建档的申请",
        "只有「已录取 + 总校已确认 + 尚未建档」的申请才会出现在这里。");
    }
    panel.innerHTML = '<div class="card"><div class="scroller"><table class="tbl">' +
      '<thead><tr><th>姓名</th><th>项目</th><th>总校批文</th><th>确认时间</th><th>操作</th></tr></thead><tbody>' +
      data.map(r =>
        '<tr><td><b>' + UI.esc(r.display_name || r.email || "—") + '</b></td>' +
        '<td>' + UI.esc(progName(r.program_code)) + '</td>' +
        '<td>' + UI.esc(r.approval_reference || "—") + '</td>' +
        '<td>' + (r.confirmed_at ? new Date(r.confirmed_at).toLocaleDateString("zh-CN") : "—") + '</td>' +
        '<td><div class="acts2"><button class="pri" data-create="' + r.application_id + '">建立学籍</button></div></td></tr>'
      ).join("") + '</tbody></table></div></div>';

    panel.querySelectorAll("[data-create]").forEach(b =>
      b.addEventListener("click", () => promptCreate(b.dataset.create)));
  }

  // ---------- 3. 在册学生 ----------
  async function renderStudents(){
    const { data, error } = await Api.select("student_records", {
      columns: "id,user_id,status,student_number,program_code,activated_at,created_at",
      order: { column: "created_at", asc: false },
    });
    if (error) return UI.error(panel, { message: error.message, onRetry: load });
    if (!data || !data.length) {
      return panel.innerHTML = UI.box("🎓", "还没有学籍记录", "完成建档后，学生会出现在这里。");
    }
    /* 同一形状的第二处：也是拿未验证的读取结果建 Map。读不到时姓名原本写「—」，
       而这一行上挂着正式注册 / 换发学号 / 申请纠正误录这些身份级动作 ——
       「—」看起来像这个人没有名字，实际是我们没读到。动作的对象是已验证的
       s.id，不是这个名字，所以按钮不停用；但名字要如实说未知。 */
    const { data: profs, error: profsErr } = await Api.select("profiles", {
      columns: "id,display_name,email", in: { id: data.map(s => s.user_id) },
    });
    const profsUnknown = !!profsErr || !Array.isArray(profs);
    const pm = Object.fromEntries((Array.isArray(profs) ? profs : []).map(p => [p.id, p]));

    /* 正式注册 / 换发学号 / 申请纠正误录都是不可逆的身份级写入，三个弹窗原来
       只说「该学生」「这名学生」—— 姓名、学号、项目一个都不给。管理员在表格里
       点错一行，弹窗里没有任何东西能让他发现，而换发学号会把旧号记为 retired
       **永久占用**。所以弹窗要带上他在行里看到的那份身份。
       描述在**绑定事件时**就定死，之后列表重绘也不会换掉对象。 */
    const whoOf = (s) => {
      const p = pm[s.user_id] || {};
      const name = p.display_name || p.email || "";
      const num = s.student_number || "";
      return {
        line: [name || (profsUnknown ? "姓名这一次没读到" : "未登记姓名"),
               num ? "学号 " + num : "学号尚未录入",
               progName(s.program_code)].join(" · "),
        number: num,
        /* 姓名和学号都没有时，**没有任何东西**能让人认出这是谁 ——
           内部的 s.id 用户看不到也认不出，不能拿它当「对象明确」。 */
        identifiable: !!(name || num),
      };
    };
    const whoMap = {};
    data.forEach(s => { whoMap[s.id] = whoOf(s); });
    const blind = data.filter(s => !whoMap[s.id].identifiable).length;
    const blindWarn = blind
      ? '<div class="msg warn show" style="margin-bottom:12px">有 <b>' + blind +
        '</b> 名学生这一次既没读到姓名、也还没有学号 —— <b>认不出是谁</b>，' +
        '所以这几行的身份级操作暂时停用。请刷新后再试。</div>'
      : "";

    panel.innerHTML = blindWarn + '<div class="card"><div class="scroller"><table class="tbl">' +
      '<thead><tr><th>姓名</th><th>学号</th><th>项目</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
      data.map(s => {
        const p = pm[s.user_id] || {};
        const w = whoMap[s.id];
        const noId = w.identifiable ? "" :
          ' disabled title="这一行既没读到姓名也没有学号，认不出是对谁操作"';
        return '<tr><td><b>' + UI.esc(p.display_name || p.email ||
            (profsUnknown ? "姓名未读到" : "—")) + '</b></td>' +
          '<td class="num">' + UI.esc(s.student_number || "待录入") + '</td>' +
          '<td>' + UI.esc(progName(s.program_code)) + '</td>' +
          '<td><span class="st ' + s.status + '">' + (ST[s.status] || s.status) + '</span></td>' +
          '<td><div class="acts2">' +
            (s.status === "pre_enrolled" ? '<button class="pri" data-activate="' + s.id + '"' + noId + '>正式注册</button>' : "") +
            '<button data-fixnum="' + s.id + '"' + noId + '>换发学号</button>' +
            (s.status === "pre_enrolled" && s.student_number
              ? '<button data-void="' + s.id + '"' + noId + '>申请纠正误录</button>' : "") +
          '</div></td></tr>';
      }).join("") + '</tbody></table></div></div>';

    panel.querySelectorAll("[data-activate]").forEach(b =>
      b.addEventListener("click", () => doActivate(b.dataset.activate, whoMap[b.dataset.activate])));
    panel.querySelectorAll("[data-fixnum]").forEach(b =>
      b.addEventListener("click", () => promptFixNumber(b.dataset.fixnum, whoMap[b.dataset.fixnum])));
    panel.querySelectorAll("[data-void]").forEach(b =>
      b.addEventListener("click", () => promptVoid(b.dataset.void, whoMap[b.dataset.void])));
  }

  // ---------- 服务端调用 ----------
  /* **在途锁按「对象」记，不按「那一个对话框」记。**
     上一包把互斥挂在 wrap 上 —— 他按 Esc 关掉、再打开**同一份申请**的框，
     按钮是新的、当然是活的，于是同一份申请照样发出第二笔相反的结论
     （本轮实测 Xl5：扣住 2 笔，都是 confirm_hq_approval）。
     关掉对话框**不等于**取消已经发出去的请求 —— 这一点要对他说清楚。
     锁在响应回来（成功或失败）时解开；换一个对象不受影响。 */
  const busyTargets = new Set();
  /* 解锁**不能只是 delete** —— 他面前那个**正开着**的框并不知道。
     监督实测：旧那一笔放行、回执也被消费之后，重开的框仍然全禁、说明还停在
     「还没有回结果」，他得再关一次、再开一次才能继续
     （本轮修前 Xr8/Xr9/Xr12 成功路、Xr18/Xr19/Xr22 失败路）。
     所以锁除了记「谁在途」，还要记「谁在等这把锁」，回结果时通知到人。 */
  const lockWaiters = new Map();                       // 对象标识 → 正卡在它上面的框
  function whenFreed(lock, fn){
    let s = lockWaiters.get(lock);
    if (!s) lockWaiters.set(lock, (s = new Set()));
    s.add(fn);
    return () => { const t = lockWaiters.get(lock);
      if (!t) return; t.delete(fn); if (!t.size) lockWaiters.delete(lock); };
  }
  /** 这一笔回结果了：解锁，并把结果告诉还等着的那些框。ok=是否成功，why=服务端给的原因。 */
  function freeLock(lock, ok, why){
    if (!lock) return;
    busyTargets.delete(lock);
    const s = lockWaiters.get(lock);
    if (!s) return;
    lockWaiters.delete(lock);
    [...s].forEach((fn) => { try { fn(ok, why); } catch (e) {} });
  }

  /* 拿不到明确结论的三类 —— 它们共同的意思是「请求**可能已经生效**」：
       network       连响应都没拿到（请求是否送达未知）
       server_error  服务端回话了，但没给出结构化结论
       unknown / 空  没有可读的结论
     反过来，服务端给了错误码就是**确定没执行**，可以放心重来。
     注意 session_unknown 属于后者：那是我们自己没发出去（第五包），
     它自己的文案已经写明「这次没有发出请求」。 */
  const UNKNOWN_CODES = { network: 1, server_error: 1, unknown: 1 };
  const UNKNOWN_TEXT = "没有拿到这次操作的结果，无法确认它是否已经生效。" +
    "在核实之前不要重复执行 —— 重复执行会写出第二条学籍记录。请刷新后核实当前状态。";

  /** 这一位/这一份的上一次提交还没回来：不再发第二笔，并且当面说清楚。 */
  const sayInFlight = (subject) => UI.toast(
    "「" + subject + "」的上一次提交还没有回结果 —— 先等它回来。这一次没有发出。" +
    "（刚才那一次并没有被取消。）", "err");

  /* subject = 这一次是对**谁**做的。页面级横幅原来只有一句
     「当前状态不允许该操作。」—— 列表里同时有好几名学生时，
     他认不出说的是哪一行（本轮实测 As3）。对话框那几条不受影响：
     它们的错误就显示在那个框里，框里本来就写着对象是谁。 */
  async function call(body, okMsg, subject){
    clearErr();
    const showErr = (m) => sayErr(subject ? subject + "：" + m : m);
    /* 原来这里是 `const { data, error } = await A.callFn(...)` —— 而 auth.js 的
       callFn 返回的是 `{ status, data }`，**根本没有 error 这个字段**。
       于是 `if (error)` 那一支永远不执行；接着只判 `data.ok === false`，
       而断网（`{status:0, data:{error:"network"}}`）、5xx、网关返回 HTML
       （data 是 null）统统落不进去 —— 直接走到 `UI.toast(okMsg)`。
       实测：这三种情况页面都弹「学籍已建立（待正式注册）」，
       **写入根本没发生，却告诉管理员已经完成**。
       改走 Api.fn：它返回 `{data,error}` 并把 HTTP 状态归一成错误码，
       与 portal/admin/teachers/ 用的是同一层。 */
    const { data, error } = await Api.fn("student-lifecycle", body);
    if (error) {
      const code = error.code || "";
      if (!code || UNKNOWN_CODES[code]) { showErr(UNKNOWN_TEXT); return null; }
      showErr(error.message || code);
      return null;
    }
    // 200 但没有可读的 body（网关页、空响应）—— 同样不能断言生效
    if (!data) { showErr(UNKNOWN_TEXT); return null; }
    if (data && data.ok === false) {
      showErr({
        hq_approval_required: "缺少 AMAS 总校审核确认记录，不能建档。",
        student_already_exists: "该申请人已有学籍记录。",
        student_number_taken: "该学号已被使用过，不能重复分配（已使用的学号不回收）。",
        student_number_required: "请先录入学号，再执行正式注册。",
        invalid_state: "当前状态不允许该操作。",
        unchanged: "学号没有变化。",
        student_not_pre_enrolled: "该学生已不是「待正式注册」状态，不能再按误录纠正。",
        number_has_official_records: "该学号已产生正式记录，不能作为误录撤销；如需换号请用「换发学号」。",
        replacement_number_taken: "正确学号已被占用，无法分配。",
        request_already_pending: "该学生已有一份待确认的纠错申请。",
        same_actor_not_allowed: "不能确认自己发起的申请，请由另一名管理员确认。",
        super_admin_required: "两名管理员之中必须有 super_admin 才能完成纠错。",
        number_changed_since_request: "学号在申请提交后已发生变化，请重新发起。",
        no_current_number: "该学生尚未录入学号。",
      }[data.error] || data.error);
      return null;
    }
    /* 契约是 jsonb_build_object('ok', true, …)（0012_student_core.sql）。
       只判 data.ok === false 的话，合成的 200 {} 会被当成成功并弹「已建立学籍」。 */
    if (data.ok !== true) { showErr(UNKNOWN_TEXT); return null; }
    UI.toast(okMsg);
    await load();
    return data;

  function promptFixNumber(sid, who){
    /* 认不出是谁就不做。disabled 之外再拦一道 —— 这是身份级的不可逆写入。 */
    if (!who || !who.identifiable) {
      return UI.toast("这一行既没读到姓名、也没有学号，认不出是对谁操作 —— 这一次不执行，请刷新后再试。", "err");
    }
    modal({
      /* 换发学号必须按**这名学生**上锁：它和总校确认那两个入口不一样 ——
         服务端挡不住重复提交（每一次单看都合法），而每成功一次，
         当时那个号就被记为 released_at 且「仍留在登记簿内，永不重新分配」
         （0012_student_core.sql:329-336）。他按下之后回得慢、关掉框重开再提交一次，
         中间那个号就**永久烧掉**了（本轮修前 Nx7：同一名学生扣住 2 笔，
         B26-1111 与 B26-2222）。
         对照：request_number_void 那一路有唯一约束兜底，第二笔会被服务端
         挡成 request_already_pending（0015_student_number_states.sql:351），
         页面也说得出具体原因，所以那一路这次不加锁、不动。 */
      lock: sid,
      title: "换发学号",
      desc: "对象：" + who.line + "。现学号 " + (who.number || "尚未录入") + " 会记为 retired。" +
            "用于学号确实换发的情形：旧学号会记为 retired，作为历史身份标识**永久占用**，" +
            "不会再分配给任何人。若是纯粹的录入手误（该号从未真正属于这名学生），" +
            "请改用「申请纠正误录」，那条通道需要第二名管理员确认。",
      fields: [
        { id: "num", label: "新学号", required: true },
        { id: "reason", label: "更正原因", required: true },
      ],
      actions: [{ label: "确认更正", primary: true, run: (v) => call({
        action: "correct_student_number", student_id: sid, student_number: v.num, reason: v.reason,
      }, "学号已更正") }],
    });
  }

  async function doActivate(sid, who){
    /* 认不出是谁就不做。disabled 之外再拦一道 —— 这是身份级的不可逆写入。 */
    if (!who || !who.identifiable) {
      return UI.toast("这一行既没读到姓名、也没有学号，认不出是对谁操作 —— 这一次不执行，请刷新后再试。", "err");
    }
    /* 这一条不走 modal()，所以之前**一点互斥都没有**：确认框关掉之后焦点回到
       行内那个按钮（ui.js:84），而按钮没有停用 —— 他原地再按一次就又发一笔。
       服务端第二笔会按 activate_student 的契约回 {ok:false, error:'invalid_state'}
       （s.status 已经是 active），于是屏幕上留下一条红色「当前状态不允许该操作。」，
       而这次操作**其实成功了**（本轮实测 Av5/Av8：扣住 2 笔 activate_student/stu-1；
       回执都回来之后那一行已是「在读」，横幅却说失败）。
       所以按**这名学生**上锁；按钮不停用，以免焦点掉到 body —— 改成拦在这里并当面说明。 */
    if (busyTargets.has(sid)) return sayInFlight(who.line);
    const ok = await UI.confirmDialog({
      title: "正式注册",
      text: "对象：" + who.line + "。确认把这名学生的学籍状态从「待正式注册」改为「在读」？" +
            "该操作会写入状态历史与审计记录。",
      confirmLabel: "确认注册",
    });
    if (!ok) return;
    if (busyTargets.has(sid)) return sayInFlight(who.line);
    busyTargets.add(sid);
    const res = await call({ action: "activate_student", student_id: sid, message: "学籍已正式生效" },
                           "已完成正式注册", who.line);
    freeLock(sid, !!res, res ? "" : (errBox.textContent || "").trim());
  }

  // ---------- 4. 学号纠错（双人控制）----------
  function promptVoid(sid, who){
    /* 认不出是谁就不做。disabled 之外再拦一道 —— 这是身份级的不可逆写入。 */
    if (!who || !who.identifiable) {
      return UI.toast("这一行既没读到姓名、也没有学号，认不出是对谁操作 —— 这一次不执行，请刷新后再试。", "err");
    }
    modal({
      title: "申请纠正误录学号",
      desc: "对象：" + who.line + "。要纠正的误录号是 " + (who.number || "（尚未录入）") + "。" +
            "仅适用于纯行政误录：该学号从未真正属于这名学生（例如总校分配的是 A，录入时写成了 B）。" +
            "提交后需要另一名管理员确认，且两人之中必须有 super_admin；同一人不能既发起又确认。" +
            "确认后误录号会保留完整历史，但不再占用分配资格，可以给真正的持有人使用。",
      fields: [
        { id: "num", label: "正确学号（总校实际分配）", required: true },
        { id: "reason", label: "纠错原因", required: true },
        { id: "evidence", label: "HQ / 教务依据（批文号、邮件、会议纪要…）", required: true },
      ],
      actions: [{ label: "提交纠错申请", primary: true, run: (v) => call({
        action: "request_number_void", student_id: sid,
        replacement_number: v.num, reason: v.reason, evidence_reference: v.evidence,
      }, "纠错申请已提交，等待第二名管理员确认") }],
    });
  }

  async function renderVoids(){
    const { data, error } = await Api.rpc("pending_number_void_requests");
    if (error) return UI.error(panel, { message: error.message, onRetry: load });
    if (!data || !data.length) {
      return panel.innerHTML = UI.box("🔢", "没有待确认的学号纠错",
        "纠错申请由 registrar 或 super_admin 发起，须由另一人确认后才生效。");
    }
    panel.innerHTML =
      '<div class="msg info show" style="margin-bottom:14px">' +
        '释放一个曾出现过的学号属于身份标识级操作，因此必须由两个人完成：' +
        '发起人不能确认自己的申请，且两人之中必须有 super_admin。' +
      '</div>' +
      '<div class="card"><div class="scroller"><table class="tbl">' +
      '<thead><tr><th>学生</th><th>误录 → 正确</th><th>依据</th><th>发起人</th><th>操作</th></tr></thead><tbody>' +
      data.map(r =>
        '<tr><td><b>' + UI.esc(r.display_name || "—") + '</b></td>' +
        '<td class="num">' + UI.esc(r.wrong_original) + ' → ' + UI.esc(r.replacement_original) +
          '<div class="who">' + UI.esc(r.reason) + '</div></td>' +
        '<td>' + UI.esc(r.evidence_reference) + '</td>' +
        '<td>' + UI.esc(r.initiator_name || "—") + '<div class="who">' +
          new Date(r.initiated_at).toLocaleString("zh-CN") + '</div></td>' +
        '<td><div class="acts2">' +
          (r.can_i_approve
            ? '<button class="pri" data-approve="' + r.id + '">确认纠正</button>'
            : '<span class="who">你不能确认此申请<br>（发起人本人，或缺少 super_admin）</span>') +
          '<button data-reject="' + r.id + '">驳回 / 撤回</button>' +
        '</div></td></tr>'
      ).join("") + '</tbody></table></div></div>';

    /* 描述在**绑定事件时**就定死，之后列表重绘也不会换掉对象（与在册学生那张表同一做法）。 */
    const reqMap = Object.fromEntries(data.map(r => [r.id, r]));
    panel.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", async () => {
      const rid = b.dataset.approve, r = reqMap[rid] || {};
      const subject = (r.display_name || "这一份纠错申请") +
        (r.wrong_original ? " · " + r.wrong_original + " → " + r.replacement_original : "");
      /* 和正式注册一样：确认框关掉后按钮还是活的，原地再按一次就再发一笔。
         第二笔服务端按 approve_student_number_void 的契约回
         {ok:false, error:'invalid_state'}（r.status 已不是 pending，
         0015_student_number_states.sql:385），屏幕上就留下一条失败横幅，
         而这一份其实已经确认成功（本轮实测 Ap4）。 */
      if (busyTargets.has(rid)) return sayInFlight(subject);
      const ok = await UI.confirmDialog({
        title: "确认纠正误录学号",
        text: "对象：" + subject + "。确认后：误录号将保留历史但不再占用分配资格，" +
              "学生换成正确学号，登录别名同步更换，全过程写入审计。",
        confirmLabel: "确认纠正",
      });
      if (!ok) return;
      if (busyTargets.has(rid)) return sayInFlight(subject);
      busyTargets.add(rid);
      const res = await call({ action: "approve_number_void", request_id: rid }, "学号纠错已完成", subject);
      freeLock(rid, !!res, res ? "" : (errBox.textContent || "").trim());
    }));
    panel.querySelectorAll("[data-reject]").forEach(b => b.addEventListener("click", () => {
      modal({
        title: "驳回 / 撤回纠错申请",
        desc: "发起人可撤回自己的申请；其他管理员则记为驳回。两种结果都会写入审计。",
        fields: [{ id: "note", label: "说明（可选）" }],
        actions: [{ label: "提交", primary: true, run: (v) => call({
          action: "reject_number_void", request_id: b.dataset.reject, note: v.note || null,
        }, "已处理") }],
      });
    }));
  }

  /** 通用表单弹窗（焦点可达、Esc 关闭）。lock 是这次操作的**对象标识**。 */
  function modal({ title, desc, fields, actions, lock }){
    const wrap = document.createElement("div");
    wrap.className = "portal-modal";
    wrap.innerHTML = '<div class="pm-backdrop"></div>' +
      '<div class="pm-card" role="dialog" aria-modal="true" aria-labelledby="m-t" style="width:min(500px,calc(100% - 32px))">' +
        '<h3 id="m-t">' + UI.esc(title) + '</h3><p>' + UI.esc(desc) + '</p>' +
        fields.map(f =>
          '<div class="fld"><label for="f-' + f.id + '">' + UI.esc(f.label) + '</label>' +
          '<input id="f-' + f.id + '" data-f="' + f.id + '"' + (f.required ? " required" : "") + '></div>').join("") +
        '<div class="pm-acts"><button class="btn ghost" id="m-cancel" style="width:auto;padding:0 20px">取消</button>' +
        actions.map((a, i) =>
          '<button class="btn' + (a.primary ? "" : " ghost") + '" data-act="' + i + '" style="width:auto;padding:0 20px">' +
          UI.esc(a.label) + '</button>').join("") + '</div></div>';
    document.body.appendChild(wrap);

    /* 关掉之后要把焦点还给打开它的那个按钮 —— 否则取消一次就掉到 <body>，
       键盘用户得从表格头部重新 Tab 一遍（本轮实测 St6）。 */
    const prev = document.activeElement;
    /* closed / unwatch 要在 close 之前声明：close 里都要用到。
       close 做成幂等，并且**关掉之后就不再去动页面**（焦点、按钮、说明）——
       否则一笔迟到的回执会替一个早已不在屏幕上的框把焦点抢回去，
       而这时他面前开着的是另一个框。 */
    let closed = false, unwatch = null;
    const close = () => {
      if (closed) return;
      closed = true;
      if (unwatch) { unwatch(); unwatch = null; }
      wrap.remove(); document.removeEventListener("keydown", onKey); prev?.focus?.();
    };
    /* 焦点圈住：没有这一段，Tab 会一路走到遮罩**后面**的页面上
       （本轮实测：正向 10 次、反向 9 次跑到导航和 <body>）。
       对话框是 aria-modal="true"，读屏会告诉他「现在在对话框里」，
       结果键盘却能走出去 —— 说的和做的对不上。 */
    const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),' +
      'select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
    const trap = (e) => {
      if (e.key !== "Tab") return;
      const f = [...wrap.querySelectorAll(FOCUSABLE)]
        .filter(el => el.offsetWidth || el.offsetHeight || el.getClientRects().length);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1], cur = document.activeElement;
      if (e.shiftKey && (cur === first || !wrap.contains(cur))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (cur === last || !wrap.contains(cur))) { e.preventDefault(); first.focus(); }
    };
    const onKey = (e) => { if (e.key === "Escape") { close(); return; } trap(e); };
    document.addEventListener("keydown", onKey);
    wrap.querySelector("#m-cancel").addEventListener("click", close);
    wrap.querySelector(".pm-backdrop").addEventListener("click", close);
    /* 框里只有一块说明，按状态改写。role="alert" 让读屏用户也听得到状态变了。 */
    const noteBox = (tone) => {
      let bx = wrap.querySelector(".pm-err");
      if (!bx) {
        bx = document.createElement("div");
        bx.setAttribute("role", "alert");
        bx.style.margin = "10px 0";
        const acts3 = wrap.querySelector(".pm-acts");
        acts3.parentNode.insertBefore(bx, acts3);
      }
      bx.className = "msg " + (tone || "err") + " show pm-err";
      return bx;
    };
    const setActs = (on) => wrap.querySelectorAll("[data-act]").forEach((x) => { x.disabled = !on; });
    /* 这一份正在途：禁掉动作、说清楚为什么，**并且登记等着** ——
       那一笔一回结果，这个框自己解锁、自己把说明换掉，
       不必关掉再开第三次。解锁时**不动焦点、不清输入**：他可能正在打字。 */
    const waitForFree = () => {
      setActs(false);
      noteBox("warn").textContent = "这一份的上一次提交还没有回结果 —— 先等它回来。" +
        "（刚才关掉对话框并没有取消那一次提交。）";
      if (unwatch) return;                               // 已经在等了，不重复登记
      unwatch = whenFreed(lock, (ok, why) => {
        unwatch = null;
        if (closed) return;
        setActs(true);
        noteBox(ok ? "info" : "err").textContent = ok
          ? "刚才那一次已经回结果了：已经记下，下面的列表也重新读过了。" +
            "如果还要改，请先核对最新状态再提交。"
          : "刚才那一次已经回结果了：没有成功" + (why ? "——" + why : "") +
            "。你填的内容都还在，可以直接再提交一次。";
      });
    };
    if (lock && busyTargets.has(lock)) waitForFree();
    wrap.querySelector("input")?.focus();

    wrap.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
      const v = {};
      wrap.querySelectorAll("[data-f]").forEach(i => v[i.dataset.f] = i.value.trim());
      const missing = fields.filter(f => f.required && !v[f.id]);
      if (missing.length) { alert("请填写：" + missing.map(f => f.label).join("、")); return; }
      /* 在途期间**把这个框里的动作全禁掉**，不只是被点的那一个。
         「记录总校确认」有两个动作（已确认 / 未通过）——原来只禁被点的那个，
         第一笔还在路上时还能按下另一个，对同一份申请同时发出两笔相反的结论；
         而 confirm_hq_approval 是 on conflict do update（0012_student_core.sql:331），
         谁后到谁说了算（本轮实测 Mu4：扣住 2 笔，都是 confirm_hq_approval）。
         「取消」不禁 —— 他随时可以退出去，那条路上一包已经验过是安全的。 */
      if (lock && busyTargets.has(lock)) {      // 关掉重开也绕不过去
        waitForFree();
        return;
      }
      setActs(false);
      if (lock) busyTargets.add(lock);
      /* 原来是**先 close() 再 run()** —— 服务端一拒绝（学号被占用、缺总校确认…），
         他刚打进去的学号就随对话框一起没了，只能重开、重打一遍；
         而错误提示还在对话框**后面**的页面上（本轮实测 Ce6/Ce7）。
         改成：先发，成功才关；失败就留在框里、把服务端那句话搬进来、
         焦点送回第一格，让他当场改。 */
      const res = await actions[+b.dataset.act].run(v);
      const why = res ? "" : (errBox.textContent || "").trim();
      /* 回来了就解锁 —— 失败也能再来 —— 并把结果**告诉还等着这把锁的框**。
         先通知、再处理自己这一个：他面前那个框不该等我关完才解锁。 */
      if (lock) freeLock(lock, !!res, why);
      if (closed) return;                                // 这个框早就关掉了，别再动页面
      if (res) { close(); return; }
      setActs(true);                                     // 失败之后两个动作都能再来
      noteBox("err").textContent = why || "这一次没有成功。你填的内容还在，请修改后再试。";
      wrap.querySelector("input")?.focus();
    }));
  }
})();
</script>
