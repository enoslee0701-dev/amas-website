<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>教师验证审核 | AMAS</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202609141232">
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{min-height:44px;padding:0 15px;border:1px solid var(--line);border-radius:99px;background:#fff;
  color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rq{margin-bottom:14px}
.rq-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rq-head h2{font-size:15.5px;color:var(--navy);margin:0}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 11px;font-size:12px;
  border:1px solid var(--line);background:var(--wash);color:var(--muted);white-space:nowrap}
.pill.submitted{background:#eef4fb;border-color:#cfdeee;color:#294764}
.pill.approved{background:#e9f3ee;border-color:#bcd9cc;color:#1f5133}
.pill.rejected{background:#fdecec;border-color:#f2b8b5;color:#8c1d18}
.pill.needs_information{background:#fdf4e3;border-color:#ecd7a8;color:#7a5a12}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--muted);flex:0 0 auto}
.kv b{color:var(--navy);text-align:right;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.acts .btn{width:auto;min-height:44px;padding:0 18px;font-size:13.5px}
.rsn{margin-top:11px}
.rsn label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px}
.rsn textarea{width:100%;min-height:74px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;font:inherit;font-size:13.5px;resize:vertical}
.rsn textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(23,63,112,.12)}
.rsn .h{font-size:12px;color:var(--muted);margin-top:5px}
/* 待核实时留下的只读草稿：看得见、选得中、改不动 */
.rsn.ro textarea{background:var(--wash);color:var(--muted);border-style:dashed;cursor:default}
.rsn.ro label{color:var(--muted)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202609141232"></script>
<script src="../../../assets/js/portal/auth.js?v=202609141232"></script>
<script src="../../../assets/js/portal/api.js?v=202609141232"></script>
<script src="../../../assets/js/portal/ui.js?v=202609141232"></script>
<script src="../../../assets/js/portal/shell.js?v=202609141232"></script>
<script>
/* 管理端教师验证审核台。

   契约来源（仓库里已有，不是新造的）：
     列表  public.teacher_verification_requests
           tvr_self_select 策略已给 is_admin_any 全表读（0004_teacher_verification.sql:256）
     审核  Edge review-teacher-verification
           入参 { request_id, action, message?, staff_number?, grant_mentor?, internal_note? }
           action ∈ approve | needs_information | reject | suspend | reinstate | revoke
           它自己校验 aal2（403 mfa_required）与管理员角色（403 forbidden），
           再转调 public.review_teacher_verification；状态跃迁由 tvr_validate_transition 把关，
           非法跃迁回 409 invalid_state。
     内部备注 teacher_verification_internal 仅管理员可读（tvi_admin_all），
           本页**不显示也不写**内部备注 —— 审核台只做可见层，备注留给后续专门界面。

   ★ 权限：真正的门禁在服务端。本页用 requireAal2 的 admin 守卫只是**不假装**能进；
     即使有人绕过前端，Edge 与 RPC 仍会各自拒绝。
   ★ 状态机：按钮按当前状态显示，非法动作不给按钮；但**不因为前端隐藏了就认为安全**，
     服务端 409 仍会如实报出来。
   ★ 失败/超时一律不假报成功，也不自动重发 —— 审核是不可逆动作，
     重发可能造成两次审批记录。 */
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell;
  const mounted = await Shell.mount({ space: "admin", title: "教师验证审核",
                                      allow: ["super_admin", "academic_admin", "registrar"],
                                      requireAal2: true });
  if (!mounted) return;
  const { main } = mounted;

  const ST = {
    invited: "已邀请", draft: "草稿", email_verified: "邮箱已验证",
    submitted: "待审核", needs_information: "需补充资料", approved: "已通过",
    rejected: "未通过", suspended: "已暂停", revoked: "已撤销", expired: "已过期",
  };
  /* 每个状态下**允许**的动作，与 tvr_validate_transition 的跃迁表一一对应。
     这里只决定「显示哪些按钮」，不代表权限 —— 权限在服务端。 */
  const ALLOWED = {
    submitted:         [["approve", "通过", "primary"], ["needs_information", "要求补充资料", "ghost"], ["reject", "不通过", "danger"]],
    approved:          [["suspend", "暂停", "ghost"], ["revoke", "撤销", "danger"]],
    suspended:         [["reinstate", "恢复", "primary"], ["revoke", "撤销", "danger"]],
    needs_information: [],
  };
  /* 哪些动作必须填理由。approve / reinstate 是给予权限，可以不附理由；
     其余都会改变或收回对方的身份，**必须说清楚为什么** —— 这条是本页自己的
     要求，服务端的 p_message 本身是可选的。 */
  const REASON_REQUIRED = new Set(["needs_information", "reject", "suspend", "revoke"]);

  const dt = (v) => v ? new Date(v).toLocaleString("zh-CN", {
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";

  let filter = "submitted";

  /* 世代令牌。切筛选、重载、以及审核后的自动刷新都会 +1。
     在途的列表结果回来时先比对：对不上就丢弃 ——
     否则「点了待审→立刻切到已通过」时，先发出的那批待审数据会后到，
     把已通过的列表盖掉，页面显示的和筛选器选的对不上。 */
  let listEpoch = 0;
  /* 已经发出、但没拿到明确结论的审核。键是 request id。
     在人工核实之前，**不允许对同一条再执行任何审核动作**。 */
  const unresolved = new Map();
  /* 审核说明是**对方可见**的正式答复，needs_information / reject / suspend / revoke
     四个动作还**必须**填（本文件 :89）。可是 render() 每次把 main.innerHTML 整个换掉，
     于是只要列表重绘一次 —— 在**别的卡**上执行完动作之后 900ms 的自动刷新、
     或者切一下状态筛选 —— 他写到一半的那段话就没了，页面既不提示也没有出口
     （本轮实测 Tk6/Tk12：重绘之后读回来是空字符串）。
     所以按 request id 把草稿记住，重绘之后放回原处。
     注意：这是**内存**里的草稿，整页刷新或离开本页仍然会丢 —— 本包没有做到那一步。 */
  const draftMsg = new Map();

  async function load() {
    const epoch = ++listEpoch;
    /* 焦点锚点要在**这里**取：下一行的 UI.loading 就会把 main 清空，
       到 render() 里再读已经晚了 —— 那时 activeElement 早就是 <body> 了
       （本轮实测：第一版只在 render 里记，Fx3/Fx7 仍然是 BODY，就栽在这个顺序上）。 */
    const keep = whereIsHe();
    UI.loading(main, 3);
    const build = {
      columns: "id,user_id,status,submitted_data,submitted_at,reviewed_at,applicant_visible_message,created_at",
      order: { column: "submitted_at", asc: false },
    };
    if (filter !== "all") build.eq = { status: filter };
    const { data, error } = await Api.select("teacher_verification_requests", build);
    if (epoch !== listEpoch) return;          // 这批结果已经过期，丢弃
    if (error) {
      // Api.msg 收的是 code 字符串，不是 error 对象 —— 传对象会一律落到 unknown
      return UI.error(main, { message: error.message || Api.msg(error && error.code),
                              onRetry: load });
    }
    render(data || [], keep);
  }

  /* 重绘会把 main 整个换掉。先记下他此刻站在哪个控件上（连光标位置一起），
     重绘之后如果那个控件还在，就把他放回原处。
     他**不在这一片区域里**的时候返回 null —— 那就什么都不做，绝不去抢焦点。 */
  const whereIsHe = () => {
    const a = document.activeElement;
    if (!a || !main.contains(a)) return null;
    if (a.dataset && a.dataset.f) return { kind: "filter", f: a.dataset.f };
    const card = a.closest && a.closest(".rq");
    if (!card) return null;
    const id = card.dataset.id;
    if (a.tagName === "TEXTAREA") return { kind: "ta", id, s: a.selectionStart, e: a.selectionEnd };
    if (a.dataset && a.dataset.act) return { kind: "act", id, act: a.dataset.act };
    if (a.dataset && a.dataset.verify) return { kind: "verify", id };
    return { kind: "card", id };
  };
  const putHimBack = (k) => {
    if (!k) return;
    /* 捕获之后还要 await 列表读取 —— **那段时间他完全可以走开**（去导航、去别处）。
       上一版这里是无条件 focus 的：他走到「跳到主要内容」，数据一回来就被拽回
       列表里的筛选按钮（本轮实测 Ns5）。
       所以放回去之前再看一眼：只有焦点**本来就是被这次重绘打掉的**
       （落在 <body>，或落在已经脱离文档的旧节点上）才放回去；
       他此刻正站在某个活着的控件上，就一个字都别动。 */
    const now = document.activeElement;
    if (now && now !== document.body && now.isConnected) return;
    let el = null;
    if (k.kind === "filter") el = main.querySelector('[data-f="' + CSS.escape(k.f) + '"]');
    else {
      const card = main.querySelector('.rq[data-id="' + CSS.escape(k.id) + '"]');
      if (card) {
        if (k.kind === "ta") el = card.querySelector("textarea");
        else if (k.kind === "act") el = card.querySelector('[data-act="' + CSS.escape(k.act) + '"]');
        else if (k.kind === "verify") el = card.querySelector("[data-verify]");
        /* 原来那个控件没了（状态变了，动作也就换了）或还禁着 —— 至少把他留在这张卡上，
           不要扔回页面开头。 */
        if (!el || el.disabled) { card.setAttribute("tabindex", "-1"); el = card; }
      }
    }
    if (!el) return;
    try { el.focus(); } catch (e) { return; }
    if (k.kind === "ta" && typeof k.s === "number" && el.setSelectionRange) {
      try { el.setSelectionRange(k.s, k.e); } catch (e) {}      // 光标也回到原处
    }
  };

  function render(rows, keep) {
    if (keep === undefined) keep = whereIsHe();
    const tabs = [["submitted", "待审核"], ["needs_information", "需补充"],
                  ["approved", "已通过"], ["rejected", "未通过"], ["all", "全部"]];
    main.innerHTML =
      '<h1>教师验证审核</h1>' +
      '<p class="lead">教师本人在「教师验证」页提交资料后在这里审核。审核动作会立即改变对方的权限，请谨慎操作。</p>' +
      '<div class="tabs" role="group" aria-label="按状态筛选">' +
        tabs.map(([k, t]) => '<button class="tab" type="button" data-f="' + k + '" aria-pressed="' +
          (filter === k ? "true" : "false") + '">' + UI.esc(t) + '</button>').join("") +
      '</div><div id="list"></div>';

    const list = main.querySelector("#list");
    if (!rows.length) {
      UI.empty(list, { title: "没有符合条件的申请",
                       text: "换一个状态筛选看看，或稍后再来。" });
      putHimBack(keep);
      return;
    }
    list.innerHTML = rows.map((r) => {
      const sd = r.submitted_data || {};
      const acts = ALLOWED[r.status] || [];
      return '<div class="card rq" data-id="' + UI.esc(r.id) + '" data-status="' + UI.esc(r.status) + '">' +
        '<div class="rq-head"><h2>' + UI.esc(sd.name || sd.tName || "（未填姓名）") + '</h2>' +
          '<span class="pill ' + UI.esc(r.status) + '">' + UI.esc(ST[r.status] || r.status) + '</span></div>' +
        '<div class="kv"><span>所属机构</span><b>' + UI.esc(sd.org || sd.tOrg || "—") + '</b></div>' +
        '<div class="kv"><span>教学领域</span><b>' + UI.esc(sd.areas || sd.tAreas || "—") + '</b></div>' +
        '<div class="kv"><span>所在地与时区</span><b>' + UI.esc(sd.country || sd.tCountry || "—") + '</b></div>' +
        '<div class="kv"><span>联系电话</span><b>' + UI.esc(sd.phone || sd.tPhone || "—") + '</b></div>' +
        '<div class="kv"><span>提交时间</span><b>' + dt(r.submitted_at) + '</b></div>' +
        (r.reviewed_at ? '<div class="kv"><span>上次审核</span><b>' + dt(r.reviewed_at) + '</b></div>' : '') +
        /* 这段是自己写给对方的纯文本，分项补件常常是多行：
           不加 pre-wrap 的话换行会被折掉，管理员这边看到的和教师那边读到的不是同一段。
           转义仍走 UI.esc，只改换行呈现。 */
        (r.applicant_visible_message
          ? '<div class="kv"><span>已告知对方</span><b style="white-space:pre-wrap">' +
            UI.esc(r.applicant_visible_message) + '</b></div>' : '') +
        (unresolved.has(r.id)
          ? '<div class="msg warn show" role="alert" style="margin-top:12px">' +
              UI.esc(unresolved.get(r.id)) +
              '</div>' +
            /* 他刚写的那段话要**看得见**：只读、明确标注，可以选中复制。
               这一支里一个动作按钮都没有，所以它发不出去；
               文字不写进 HTML，由下面的草稿回填逻辑赋 value（同一条路径，不另开口子）。 */
            ((draftMsg.get(r.id) || "").trim()
              ? '<div class="rsn ro"><label for="m-' + UI.esc(r.id) + '">' +
                  '你刚才写的审核说明（只读，这一次的结果还没有确认）</label>' +
                  '<textarea id="m-' + UI.esc(r.id) + '" readonly aria-readonly="true"></textarea>' +
                  '<div class="h">这段话还留着，可以选中复制。核实之后它会回到可编辑的状态。</div></div>'
              : '') +
            '<div class="acts"><button class="btn" type="button" data-verify="' + UI.esc(r.id) + '">' +
              '刷新核实这条的当前状态</button></div>'
          : acts.length
          ? '<div class="rsn"><label for="m-' + UI.esc(r.id) + '">审核说明（对方可见）</label>' +
              '<textarea id="m-' + UI.esc(r.id) + '" maxlength="500" ' +
                'placeholder="不通过、暂停、撤销与要求补充资料必须填写理由"></textarea>' +
              '<div class="h">这段话会直接显示给对方，请写清楚下一步该做什么。</div></div>' +
            '<div class="acts">' + acts.map(([a, label, kind]) =>
              '<button class="btn ' + kind + '" type="button" data-act="' + a + '">' + UI.esc(label) + '</button>').join("") +
            '</div>' +
            '<div class="msg err" role="alert" hidden></div>' +
            '<div class="msg ok" role="status" hidden></div>'
          : '<p class="note" style="margin-top:10px;font-size:12.5px;color:var(--muted)">' +
              '当前状态下没有可执行的审核动作。</p>') +
      '</div>';
    }).join("");

    /* 重绘之后把他写过的说明放回去（哪一条是哪一条，按 request id 对） */
    list.querySelectorAll(".rq").forEach((card) => {
      const ta = card.querySelector("textarea");
      if (!ta) return;
      const d = draftMsg.get(card.dataset.id);
      if (d) ta.value = d;
    });
    putHimBack(keep);
  }

  /* 他每打一个字就记下来 —— 不能等到「提交时」才记，因为丢失恰恰发生在提交之前。 */
  main.addEventListener("input", (e) => {
    const ta = e.target.closest && e.target.closest("textarea");
    if (!ta) return;
    const card = ta.closest(".rq");
    if (!card) return;
    if (ta.value.trim()) draftMsg.set(card.dataset.id, ta.value);
    else draftMsg.delete(card.dataset.id);
  });

  /** 把一条锁进「待核实」：动作按钮全部撤掉，只留刷新核实。 */
  function lockUnresolved(id, text) {
    unresolved.set(id, text);
    const card = main.querySelector('.rq[data-id="' + CSS.escape(id) + '"]');
    if (!card) return;
    card.querySelectorAll("[data-act]").forEach((b) => b.remove());
    /* 原来这里是整块 rsn.remove() —— 他刚写的那段话当场从屏幕上消失，
       连看一眼、选中复制都做不到（第九十六包 Lv4 把这个现状记了下来）。
       改成**就地转成只读**：留着给他看、给他复制；
       动作按钮上面已经全部移除，所以这段话发不出去，也不改变任何审批状态。 */
    const rsn = card.querySelector(".rsn");
    if (rsn) {
      const rta = rsn.querySelector("textarea");
      if (rta && rta.value.trim()) {
        rsn.classList.add("ro");
        rta.readOnly = true;
        rta.setAttribute("aria-readonly", "true");
        const lab = rsn.querySelector("label");
        if (lab) lab.textContent = "你刚才写的审核说明（只读，这一次的结果还没有确认）";
        const hint = rsn.querySelector(".h");
        if (hint) hint.textContent = "这段话还留着，可以选中复制。核实之后它会回到可编辑的状态。";
      } else {
        rsn.remove();                       // 本来就没写，不留一个空框占地方
      }
    }
    const box = card.querySelector(".msg.err");
    if (box) { box.textContent = text; box.hidden = false; }
    let acts = card.querySelector(".acts");
    if (!acts) { acts = document.createElement("div"); acts.className = "acts"; card.appendChild(acts); }
    acts.innerHTML = '<button class="btn" type="button" data-verify="' + UI.esc(id) + '">' +
                     '刷新核实这条的当前状态</button>';
  }

  main.addEventListener("click", async (e) => {
    const v = e.target.closest("[data-verify]");
    if (v) {
      /* 核实 = 重新向服务端要一次当前状态。拿到之后这条就不再是「未知」，
         解锁与否由它回来的真实状态决定（render 会按状态重新给按钮）。 */
      unresolved.delete(v.dataset.verify);
      return load();
    }

    const tab = e.target.closest("[data-f]");
    if (tab) { filter = tab.dataset.f; return load(); }

    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const card = btn.closest(".rq");
    const id = card.dataset.id;
    const action = btn.dataset.act;
    const ta = card.querySelector("textarea");
    const err = card.querySelector(".msg.err"), ok = card.querySelector(".msg.ok");
    const msg = (ta && ta.value.trim()) || "";
    const showErr = (t) => { err.textContent = t; err.hidden = false; ok.hidden = true; };

    err.hidden = true; ok.hidden = true;

    if (REASON_REQUIRED.has(action) && !msg) {
      showErr("这个动作会改变对方的身份，请先填写审核说明。");
      if (ta) ta.focus();
      return;
    }
    // 不可逆动作再问一次。confirmDialog 是站内既有组件。
    const label = (ALLOWED[card.dataset.status] || []).find((x) => x[0] === action);
    const okGo = await UI.confirmDialog({
      title: (label ? label[1] : action) + "？",
      text: "这个动作会立即改变对方的权限，且会写入审核记录。确认执行吗？",
      confirmLabel: label ? label[1] : "执行",
    });
    if (!okGo) return;

    const all = card.querySelectorAll("[data-act]");
    if (btn.disabled) return;                    // 在途期间吞掉重复点击
    /* 顺序要紧：**禁用之前**先看他是不是正站在这个按钮上。
       一禁用，焦点立刻掉到 <body> —— 键盘用户等于被扔回页面开头
       （本轮实测 Fx2：在途期间 activeElement 就是 BODY）。 */
    const hadFocus = document.activeElement === btn;
    const sentRaw = (ta && ta.value) || "";      // 这一次**实际发出去**的那一版
    all.forEach((b) => { b.disabled = true; });
    btn.setAttribute("aria-busy", "true");
    if (hadFocus) { card.setAttribute("tabindex", "-1"); card.focus(); }

    const { data, error } = await Api.fn("review-teacher-verification", {
      request_id: id, action: action, message: msg || null,
    });

    btn.removeAttribute("aria-busy");
    /* 注意：这里**不**无条件解锁。明确拒绝的分支会在下面自己解锁；
       未知结果的分支要把这一条锁死，交给「刷新核实」。 */
    const unlockActions = () => all.forEach((b) => { b.disabled = false; });

    /* 审核是**不可逆**动作。结论分两类，处理方式完全不同：

         明确拒绝（服务端告诉我们「没有执行」）—— 可以放心重来：
           mfa_required / forbidden / bad_request / invalid_state
         未知结果（拿不到明确结论）—— **请求可能已经生效**：
           network（连响应都没拿到）/ server_error / 非 JSON / 空响应

       对未知结果，只说「不要重试」是不够的 —— 按钮还摆在那儿就还是会被点。
       所以把这一条**锁住**，只留「刷新核实」这一个出口，核实完才解锁。 */
    const PROVEN_REFUSAL = {
      mfa_required: "需要先完成两步验证（MFA）才能执行审核。这次没有执行任何操作。",
      forbidden: "你的账号没有审核权限。这次没有执行任何操作。",
      bad_request: "请求参数不正确，没有执行任何操作。",
      unauthenticated: "登录状态已失效，这次没有执行任何操作。请重新登录。",
      session_unknown: "没能确认你的登录状态，这次没有发出请求、没有执行任何操作。请稍后重试（不需要重新登录）。",
      invalid_state: "这份申请的状态已经变了（可能别人刚处理过），这次没有执行。请刷新后再看。",
      rate_limited: "操作过于频繁，这次没有执行。请稍后再试。",
    };
    const UNKNOWN_TEXT = "没有拿到这次审核的结果，**无法确认它是否已经生效**。" +
      "在核实之前不要重复执行 —— 重复审核会写下两条审批记录。请先刷新核实当前状态。";

    if (error) {
      // Api.msg 收的是 code 字符串。原来这里传了整个 error 对象，
      // 于是一律落到 unknown「操作未能完成，请稍后再试」—— 对不可逆动作是错误建议。
      const code = (error && error.code) || "";
      if (PROVEN_REFUSAL[code]) { unlockActions(); showErr(PROVEN_REFUSAL[code]); return; }
      lockUnresolved(id, UNKNOWN_TEXT);
      return;
    }
    /* 契约是 jsonb_build_object('ok', true, 'status', …)。原来判的是
       `data.ok === false`，于是合成的 200 {} 会**当成成功**溜过去。
       改成必须明确等于 true。 */
    if (!data || data.ok !== true) {
      lockUnresolved(id, UNKNOWN_TEXT);
      return;
    }
    /* 回执要活过列表重渲染。只写 ok.textContent 的话，900ms 后 load() 把 main
       整个换掉，提示随之消失 —— 万一刷新回来的那条状态没变（服务端延迟、
       读到旧副本），审核员就什么确认都没看到。toast 挂在 document.body 上，
       不受 main 重渲染影响。两处都给：卡内提示 + toast。 */
    unlockActions();
    /* 这一条的说明已经**随请求发出去**了：草稿要清掉，
       否则刷新回来框里还留着那段话，看上去像「还没提交」。
       但只清**发出去的那一版** —— 在途期间说明框并没有被禁用（上面只禁了
       [data-act] 按钮），他完全可能一边等一边补字；那些字还没有发出去，
       无条件 delete 会把它们一并抹掉（本轮实测 Dr8：补的字变成空）。 */
    if ((draftMsg.get(id) || "") === sentRaw) draftMsg.delete(id);
    ok.textContent = "已执行。";
    ok.hidden = false;
    UI.toast("审核已执行。");
    setTimeout(load, 900);                        // 刷新列表，让状态与服务端对齐
  });

  load();
})();
</script>
</body>
</html>
