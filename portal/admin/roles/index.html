<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>角色管理 | AMAS</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202610281144">
</head>
<body>
<script src="../../../assets/vendor/supabase-js@2.116.0/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202610281144"></script>
<script src="../../../assets/js/portal/auth.js?v=202610281144"></script>
<script src="../../../assets/js/portal/api.js?v=202610281144"></script>
<script src="../../../assets/js/portal/ui.js?v=202610281144"></script>
<script src="../../../assets/js/portal/shell.js?v=202610281144"></script>
<script src="../../../assets/js/portal/sis.js?v=202610281144"></script>
<script>
/* Staff roles and lifecycle. Normal role assignment never creates accounts or bypasses
   teacher verification / student admission. Server rechecks every operation. */
(async function(){
  const A=window.AmasAuth, UI=window.AmasUI, Api=window.AmasApi, Shell=window.AmasShell, S=window.AmasSis;
  const mounted=await Shell.mount({space:"admin",title:"职分与账号",allow:["super_admin"],requireAal2:true});
  if(!mounted)return;
  const {main,ctx}=mounted, me=ctx.session.user.id;
  const CATALOG=A.ROLE_CATALOG, MANAGED=CATALOG.filter(r=>r.managed).map(r=>r.role);
  const LABEL=Object.fromEntries(CATALOG.map(r=>[r.role,r.label]));
  const STATUS={active:"可使用",pending_email:"待验证邮箱",locked:"已锁定",suspended:"已暂停",disabled:"已停用"};
  let found=null;
  const style=document.createElement("style");style.textContent='.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}.role-card{border:1px solid var(--line);border-radius:12px;padding:16px}.role-card h3{margin:0 0 8px;font-size:16px}.role-card p{font-size:13px;margin:5px 0}.role-person{padding:16px 0;border-bottom:1px solid var(--line)}.role-person .bar{margin-top:10px}.role-person .sbtn{min-height:44px}.role-person small{overflow-wrap:anywhere}';document.head.appendChild(style);
  main.innerHTML='<h1>职分与账号</h1><p class="lead">按工作职责指派现有账号，可设置有效期、撤销职分或停用账号。每次变更保留操作原因与审计。</p>'+
    '<details class="card"><summary>查看全部职分与权限说明</summary><div class="role-grid">'+CATALOG.map(r=>'<article class="role-card" data-role-card="'+r.role+'"><h3>'+UI.esc(r.label)+'</h3><p><b>'+UI.esc(r.scope)+'</b></p><p>'+UI.esc(r.features)+'</p><p class="who">开通：'+UI.esc(r.issuance)+'</p></article>').join('')+'</div></details>'+
    '<div class="msg err" id="err" role="alert" tabindex="-1"></div>'+
    '<form class="card" id="ff" novalidate><div class="f"><label for="em">按登录账号、邮箱或姓名精确查找</label><div class="bar"><input id="em" type="text" autocomplete="off" maxlength="254" placeholder="例如 SUNYING2026" style="flex:1;min-width:160px"><button class="sbtn" type="submit">查找</button></div></div><p class="who">同名时请核对邮箱；不会批量授予，也不会创建共用账号。</p><div id="hit"></div></form>'+
    '<section class="card" style="margin-top:14px"><h2>现有工作人员</h2><p class="who">包含待续期职分；学员请用上方精确查找。</p><div id="staff"></div></section>';
  const errBox=main.querySelector('#err');
  const say=m=>{errBox.textContent=m;errBox.classList.add('show');errBox.focus();};
  const clear=()=>errBox.classList.remove('show');
  Object.assign(S.ERR,{role_not_manageable:'这个职分须按专门流程开通。',cannot_change_self:'不能修改自己的权限。',inactive_account:'账号尚不可使用，请先核对邮箱验证与账号状态。',attendance_account:'请先停用考勤专用职责，再指派其他工作职分。',invalid_expiry:'有效期必须晚于当前时间。',protected_account:'系统管理员账号须通过受控维护管理。',email_not_verified:'邮箱尚未验证，不能直接恢复账号。',reason_required:'请填写不超过1000字的操作原因。'});
  const date=v=>v?new Date(v).toLocaleString('zh-CN'):'长期有效';
  async function roleChange(user,role,grant){
    clear();
    const spec=CATALOG.find(r=>r.role===role), current=(user.grants||[]).find(r=>r.role===role);
    const fields=[{id:'reason',label:'操作原因',type:'textarea',required:true}];
    if(grant)fields.unshift({id:'expires',label:'有效至（本机时区，留空为长期）',type:'datetime-local',value:current?.expires_at?new Date(new Date(current.expires_at)-new Date(current.expires_at).getTimezoneOffset()*60000).toISOString().slice(0,16):''});
    const v=await S.ask({title:(grant?'配置':'撤销')+'「'+(user.display_name||user.email)+'」的'+spec.label+'职分',text:grant?spec.scope+'：'+spec.features:'撤销后，下一次服务端请求将重新检查权限。学籍和历史业务记录保留。',fields,confirmLabel:grant?'确认配置':'确认撤销',danger:!grant});
    if(!v)return;
    let expires=null;
    if(grant&&v.expires){const t=new Date(v.expires);if(!Number.isFinite(t.getTime())||t.getTime()<=Date.now())return say('有效期必须晚于当前时间。');expires=t.toISOString();}
    const result=await S.write({lock:'role-'+user.user_id,rpc:'admin_set_staff_role',args:{p_user:user.user_id,p_role:role,p_grant:grant,p_reason:v.reason,p_expires_at:expires},say});
    if(result){UI.toast(result.unchanged?'配置没有变化':'职分已更新');await Promise.all([refreshFound(),loadStaff()]);}
  }
  async function accountChange(user){
    clear();const enabled=user.account_status!=='active';
    const v=await S.ask({title:(enabled?'恢复':'停用')+'「'+(user.display_name||user.email)+'」的账号权限',text:enabled?'恢复原有未过期职分，不修改密码或学籍。请确认工作安排仍然有效。':'已有登录令牌也不能继续执行受职分保护的操作。保留学籍、原有职分记录和历史数据，不修改密码。',fields:[{id:'reason',label:'操作原因',type:'textarea',required:true}],danger:!enabled,confirmLabel:enabled?'确认恢复':'确认停用'});
    if(!v)return;
    const result=await S.write({lock:'role-'+user.user_id,rpc:'admin_set_account_access',args:{p_user:user.user_id,p_enabled:enabled,p_reason:v.reason},say});
    if(result){UI.toast('账号权限已更新');await Promise.all([refreshFound(),loadStaff()]);}
  }
  function render(box,rows){
    box.innerHTML='';
    rows.forEach(user=>{
      const row=document.createElement('article');row.className='role-person';
      row.innerHTML='<b>'+UI.esc(user.display_name||'未登记姓名')+'</b> <small>'+UI.esc(user.email||'')+'</small><p class="who">'+UI.esc(STATUS[user.account_status]||'状态待核对')+(user.attendance_only?' · 10月班考勤专用':'')+'</p>'+
        '<div>'+((user.grants||[]).map(g=>'<span class="chip">'+UI.esc(LABEL[g.role]||g.role)+' · '+UI.esc(date(g.expires_at))+(g.expires_at&&new Date(g.expires_at)<=new Date()?'（已到期）':'')+'</span>').join(' ')||'<span class="who">暂无职分记录</span>')+'</div>';
      if(user.user_id===me){const note=document.createElement('p');note.className='who';note.textContent='当前账号，不能在这里修改自己的权限。';row.appendChild(note);}
      else {
        const actions=document.createElement('div');actions.className='bar';
        MANAGED.forEach(role=>{
          const assigned=(user.roles||[]).includes(role), exists=(user.grants||[]).some(g=>g.role===role);
          const button=document.createElement('button');button.type='button';button.className='sbtn';button.dataset.role=role;
          button.textContent=(assigned?'调整':exists?'续任':'设为')+LABEL[role];button.disabled=user.account_status!=='active'||user.attendance_only;button.onclick=()=>roleChange(user,role,true);actions.appendChild(button);
          if(exists){const revoke=document.createElement('button');revoke.type='button';revoke.className='sbtn';revoke.textContent='撤销'+LABEL[role];revoke.onclick=()=>roleChange(user,role,false);actions.appendChild(revoke);}
        });
        if(!(user.grants||[]).some(g=>g.role==='super_admin')){const button=document.createElement('button');button.type='button';button.className='sbtn';button.textContent=user.account_status==='active'?'停用账号':'恢复账号';button.onclick=()=>accountChange(user);actions.appendChild(button);}
        row.appendChild(actions);
      }
      box.appendChild(row);
    });
  }
  async function readAccounts(box,identifier){
    box.innerHTML=UI.skeleton(2);
    const r=await Api.rpc('admin_staff_accounts',{p_identifier:identifier});
    if(r.error||!r.data||!Array.isArray(r.data.rows)){box.innerHTML='<p class="who">这次没能读取账号，请重试；这不表示没有账号。</p>';return;}
    render(box,r.data.rows);
    if(!r.data.rows.length)box.textContent=identifier?'没有精确匹配的账号，请核对现有登录名或完整邮箱。':'尚未指派其他工作人员。';
    if(r.data.truncated){const note=document.createElement('p');note.className='who';note.textContent='当前显示前100个账号，请用精确查找定位其他账号。';box.appendChild(note);}
  }
  async function refreshFound(){if(found)await readAccounts(main.querySelector('#hit'),found);}
  async function loadStaff(){await readAccounts(main.querySelector('#staff'),null);}
  main.querySelector('#ff').onsubmit=async e=>{e.preventDefault();clear();found=main.querySelector('#em').value.trim();if(!found)return say('请输入现有登录账号、完整邮箱或姓名。');await refreshFound();};
  loadStaff();
  // Dedicated attendance setup remains on the super-admin page, never on the clerk screen.
  const att=document.createElement("section");att.className="card";att.style.marginTop="16px";
  att.innerHTML='<h2 style="font-size:18px">10月班专用考勤账号</h2><p class="who">可直接指派10月班现有学员账号负责考勤。保留正式学籍与原登录名，指派期间登录只进入考勤页，不提供其他工作空间。</p>'+
    '<form id="attLookup"><label for="attEmail">负责人的账号邮箱</label><div class="bar"><input type="email" id="attEmail" required style="flex:1;min-width:180px"><button type="submit" class="sbtn">查找考勤账号</button></div></form><div id="attHit"></div><h3 style="font-size:15px">已配置的考勤账号</h3><div id="attList"></div>';
  main.appendChild(att);
  Object.assign(S.ERR,{privileged_account:"这个账号具有教务或其他管理身份，不能设为考勤专用入口。",outside_cohort:"这个学员没有分在10月班，请先核对分班。",invalid_account:"不能将自己的管理员账号改成考勤账号。"});
  async function setAttendance(user,enabled){
    const c=await S.ask({title:(enabled?"启用":"停用")+"「"+(user.display_name||user.email)+"」的考勤专用账号",
      text:enabled?"仅负责10月班考勤，保留原学籍与登录账号；指派期间只显示考勤工作台。不授予教务、财务或其他班级管理权限。":"立即撤销考勤权限，不影响已经保存的考勤记录。",confirmLabel:enabled?"确认启用":"确认停用",danger:!enabled});
    if(!c)return;
    const result=await S.write({lock:"att-"+user.user_id,rpc:"admin_set_attendance_operator",args:{p_user:user.user_id,p_enabled:enabled},say});
    if(result){UI.toast(enabled?"考勤账号已启用":"考勤账号已停用");main.querySelector("#attHit").innerHTML="";await loadAttendance();}
  }
  function attendancePerson(box,user,enabled){
    const row=document.createElement("div");row.className="row";
    const label=document.createElement("span");label.textContent=(user.display_name||"未登记姓名")+" · "+(user.email||"");row.appendChild(label);
    const button=document.createElement("button");button.type="button";button.className="sbtn";button.textContent=enabled?"设为10月班考勤专用":"停用考勤权限";button.onclick=()=>setAttendance(user,enabled);row.appendChild(button);box.appendChild(row);
  }
  async function loadAttendance(){
    const box=main.querySelector("#attList");box.textContent="正在读取…";
    const r=await Api.rpc("admin_attendance_operators");box.textContent="";
    if(r.error||!Array.isArray(r.data)){box.textContent="未能读取配置，请稍后刷新。";return;}
    if(!r.data.length)box.textContent="尚未配置专用考勤账号。";
    r.data.forEach(u=>attendancePerson(box,u,false));
  }
  main.querySelector("#attLookup").onsubmit=async e=>{
    e.preventDefault();const box=main.querySelector("#attHit"),email=main.querySelector("#attEmail").value.trim();
    box.textContent="正在查找…";const r=await Api.rpc("admin_find_user",{p_email:email});box.textContent="";
    if(r.error||!Array.isArray(r.data)){say("查找失败，请重试。");return;}
    if(!r.data.length)box.textContent="没有找到此账号，请核对现有账号的完整邮箱。";
    r.data.forEach(u=>attendancePerson(box,u,true));
  };
  loadAttendance();
})();
</script>
</body>
</html>
