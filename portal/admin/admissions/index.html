<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>招生审核 | AMAS 管理后台</title>
<link rel="icon" href="../../../assets/img/favicon.png">
<link rel="stylesheet" href="../../../assets/css/portal.css?v=202609132214">
<style>
.qtable{width:100%;border-collapse:collapse;font-size:13px}
.qtable th,.qtable td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.qtable th{background:var(--wash);color:var(--navy);font-size:12.5px;position:sticky;top:0}
.qtable tr.sel{background:#f4f8ff}
.qwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{min-height:40px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff}
.detail{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;border-left:1px solid var(--line);
  box-shadow:-16px 0 50px rgba(16,32,56,.16);z-index:50;overflow-y:auto;padding:22px;display:none}
.detail.open{display:block}
.detail .ro{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.detail .ro span{color:var(--muted);flex:0 0 34%}
.detail .ro b{text-align:right}
.dclose{position:absolute;right:16px;top:14px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;min-width:44px;min-height:44px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.acts button{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:13.5px;cursor:pointer}
.acts button:hover{border-color:var(--gold)}
.acts button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.reqrow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.reqrow input{flex:1 1 140px;min-height:40px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font:inherit}
.reqrow select{flex:0 0 auto;min-height:40px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:#fff}
@media(max-width:640px){.reqrow input,.reqrow select{flex:1 1 100%}}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202609132214"></script>
<script src="../../../assets/js/portal/auth.js?v=202609132214"></script>
<script src="../../../assets/js/portal/api.js?v=202609132214"></script>
<script src="../../../assets/js/portal/ui.js?v=202609132214"></script>
<script src="../../../assets/js/portal/shell.js?v=202609132214"></script>
<script src="../../../assets/js/portal/application-form.js?v=202609132214"></script>
<script>
(async function(){
  const A = window.AmasAuth, Api = window.AmasApi, UI = window.AmasUI, Shell = window.AmasShell, F = window.AmasAppForm;
  const mounted = await Shell.mount({
    space: "admin", title: "管理后台",
    allow: ["registrar","academic_admin","super_admin"],
    requireAal2: true,                       // 角色 + MFA 双闸（服务端仍会再验）
  });
  if (!mounted) return;
  const { main } = mounted;

  const ST = { draft:"草稿", submitted:"待审核", under_review:"审核中",
    needs_information:"待补充", accepted:"已录取", rejected:"已拒绝", withdrawn:"已撤回" };
  const PW = { bth:"正式 B.Th 学籍", common_learning:"共同学习", undecided:"未选择" };
  // 提交后锁定的字段 → 中文名（要求补件时可按条解锁，见 migration 0011）
  const LOCK_LABEL = { name_zh:"中文姓名", birth_ym:"出生年月", gender:"性别", nationality:"国籍",
    conversion_date:"初信日期", baptism_date:"受洗日期", programs:"申请项目" };

  let rows = [], pcMap = {}, current = null;
  /* G1 指派：候选人、读取是否不明、以及我自己是谁（用于「指派给我」这一档筛选）。
     终态一律不可改指派 —— 与 0027 的 assign_application_reviewer 同一口径。 */
  let reviewers = [], reviewersUnknown = false, reviewersUndated = 0, myUid = null, myUidUnknown = false;
  /* 队列原来是一次性 limit:300，而所有筛选都在这 300 份之上做 ——
     申请一过 300，更早的根本没进浏览器，页面却从没说过这是个上限：
     筛「待审核」会说「没有符合条件的申请」，搜姓名搜不到，「全部时间」其实是「最新 300 份」。
     改成一页页取：取满就说「可能还有更早的没读到」并给一条真出路。 */
  const PAGE = 300;
  let pagesLoaded = 0, maybeMore = false, moreErr = null;
  /* 分页必须**单飞**且有**世代**，两样缺一不可：
       单飞 —— 同一时刻只允许一个分页请求。而且这个状态要**贯穿重绘**：
               旧按钮只禁用自己是不够的，任何一次筛选重绘都会重建一个新按钮，
               新按钮如果是可用的，点下去就并发了。
       世代 —— load() 刷新之后，上一代的晚回响应必须整条丢掉。
               否则它会把 pagesLoaded 又推进一次，下一次直接跳过一整页
               （实测：刷新后再点，要到的是 600..899，漏了 300..599）。
     另外：偏移只由**被接受的那一次**响应推进；失败不推进，所以重试要的是同一个 range。 */
  let pageInflight = false, generation = 0;
  const TERMINAL = ["accepted", "rejected", "withdrawn"];

  main.innerHTML = `
    <h1>招生审核</h1>
    <p class="lead">审核决定由服务端事务执行并写入审计；<b>录取（accepted）不等于学籍建立</b>，学籍须经 AMAS 总校审核确认后另行建档。</p>
    <div class="filters">
      <select id="fSt" aria-label="按状态筛选">
        <option value="">全部状态</option>
        <option value="submitted">待审核</option>
        <option value="under_review">审核中</option>
        <option value="needs_information">待补充</option>
        <option value="accepted">已录取</option>
        <option value="rejected">已拒绝</option>
        <option value="withdrawn">已撤回</option>
        <option value="draft">草稿</option>
      </select>
      <select id="fPw" aria-label="按学习路径筛选">
        <option value="">全部路径</option>
        <option value="bth">正式 B.Th 学籍</option>
        <option value="common_learning">共同学习</option>
      </select>
      <select id="fAs" aria-label="按审核人筛选">
        <option value="">全部审核人</option>
        <option value="mine">指派给我的</option>
        <option value="none">未指派</option>
      </select>
      <select id="fTm" aria-label="按提交时间筛选">
        <option value="">全部时间</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
        <option value="90">近 90 天</option>
      </select>
      <input id="fQ" aria-label="搜索姓名或教会" placeholder="搜索姓名 / 教会" style="min-width:180px">
      <button class="link" id="fReload">刷新</button>
    </div>
    <div id="list">${UI.skeleton(4)}</div>
    <aside class="detail" id="detail" aria-label="申请详情" tabindex="-1"></aside>`;

  const { data: pc } = await Api.select("program_catalog", { columns: "code,name_zh,short_label" });
  pcMap = Object.fromEntries((pc || []).map(p => [p.code, p]));

  /* 候选审核人：既有权限内就能取到（user_roles / profiles 的 select 策略都含
     `or is_admin_any(auth.uid())`，0002_identity.sql:233-234 / :211-212），
     不需要任何新表、新视图或新策略。
     过滤条件必须与服务端 has_active_role 一致 —— revoked_at is null **且**
     (expires_at is null or expires_at > now)，0002:117-125。
     Api.select 表达不了 `is null`，所以把这两列取回来在本地筛。 */
  async function loadReviewers(){
    reviewers = []; reviewersUnknown = false; reviewersUndated = 0;
    const { data: rs, error: rErr } = await Api.select("user_roles", {
      columns: "user_id,role,revoked_at,expires_at",
      in: { role: ["registrar", "academic_admin", "super_admin"] },
    });
    if (rErr || !Array.isArray(rs)) { reviewersUnknown = true; return; }
    const now = Date.now();
    const active = [], undated = new Set();
    for (const r of rs) {
      if (r.revoked_at) continue;                       // 已撤销：确定不是候选人
      if (!r.expires_at) { active.push(r); continue; }  // 无到期：有效
      const t = new Date(r.expires_at).getTime();
      /* 到期时间读不出来 = **不知道**这个角色还有没有效。不知道就不摆进候选名单，
         但也不当作「没有这个人」—— 单独计数、在界面上说出来。 */
      if (!Number.isFinite(t)) { undated.add(r.user_id); continue; }
      if (t > now) active.push(r);
    }
    reviewersUndated = undated.size;
    const ids = [...new Set(active.map(r => r.user_id))];
    if (!ids.length) return;
    const { data: ps, error: pErr } = await Api.select("profiles", {
      columns: "id,display_name,email", in: { id: ids },
    });
    if (pErr || !Array.isArray(ps)) { reviewersUnknown = true; return; }
    const pm = Object.fromEntries(ps.map(x => [x.id, x]));
    reviewers = ids.map(id => {
      const pr = pm[id] || {};
      return { id,
        name: pr.display_name || pr.email || ("未登记姓名 " + String(id).slice(0, 8)),
        roles: [...new Set(active.filter(r => r.user_id === id).map(r => r.role))] };
    }).sort((x, y) => x.name.localeCompare(y.name, "zh-CN"));
  }
  const reviewerName = (id) => {
    if (!id) return null;
    const r = reviewers.find(x => x.id === id);
    return r ? r.name : (reviewersUnknown ? null : "未登记姓名 " + String(id).slice(0, 8));
  };

  /* 「指派给我的」这一档要知道我是谁。读不到就不猜 —— 那一档禁用并说明。 */
  const sess = await A.fetchSession();
  if (sess.failed || !sess.session || !sess.session.user) myUidUnknown = true;
  else myUid = sess.session.user.id;
  if (myUidUnknown) {
    const o = document.querySelector('#fAs option[value="mine"]');
    if (o) { o.disabled = true; o.textContent = "指派给我的（没读到你的账号）"; }
  }
  await loadReviewers();

  document.getElementById("fReload").addEventListener("click", load);
  ["fSt","fPw","fTm","fAs"].forEach(id => document.getElementById(id).addEventListener("change", renderList));
  document.getElementById("fQ").addEventListener("input", renderList);

  await load();

  async function load(){
    generation += 1;                 // 上一代的在途请求就此作废
    pageInflight = false;
    UI.loading("#list", 4);
    rows = []; pagesLoaded = 0; maybeMore = false; moreErr = null;
    await loadPage();
  }

  async function loadPage(){
    if (pageInflight) return;        // 单飞
    const gen = generation;
    const from = pagesLoaded * PAGE;
    pageInflight = true;
    /* 已经有内容时立刻重绘一次，让按钮变成禁用的「读取中…」——
       这样之后无论谁再触发重绘，读到的都是同一个在途状态。
       首屏还在骨架态时不重绘，免得闪一下空态。 */
    if (pagesLoaded > 0) renderList();
    const { data, error } = await Api.select("applications", {
      columns: "id,applicant_id,pathway,status,form_data,locked_fields,submitted_at,decided_at,updated_at,applicant_visible_message,assigned_reviewer",
      /* 次级键 id 是必须的：submitted_at 有并列（同一秒提交、以及草稿的 null），
         只按它排的话，两次查询之间并列行的先后没有保证，翻页会在边界重复**和漏**。
         重复能被 id 去重盖住，漏掉的那一份没有人会发现。 */
      order: [{ column: "submitted_at", asc: false }, { column: "id", asc: false }],
      range: { from, to: from + PAGE - 1 },
    });
    /* 上一代的晚回：整条丢掉，连 pageInflight 都不碰（新一代已经把它清成 false）。 */
    if (gen !== generation) return;
    pageInflight = false;
    if (error || !Array.isArray(data)) {
      const msg = (error && error.message) || "这一次没能读到申请列表。";
      if (!pagesLoaded) return UI.error("#list", { message: msg, onRetry: load });
      /* 后续页失败：已经读到的那些照常显示，但要说清楚更早的这一页没取到 ——
         不能让它看起来像「已经到底了」。 */
      moreErr = msg; renderList(); return;
    }
    /* 边取边有人提交时，偏移分页可能把同一行取两次。按 id 去重。 */
    const seen = new Set(rows.map(r => r.id));
    for (const r of data) if (!seen.has(r.id)) { rows.push(r); seen.add(r.id); }
    pagesLoaded += 1;
    maybeMore = data.length >= PAGE;      // 取满了就可能还有更早的
    moreErr = null;
    renderList();
  }

  function bindMore(){
    const b = document.getElementById("btnMore");
    if (!b || b.disabled) return;
    b.addEventListener("click", () => { loadPage(); });   // 禁用与文案由 renderList 统一管
  }

  /* 提交时间是这一列里唯一能定位到时间轴上的东西，但有两种行放不上去：
     草稿根本没有 submitted_at；服务端也可能给回一个解析不出来的值。
     时间筛选不能把它们悄悄吞掉 —— 选了时间范围就明说「另有几份放不进时间轴」。 */
  /* 写成函数声明而不是 const：`await load()` 在这一行之前就跑了，
     它会调到 renderList，const 在那时还处于 TDZ，会直接抛。 */
  function submittedAt(r){
    if (!r.submitted_at) return null;
    const t = new Date(r.submitted_at).getTime();
    return Number.isFinite(t) ? t : null;
  }

  function renderList(){
    const st = document.getElementById("fSt").value;
    const pw = document.getElementById("fPw").value;
    const tm = document.getElementById("fTm").value;
    const as = document.getElementById("fAs").value;
    const q = document.getElementById("fQ").value.trim().toLowerCase();
    /* 「近 N 天」的范围是 [since, now] —— **两头都要有界**，两端都含等于。
       原来只比 `t < since`，上界是敞开的：一份提交时间比现在还晚的申请
       （服务端时钟偏了，或数据被改过）会被算进「近 7 天」，看上去像刚刚交的。 */
    const now = Date.now();
    const since = tm ? now - Number(tm) * 864e5 : null;

    let unplaceable = 0, future = 0;
    const list = rows.filter(r => {
      if (st && r.status !== st) return false;
      if (pw && r.pathway !== pw) return false;
      if (as === "none" && r.assigned_reviewer) return false;
      if (as === "mine" && (!myUid || r.assigned_reviewer !== myUid)) return false;
      if (q && !JSON.stringify([r.form_data?.name_zh, r.form_data?.name_en, r.form_data?.church_name])
                .toLowerCase().includes(q)) return false;
      if (since !== null) {
        const t = submittedAt(r);
        if (t === null) { unplaceable++; return false; }   // 放不进时间轴，计数后排除
        if (t > now) { future++; return false; }           // 时间在将来：异常，另行说明
        if (t < since) return false;
      }
      return true;
    });

    /* 只读到一部分就说只读到一部分。到底了才说到底了。 */
    const truncNote = maybeMore
      ? `<div class="msg warn show" style="margin-bottom:10px">目前只读到最新的 <b>${rows.length}</b> 份，` +
        `<b>可能还有更早的没读到</b>。下面的筛选与搜索都只在这些里面找。` +
        `<div style="margin-top:8px"><button class="btn ghost" type="button" id="btnMore"` +
        (pageInflight ? " disabled" : "") +
        ` style="width:auto;padding:0 18px">` +
        (pageInflight ? "读取中…" : "载入更早的 " + PAGE + " 份") + `</button></div></div>`
      : (pagesLoaded > 1
          /* 不能无条件说「已经是全部」。offset 分页是**分几次去读**，不是一次快照：
             这期间有人撤回，后面的行会往前挪，挪进已经读过的窗口里 —— 那一份就漏了，
             而且最后一页正好是短的，看上去像「到底了」。
             （翻页期间新提交则相反：会把末尾挤出窗口，但页是满的，按钮还在。） */
          ? `<div class="msg info show" style="margin-bottom:10px">到这一次为止读到 <b>${rows.length}</b> 份，` +
            `没有更多了。<br>分页是分几次读的 —— 如果这期间有人提交或撤回，边界附近可能有出入；` +
            `要确认完整，请点「刷新」重读一次。</div>`
          : "");
    const moreErrNote = moreErr
      ? `<div class="msg err show" style="margin-bottom:10px">更早的那一页没能读到（${UI.esc(moreErr)}）。` +
        `上面这些是已经读到的，<b>不代表全部</b>。</div>`
      : "";

    const offNote =
      (unplaceable
        ? `<div class="msg info show" style="margin-bottom:10px">另有 <b>${unplaceable}</b> 份` +
          `<b>放不进时间轴</b>（没有提交时间，或提交时间读不出来），不在这个时间范围内。` +
          `切回「全部时间」可以看到它们。</div>`
        : "") +
      (future
        ? `<div class="msg warn show" style="margin-bottom:10px">另有 <b>${future}</b> 份的提交时间` +
          `<b>比现在还晚</b>（落在将来）。这不是正常数据，所以没有把它们当成最近的提交；` +
          `切回「全部时间」可以看到，请核实来源。</div>`
        : "");

    if (!list.length) {
      UI.render("#list", truncNote + moreErrNote + offNote + UI.box("🔎",
        maybeMore ? "在已读到的 " + rows.length + " 份里没有符合条件的申请" : "没有符合条件的申请",
        maybeMore ? "可能还有更早的没读到 —— 先载入更早的，或缩小筛选范围再看。" : "调整筛选条件后再试。"));
      bindMore();
      return;
    }

    document.getElementById("list").innerHTML = truncNote + moreErrNote + offNote + `<div class="qwrap"><table class="qtable">
      <thead><tr><th>申请人</th><th>项目 / 路径</th><th>状态</th><th>审核人</th><th>提交时间</th><th></th></tr></thead>
      <tbody>${list.map(r => {
        const d = r.form_data || {};
        const p = Array.isArray(d.programs) ? pcMap[d.programs[0]] : null;
        return `<tr data-id="${r.id}">
          <td><b>${UI.esc(d.name_zh || "（未填姓名）")}</b><br><span style="color:var(--muted)">${UI.esc(d.church_name || "")}</span></td>
          <td>${UI.esc(p ? p.name_zh : "—")}<br><span style="color:var(--muted)">${UI.esc(PW[r.pathway] || r.pathway)}</span></td>
          <td><span class="st ${r.status}">${ST[r.status] || r.status}</span></td>
          <td>${r.assigned_reviewer
            ? UI.esc(reviewerName(r.assigned_reviewer) || "这一次没读到")
            : '<span style="color:var(--muted)">未指派</span>'}</td>
          <td>${r.submitted_at
            ? (submittedAt(r) !== null
                ? new Date(r.submitted_at).toLocaleString("zh-CN", { hour12: false })
                /* 原来直接 toLocaleString，服务端给回怪值时这一格写的是「Invalid Date」。 */
                : "时间读不出")
            : "—"}</td>
          <td><button class="link" data-open="${r.id}">查看</button></td>
        </tr>`;
      }).join("")}</tbody></table></div>`;

    bindMore();
    document.querySelectorAll("[data-open]").forEach(b =>
      b.addEventListener("click", () => openDetail(b.dataset.open)));
  }

  async function openDetail(id){
    current = rows.find(r => r.id === id);
    if (!current) return;
    const box = document.getElementById("detail");
    box.classList.add("open");
    box.innerHTML = UI.skeleton(6);

    /* 这三路原来只解构 data，把各自的 error 丢掉 —— 读不到就当成「没有」。
       后果落在**不可逆且写审计**的决定上：内部备注读不到显示「（暂无）」，
       上一位同工写下的「此人材料存疑」就此隐形；补件要求读不到整段省略，
       看不出这份申请还欠材料就按「资料齐全」录取；时间线读不到显示
       「暂无记录」，像是从来没人审过。三者都会把「没读到」当成证据。
       改成：读不到就明说这一次没读到，不替服务端断言「没有」。 */
    const [{ data: internal, error: intErr }, { data: reqs, error: reqErr },
           { data: hist, error: histErr }] = await Promise.all([
      Api.select("application_internal", { columns: "notes,updated_at", eq: { application_id: id }, single: true }),
      Api.select("application_requirements", { columns: "id,label,detail,field,resolved", eq: { application_id: id }, order: { column: "created_at", asc: true } }),
      Api.select("application_status_history", { columns: "from_status,to_status,actor_role,applicant_visible_message,created_at", eq: { application_id: id }, order: { column: "created_at", asc: true } }),
    ]);

    const readFailed = (what) =>
      `<div class="msg warn show" style="margin:6px 0">这一次没能读到${what}（未知）。` +
      `这不表示它是空的 —— 请刷新核实之后再据此判断。</div>`;
    /* internal 走 maybeSingle：没有备注时是 data=null / error=null，那才是「确实没写过」；
       只有 error 才算读不到。数组的两路则要求真的拿到数组。 */
    const intUnknown = !!intErr;
    const reqUnknown = !!reqErr || !Array.isArray(reqs);
    const histUnknown = !!histErr || !Array.isArray(hist);

    const d = current.form_data || {};
    const p = Array.isArray(d.programs) ? pcMap[d.programs[0]] : null;
    const ro = (k, v) => v ? `<div class="ro"><span>${UI.esc(k)}</span><b>${UI.esc(v)}</b></div>` : "";
    const rowsOf = (arr, cols) => (arr || []).map(r => cols.map(c => r[c]).filter(Boolean).join(" · ")).filter(Boolean).join("<br>");

    const editable = ["submitted","under_review","needs_information"].includes(current.status);
    box.innerHTML = `
      <button class="dclose" id="dClose" aria-label="关闭">×</button>
      <h2 style="font-size:18px;color:var(--navy);margin:0 0 4px">${UI.esc(d.name_zh || "申请详情")}</h2>
      <div><span class="st ${current.status}">${ST[current.status] || current.status}</span></div>

      ${editable ? `<div class="acts">
        ${current.status === "submitted" ? `<button data-a="start_review">开始审核</button>` : ""}
        <button data-a="needs_information">要求补充资料</button>
        <button data-a="accept" class="pri">录取</button>
        <button data-a="reject">拒绝</button>
      </div>` : `<div class="msg info show" style="margin:12px 0">该申请已处于终态，不可再变更。</div>`}
      <div class="msg err" id="dErr" role="alert"></div>

      <h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">申请内容</h3>
      ${ro("学习路径", PW[current.pathway] || current.pathway)}
      ${ro("申请项目", p ? p.name_zh + (p.short_label ? "（" + p.short_label + "）" : "") : "")}
      ${ro("中文姓名", d.name_zh)} ${ro("英文姓名", d.name_en)}
      ${ro("性别", d.gender === "male" ? "男" : d.gender === "female" ? "女" : "")}
      ${ro("出生年月", d.birth_ym)} ${ro("国籍", d.nationality)}
      ${ro("使用语言", (d.languages || []).join("、"))}
      ${ro("现居地址", d.address)} ${ro("手机", d.phone)} ${ro("固定电话", d.tel)}
      ${ro("备用 Email/QQ", d.email_alt)} ${ro("微信/Line", d.im_contact)}
      ${ro("教会名称", d.church_name)} ${ro("教会电话", d.church_phone)} ${ro("目前服事", d.church_role)}
      ${ro("初信日期", d.conversion_date)} ${ro("受洗日期", d.baptism_date)}
      ${ro("学历", rowsOf(d.education, ["school","city","start_ym","end_ym","degree"]))}
      ${ro("事奉简历", rowsOf(d.experience, ["org","city","start_ym","end_ym","position"]))}
      ${ro("性格", d.personality)} ${ro("恩赐", d.gifts)}
      ${ro("异象/蒙召", d.calling)}
      ${ro("介绍人", d.referrer)}
      ${d.testimony ? `<h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">自我介绍与见证</h3>
        <p style="font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap">${UI.esc(d.testimony)}</p>` : ""}

      ${reqUnknown
        ? `<h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">补充资料要求</h3>
        ${readFailed("这份申请的补充资料要求")}`
        : (reqs.length ? `<h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">补充资料要求</h3>
        <ul style="padding-left:18px;font-size:13px">${reqs.map(r => `<li>${UI.esc(r.label)}${r.field ? `<span class="who">（已解锁：${UI.esc(LOCK_LABEL[r.field] || r.field)}）</span>` : ""}${r.resolved ? " ✓ 已完成" : " · 待完成"}</li>`).join("")}</ul>` : "")}

      ${renderAssign(current)}

      <h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">内部备注（仅管理员可见）</h3>
      ${intUnknown ? readFailed("内部备注")
        : `<p style="font-size:13px;color:var(--muted);white-space:pre-wrap">${UI.esc(internal?.notes || "（暂无）")}</p>`}

      <h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">状态时间线</h3>
      ${histUnknown ? readFailed("状态时间线") : UI.timeline((hist || []).map(h => ({
        title: (ST[h.to_status] || h.to_status) + (h.actor_role ? " · " + (h.actor_role === "admin" ? "教务" : "申请人") : ""),
        time: new Date(h.created_at).toLocaleString("zh-CN",{hour12:false}),
        text: h.applicant_visible_message || "",
      })))}`;

    document.getElementById("dClose").addEventListener("click", () => box.classList.remove("open"));
    document.getElementById("asSave")?.addEventListener("click", saveAssign);
    box.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => act(b.dataset.a)));
    /* 这一份如果上次的结果没弄清楚，重新打开时仍然锁着，并把原话再说一遍 ——
       否则「刷新核实」之前它看起来又可以点了。 */
    if (unresolved.has(id)) showUnresolved(id);
    else if (inflight.has(id)) setActionsDisabled(id, true);
    box.focus();
  }

  /* 拿不到明确结论的三类 —— 它们共同的意思是「请求**可能已经生效**」：
       network       连响应都没拿到（请求是否送达未知）
       server_error  服务端回话了，但没给出结构化结论
       unknown / 空  没有可读的结论
     反过来，服务端给了错误码就是**确定没执行**，可以放心重来。
     注意 session_unknown 属于后者：那是我们自己没发出去（第五包），
     它自己的文案已经写明「这次没有发出请求」。 */
  const UNKNOWN_CODES = { network: 1, server_error: 1, unknown: 1 };
  const UNKNOWN_TEXT = "没有拿到这次审核的结果，无法确认它是否已经生效。" +
    "在核实之前不要重复执行 —— 重复审核会写下两条审批记录。请刷新后核实当前状态。";
  /* 状态必须绑在**这一份申请**上，不能是页面级的一个 boolean。
     监督独立复现（event141c）：A 的请求结果不明之后（我们刻意锁住 A），
     关掉 A、打开 B、确认「开始审核」—— `if (acting) return` 直接静默退出，
     B 什么都没发生，连一句提示都没有。一个不明结果锁死了后面所有申请。

     同一处还有第二个问题：application_id 原来是在确认弹窗**之后**才从
     current 读的。弹窗开着的时候切到另一份，这个动作就会落到别人头上。
     所以进 act() 的第一件事是把目标钉死，之后一律用它，不再看 current。 */
  const inflight = new Set();      // 正在途中的申请 id
  const unresolved = new Map();    // 申请 id -> 结果不明的说明；核实前这一份不能再动

  /** 只在当前正显示这一份时改按钮；否则状态留在 inflight/unresolved 里，
      等 openDetail 重新打开时再还原（见 openDetail 末尾）。 */
  function setActionsDisabled(appId, disabled){
    if (!current || current.id !== appId) return;
    const box = document.getElementById("detail");
    if (box) box.querySelectorAll("[data-a]").forEach((b) => { b.disabled = disabled; });
  }
  function showUnresolved(appId){
    const e = document.getElementById("dErr");
    if (e && current && current.id === appId) {
      e.textContent = unresolved.get(appId); e.classList.add("show");
    }
    setActionsDisabled(appId, true);
  }

  /* 指派区块。三条硬约束：
       · 终态（accepted/rejected/withdrawn）不允许新指派、重指派或取消 —— 界面同步解释；
       · 候选人读不到时不摆一个空下拉（读不到 ≠ 没有人可指派）；
       · 只记录分工 —— 文案里写明它不改变谁能审这一份。 */
  function renderAssign(app){
    const cur = app.assigned_reviewer || null;
    const curName = cur ? (reviewerName(cur) || "这一次没读到是谁") : null;
    const head = '<h3 style="font-size:14.5px;color:var(--navy);margin:16px 0 6px">审核人</h3>';
    const who = `<p style="font-size:13px;margin:0 0 8px">当前审核人：<b>${
      cur ? UI.esc(curName) : "未指派"}</b>
      <span class="who" style="display:block;margin-top:4px">指派只记录分工，<b>不改变谁能审这一份</b>。</span></p>`;

    if (TERMINAL.includes(app.status)) {
      return head + who +
        '<div class="msg info show" style="margin:6px 0">该申请已处于终态（' +
        UI.esc(ST[app.status] || app.status) +
        '），不能再新指派、重指派或取消。</div>';
    }
    if (app.status === "draft") {
      return head + who +
        '<div class="msg info show" style="margin:6px 0">这一份还没有提交，暂不指派。</div>';
    }
    if (reviewersUnknown) {
      return head + who +
        '<div class="msg warn show" style="margin:6px 0">这一次没能读到候选审核人名单（未知）。' +
        '这不表示没有人可指派 —— 请刷新后再试。</div>';
    }
    const opts = ['<option value="">（取消指派）</option>'].concat(
      reviewers.map(r => `<option value="${UI.esc(r.id)}"${r.id === cur ? " selected" : ""}>${
        UI.esc(r.name)}（${UI.esc(r.roles.join("、"))}）</option>`)).join("");
    const undated = reviewersUndated
      ? `<div class="msg info show" style="margin:6px 0">另有 <b>${reviewersUndated}</b> 位的角色有效期` +
        `<b>读不出来</b>，无法确认是否仍然有效，没有列进候选名单。</div>`
      : "";
    return head + who + undated +
      `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
        <select id="asSel" aria-label="选择审核人" style="min-width:220px">${opts}</select>
        <button class="btn" id="asSave" style="width:auto;padding:0 18px">保存指派</button>
      </div>
      <p class="who" style="margin:0">取消指派之后，<b>下一次有人执行审核动作时，这一列会被再次自动填上那个人</b>
      （沿用既有行为，本次没有改动它）。</p>`;
  }

  async function saveAssign(){
    const target = current;                       // 先钉死目标，与 act() 同规矩
    if (!target) return;
    const appId = target.id;
    const expected = target.assigned_reviewer || null;
    const sel = document.getElementById("asSel");
    if (!sel) return;
    const picked = sel.value || null;
    const err = document.getElementById("dErr"); err.classList.remove("show");

    if (inflight.has(appId)) return;
    if (unresolved.has(appId)) { showUnresolved(appId); return; }
    if (picked === expected) { UI.toast("没有变化"); return; }

    const label = picked ? (reviewerName(picked) || "这个人") : "（取消指派）";
    const ok = await UI.confirmDialog({
      title: picked ? "更改审核人" : "取消指派",
      text: "对象：" + ((target.form_data && target.form_data.name_zh) || "这份申请") +
            "。把审核人改为「" + label + "」？这只记录分工，不改变谁能审这一份；该操作会写入审计记录。",
      confirmLabel: "确认",
    });
    if (!ok) return;
    if (inflight.has(appId) || unresolved.has(appId)) return;

    inflight.add(appId);
    setActionsDisabled(appId, true);
    const btn0 = document.getElementById("asSave");
    if (btn0) btn0.disabled = true;

    /* expected_reviewer **一定要显式带上**（null 表示「我看到的是未指派」）。
       缺这个键服务端会拒（Edge: expected_required），不会悄悄当成 null。 */
    const { data, error } = await Api.fn("review-application", {
      application_id: appId, op: "assign",
      reviewer_id: picked, expected_reviewer: expected, note: null,
    }, { requireAal2: true });

    inflight.delete(appId);

    const settle = (text, lock) => {
      if (lock) unresolved.set(appId, text);
      else setActionsDisabled(appId, false);
      if (current && current.id === appId) {
        const e2 = document.getElementById("dErr");
        if (e2) { e2.textContent = text; e2.classList.add("show"); }
        const b2 = document.getElementById("asSave");
        if (b2 && !lock) b2.disabled = false;
      }
    };

    if (error) {
      const code = error.code || "";
      if (!code || UNKNOWN_CODES[code]) return settle(UNKNOWN_TEXT, true);
      return settle((error.message || code) + "（这次没有更改审核人。）", false);
    }
    if (!data || typeof data !== "object") return settle(UNKNOWN_TEXT, true);

    if (data.ok !== true) {
      if (data.error === "not_assignable") {
        /* 服务端在行锁之后判的，带回了当时的真实状态 —— 用它说清楚原因，
           不要只说一句「不能改」。 */
        const st = data.status;
        return settle(st === "draft"
          ? "这份申请还没有提交，不能指派审核人。"
          : "这份申请现在是「" + (ST[st] || st || "终态") + "」，不能再新指派、重指派或取消。请刷新查看当前状态。",
          false);
      }
      if (data.error === "reassigned") {
        return settle("这一份的审核人刚被别人改过（现在是「" +
          (reviewerName(data.current) || "另一个人") + "」）。这次没有覆盖，请刷新核实后再决定。", false);
      }
      if (data.error === "not_a_reviewer") {
        await loadReviewers();
        return settle("这个人现在没有审核角色（可能刚被撤销或已过期），没有指派。候选名单已重新读取。", false);
      }
      return settle(UNKNOWN_TEXT, true);
    }

    setActionsDisabled(appId, false);
    UI.toast(picked ? "审核人已更新" : "已取消指派");
    await load();
    if (current && current.id === appId) {
      const again = rows.find(r => r.id === appId);
      if (again) { current = again; openDetail(appId); }
    }
  }

  async function act(action){
    const target = current;                       // ★ 先钉死目标
    if (!target) return;
    const appId = target.id;
    const err = document.getElementById("dErr"); err.classList.remove("show");
    if (inflight.has(appId)) return;
    if (unresolved.has(appId)) { showUnresolved(appId); return; }
    let message = null, requirements = null, internal_note = null;

    if (action === "needs_information") {
      const r = await promptRequirements();
      if (!r) return;
      requirements = r.items; message = r.message; internal_note = r.note;
    } else {
      const labels = { start_review: "开始审核", accept: "录取", reject: "拒绝" };
      const ok = await UI.confirmDialog({
        title: labels[action],
        text: action === "accept"
          ? "录取仅表示分校层面的录取决定；学籍须经 AMAS 总校审核确认后由教务另行建档。确认执行？"
          : `确认执行「${labels[action]}」？该操作会写入审计记录。`,
        confirmLabel: "确认", danger: action === "reject",
      });
      if (!ok) return;
      if (action !== "start_review") {
        message = prompt("给申请人的说明（可留空）：") || null;
        internal_note = prompt("内部备注（仅管理员可见，可留空）：") || null;
      }
    }

    /* 审核是**不可逆**动作，而且写审计记录。同仓的 portal/admin/teachers/
       对同一类动作早就做对了三件事，这里一件都没有：
         ① 在途期间禁用全部动作按钮，吞掉重复点击；
         ② 明确拒绝才解锁（可以放心重来）；
         ③ 结果不明则**锁住这一条**，只留「刷新核实」这条出路。
       只说「不要重试」是不够的 —— 按钮还摆在那儿就还是会被点。 */
    // 弹窗开着的这段时间里，这一份可能已经被别处动过
    if (inflight.has(appId) || unresolved.has(appId)) return;
    inflight.add(appId);
    setActionsDisabled(appId, true);

    const { data, error } = await Api.fn("review-application", {
      application_id: appId, action, message, requirements, internal_note,
    }, { requireAal2: true });

    inflight.delete(appId);

    /** 回执可能晚于用户切走。只有还在看这一份时才动 DOM；
        锁定状态一律记在 unresolved 里，重新打开时还原。 */
    const settle = (text, lock) => {
      if (lock) unresolved.set(appId, text);
      else setActionsDisabled(appId, false);
      if (current && current.id === appId) {
        const e2 = document.getElementById("dErr");
        if (e2) { e2.textContent = text; e2.classList.add("show"); }
      }
    };

    if (error) {
      const code = error.code || "";
      if (!code || UNKNOWN_CODES[code]) return settle(UNKNOWN_TEXT, true);
      return settle((error.message || code) + "（这次没有执行任何操作。）", false);
    }
    // 200 但没有可读的 body，或者结构对不上契约（ok:true）—— 都不能断言生效
    if (!data || data.ok !== true) return settle(UNKNOWN_TEXT, true);

    setActionsDisabled(appId, false);
    UI.toast("已执行：" + action);
    if (current && current.id === appId) document.getElementById("detail").classList.remove("open");
    await load();
  }

  /** 条目化补件输入（服务端要求至少一条） */
  function promptRequirements(){
    return new Promise((resolve) => {
      const wrap = document.createElement("div");
      wrap.className = "portal-modal";
      wrap.innerHTML = `<div class="pm-backdrop"></div>
        <div class="pm-card" role="dialog" aria-modal="true" aria-labelledby="rq-t" style="width:min(520px,calc(100% - 32px))">
          <h3 id="rq-t">要求补充资料</h3>
          <p>逐条列出需要申请人补充的内容，申请人须全部标记完成后才能重新提交。若需要申请人订正的是提交后已锁定的字段，请在该条选择「对应字段」，系统会仅为这一条解锁该字段。</p>
          <div id="rqRows" style="margin:12px 0"></div>
          <button class="link" id="rqAdd">+ 添加一条</button>
          <div style="margin-top:12px"><label style="font-size:13px;font-weight:700;color:var(--navy)">给申请人的说明（可留空）</label>
            <input id="rqMsg" style="width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-top:6px"></div>
          <div style="margin-top:10px"><label style="font-size:13px;font-weight:700;color:var(--navy)">内部备注（仅管理员可见）</label>
            <input id="rqNote" style="width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-top:6px"></div>
          <div class="pm-acts">
            <button class="btn ghost" id="rqCancel" style="width:auto;padding:0 20px">取消</button>
            <button class="btn" id="rqOk" style="width:auto;padding:0 20px">发送要求</button>
          </div>
        </div>`;
      document.body.appendChild(wrap);
      const rowsBox = wrap.querySelector("#rqRows");
      // 只有提交时锁定的字段才需要解锁；其余字段申请人本来就能改
      const lockOpts = (current.locked_fields || [])
        .map(f => `<option value="${UI.esc(f)}">${UI.esc(LOCK_LABEL[f] || f)}</option>`).join("");
      const addRow = () => {
        const div = document.createElement("div");
        div.className = "reqrow";
        div.innerHTML = `<input placeholder="需要补充什么（必填）" data-label><input placeholder="说明（可选）" data-detail>` +
          (lockOpts ? `<select data-field aria-label="对应字段（可选，选择后解锁该锁定字段）"><option value="">不解锁字段</option>${lockOpts}</select>` : "");
        rowsBox.appendChild(div);
      };
      addRow();
      /* 新加的那一条在 DOM 里排在这个按钮**前面** —— 不把焦点送过去的话，
         正向 Tab 再也走不回去（只能 Shift+Tab 倒着找，本轮实测 Tp6）。 */
      wrap.querySelector("#rqAdd").addEventListener("click", () => {
        addRow();
        rowsBox.lastElementChild?.querySelector("input")?.focus();
      });
      /* 这个对话框是本页自建的，没有走 UI.confirmDialog —— 于是三件事都漏了：
         打开时焦点不进来、Esc 关不掉、关掉之后焦点回不到打开它的那个按钮。
         键盘用户会停在对话框**后面**那一页上，按 Esc 没反应，
         取消之后还得从表格头部重新 Tab 一遍（本轮实测 Ad6/Ad7/Ad8）。
         照 assets/js/portal/ui.js:84-94 既有的做法补齐，不另发明一套。 */
      const prev = document.activeElement;
      /* 焦点圈住：没有这一段，Tab 会一路走到遮罩**后面**的页面上
         （本轮实测：正向 7 次、反向 6 次跑到导航和 <body>）。
         对话框是 aria-modal="true"，读屏会告诉他「现在在对话框里」，
         结果键盘却能走出去 —— 说的和做的对不上。 */
      const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),' +
        'select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
      const trap = (e) => {
        if (e.key !== "Tab") return;
        const f = [...wrap.querySelectorAll(FOCUSABLE)]
          .filter(el => el.offsetWidth || el.offsetHeight || el.getClientRects().length);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1], cur = document.activeElement;
        if (e.shiftKey && (cur === first || !wrap.contains(cur))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (cur === last || !wrap.contains(cur))) { e.preventDefault(); first.focus(); }
      };
      const onKey = (e) => { if (e.key === "Escape") { close(null); return; } trap(e); };
      const close = (v) => {
        wrap.remove();
        document.removeEventListener("keydown", onKey);
        prev?.focus?.();
        resolve(v);
      };
      document.addEventListener("keydown", onKey);
      /* 焦点送进对话框：第一条要求的输入框（拿不到就退到「取消」）。 */
      (wrap.querySelector(".pm-card input, .pm-card select") ||
       wrap.querySelector("#rqCancel"))?.focus();
      wrap.querySelector("#rqCancel").addEventListener("click", () => close(null));
      wrap.querySelector(".pm-backdrop").addEventListener("click", () => close(null));
      /* 对话框里说话的地方（原来用的是阻塞式 alert：关掉之后焦点停在「发送要求」上，
         他既看不到问题在哪一条，也得自己找回去 —— 本轮实测 Rv-*-6 / Rv-*-7）。 */
      const sayInDialog = (text, focusEl) => {
        const acts = wrap.querySelector(".pm-acts");
        let box = wrap.querySelector("#rqErr");
        if (!box) {
          box = document.createElement("div");
          box.id = "rqErr";
          box.className = "msg err show";
          box.setAttribute("role", "alert");
          box.style.margin = "10px 0";
          acts.parentNode.insertBefore(box, acts);
        }
        box.textContent = text;
        focusEl?.focus();
      };
      wrap.querySelector("#rqOk").addEventListener("click", () => {
        const rows = [...rowsBox.querySelectorAll(".reqrow")].map(r => ({
          el: r,
          label: r.querySelector("[data-label]").value.trim(),
          detail: (r.querySelector("[data-detail]").value || "").trim(),
          field: ((r.querySelector("[data-field]") || {}).value || ""),
        }));
        /* 两种「标题空着」要分开处理 —— 原来一句 `.filter(x => x.label)` 把它们
           一视同仁地丢掉了：
             · **整条都是空的** = 他按了「+ 添加一条」还没填。这是常态，忽略就好；
             · **填了说明或选了字段、偏偏标题空着** = 他写了东西。
               原来这一条会被**静默丢弃**、请求照发 —— 管理员以为发了两条，
               申请人只收到一条，而对话框上明明写着「需要补充什么（必填）」
               （本轮实测 Rm6：POST 照样发出去了）。
               这种不能丢：拦住、说清是第几条、把焦点送过去，他填上或自己清空。 */
        const touched = rows.filter(x => x.label || x.detail || x.field);
        const badIdx = touched.findIndex(x => !x.label);
        if (badIdx > -1) {
          const bad = touched[badIdx];
          const no = rows.indexOf(bad) + 1;
          sayInDialog("第 " + no + " 条填了内容，但还没写明「需要补充什么」—— " +
            "补上标题，或者把这一条清空再发送。", bad.el.querySelector("[data-label]"));
          return;
        }
        const items = touched.map(x => ({
          label: x.label, detail: x.detail || undefined, field: x.field || undefined,
        }));
        if (!items.length) {
          sayInDialog("每一条都要写明「需要补充什么」—— 至少填一条（只打空格不算）。",
            rowsBox.querySelector("[data-label]"));
          return;
        }
        close({ items, message: wrap.querySelector("#rqMsg").value.trim() || null, note: wrap.querySelector("#rqNote").value.trim() || null });
      });
    });
  }
})();
</script>
</body>
</html>
