<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>考勤核查 | AMAS</title><link rel="icon" href="../../../assets/img/favicon.png"><link rel="stylesheet" href="../../../assets/css/portal.css?v=202610281144">
<style>
.review-fields{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.review-fields label{display:grid;gap:6px;min-width:130px}.review-fields input,.review-fields select,.review-fields button,.calendar button{min-height:44px;font:inherit;border:1px solid #cbd5de;border-radius:8px;background:#fff;padding:8px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calendar .weekday{text-align:center;font-size:13px;color:#637182}.calendar button{min-width:0;padding:7px 2px;display:grid;gap:4px;text-align:center;color:#234a70;cursor:pointer}.calendar small{font-size:11px}.calendar button.pending{background:#fff4e5;border-color:#d6b57b}.calendar button[aria-pressed=true]{outline:2px solid #234a70;outline-offset:1px}.calendar button.empty{color:#637182}.review-panel{background:white;border:1px solid #e0e5ea;border-radius:14px;padding:16px;margin:16px 0}.review-table{overflow:auto}.review-table table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}.review-table th,.review-table td{text-align:left;padding:10px;border-bottom:1px solid #e1e7eb}.review-note{font-size:13px;color:#617080;line-height:1.8}.review-lessons article,.review-history article{padding:12px 0;border-bottom:1px solid #e1e7eb}.review-history p{margin:5px 0;overflow-wrap:anywhere}.review-panel h2{font-size:19px}.review-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review-panel button{min-height:44px}.review-empty{padding:14px 0;color:#617080}@media(max-width:480px){.review-panel{padding:12px}.calendar{gap:4px}.calendar small{font-size:10px}}
</style>
</head><body>
<script src="../../../assets/vendor/supabase-js@2.116.0/supabase.min.js"></script>
<script src="../../../assets/js/supabase-config.js?v=202610281144"></script>
<script src="../../../assets/js/portal/auth.js?v=202610281144"></script>
<script src="../../../assets/js/portal/api.js?v=202610281144"></script>
<script src="../../../assets/js/portal/ui.js?v=202610281144"></script>
<script src="../../../assets/js/portal/shell.js?v=202610281144"></script>
<script>
(async function(){
 const A=window.AmasAuth,Api=window.AmasApi,UI=window.AmasUI;
 const mounted=await window.AmasShell.mount({space:'admin',title:'考勤核查',allow:['registrar','academic_admin','super_admin'],requireAal2:true});if(!mounted)return;
 const {main}=mounted,esc=UI.esc;
 main.innerHTML='<h1>考勤核查</h1><p>按月查看点名完成情况、每位学员的考勤次数和修改记录。</p><div class="review-fields"><label>班级<select id="cohort"></select></label><label>月份<input id="month" type="month" min="2000-01" max="2100-12"></label><button class="sbtn" id="refresh" type="button">读取本月</button></div><div id="reviewStatus" class="msg" role="status"></div><div id="reviewContent"></div>';
 const $=s=>main.querySelector(s);let generation=0,report=null,historyCursor=null,historyBusy=false,dayFilter='';
 const states={'':'未登记',present:'出席',late:'迟到',excused:'请假',absent:'缺席'};
 $('#month').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit'}).format(new Date()).slice(0,7);
 function say(text,error=false){$('#reviewStatus').className='msg show '+(error?'err':'ok');$('#reviewStatus').textContent=text;}
 function args(){return {p_cohort:$('#cohort').value,p_month:$('#month').value+'-01'};}
 function reportValid(d,q){return d&&d.cohort===q.p_cohort&&d.month===q.p_month&&Array.isArray(d.sessions)&&Array.isArray(d.students)&&d.sessions.every(s=>typeof s.id==='string'&&typeof s.day==='string'&&s.day.startsWith(q.p_month.slice(0,7))&&typeof s.title==='string'&&Number.isSafeInteger(s.expected)&&Number.isSafeInteger(s.unmarked)&&s.unmarked>=0&&s.unmarked<=s.expected)&&d.students.every(s=>typeof s.name==='string'&&['submission_id','expected','present','late','excused','absent','unmarked'].every(k=>Number.isSafeInteger(s[k])&&s[k]>=0)&&s.expected===s.present+s.late+s.excused+s.absent+s.unmarked);}
 async function rpc(name,q){let timer;try{return await Promise.race([Api.rpc(name,q),new Promise(resolve=>{timer=setTimeout(()=>resolve({error:true}),20000);})]);}catch(e){return {error:true};}finally{clearTimeout(timer);}}
 function lessonList(){const list=report.sessions.filter(s=>!dayFilter||s.day===dayFilter);$('#lessonList').innerHTML=list.length?list.map(s=>'<article><strong>'+esc(s.day)+(s.title?' · '+esc(s.title):'')+'</strong><p>'+s.expected+' 人 · '+(s.expected===0?'无点名名单':s.unmarked?'还有 '+s.unmarked+' 人未登记':'已全部登记')+'</p>'+(!s.roster_frozen?'<p class="review-note">历史课次：名单依据升级时分班及已登记记录补齐，请核对。</p>':'')+'</article>').join(''):'<p class="review-empty">这一天没有上课记录；不代表漏登或缺勤。</p>';}
 function render(){
 const sessions=report.sessions,unmarked=sessions.reduce((n,s)=>n+s.unmarked,0),daysInMonth=new Date(Number(report.month.slice(0,4)),Number(report.month.slice(5,7)),0).getDate(),offset=new Date(report.month+'T12:00:00').getDay();
 $('#reviewContent').innerHTML='<p class="review-note">本月 '+sessions.length+' 次上课记录 · 未登记 '+unmarked+' 人次。只统计已建立的课次；没有排课数据时，无法判断哪天应上课却未建记录。新课次使用固定名单，未登记单独计算。</p><section class="review-panel"><h2>考勤月历</h2><div class="calendar">'+['日','一','二','三','四','五','六'].map(x=>'<span class="weekday">'+x+'</span>').join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:daysInMonth},(_,i)=>{const day=report.month.slice(0,7)+'-'+String(i+1).padStart(2,'0'),ss=sessions.filter(s=>s.day===day),missing=ss.reduce((n,s)=>n+s.unmarked,0);return '<button type="button" data-day="'+day+'" class="'+(missing?'pending':ss.length?'':'empty')+'" aria-pressed="false" aria-label="'+day+'，'+(ss.length?ss.length+'课次，未登记'+missing+'人次':'无上课记录')+'">'+(i+1)+'<small>'+(ss.length?missing?'待补 '+missing:ss.length+' 课次':'—')+'</small></button>';}).join('')+'</div><button id="allDays" class="link" type="button">显示本月全部课次</button><div id="lessonList" class="review-lessons"></div></section><section class="review-panel"><div class="review-toolbar"><h2>学员月报</h2><button id="export" type="button" class="sbtn">导出本月 CSV</button></div><p class="review-note">请假、迟到与缺席分别列出，本页不自行换算出席率。统计人数可能与当前班级名单不同。</p><div class="review-table"><table><thead><tr><th>学员</th><th>应登记课次</th><th>出席</th><th>迟到</th><th>请假</th><th>缺席</th><th>未登记</th></tr></thead><tbody>'+report.students.map(s=>'<tr><td>'+esc(s.name||'未填姓名')+'</td>'+['expected','present','late','excused','absent','unmarked'].map(k=>'<td>'+s[k]+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(!report.students.length?'<p class="review-empty">本月暂无可统计的点名名单。</p>':'')+'</section><section class="review-panel"><h2>修改记录</h2><p class="review-note">逐项记录从本次升级开始；包含考勤负责人和教务的考勤修改，重复保存相同状态不新增变更。旧版保存审计仍保留。</p><div id="historyStatus" role="status"></div><div id="historyList" class="review-history"></div><button id="moreHistory" type="button" class="sbtn">读取修改记录</button></section>';
 main.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{dayFilter=b.dataset.day;main.querySelectorAll('[data-day]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));lessonList();});$('#allDays').onclick=()=>{dayFilter='';main.querySelectorAll('[data-day]').forEach(x=>x.setAttribute('aria-pressed','false'));lessonList();};$('#export').disabled=!report.students.length;$('#export').onclick=exportCsv;$('#moreHistory').onclick=()=>loadHistory(generation);lessonList();
 }
 function csvCell(value){let v=String(value??'');if(/^[\s]*[=+@-]/.test(v)||/^[\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
 function exportCsv(){if(!report)return;const rows=[['班级',report.cohort,'月份',report.month.slice(0,7)],['学员','应登记课次','出席','迟到','请假','缺席','未登记'],...report.students.map(s=>[s.name,s.expected,s.present,s.late,s.excused,s.absent,s.unmarked])],blob=new Blob(['\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='考勤月报-'+report.month.slice(0,7)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 async function loadHistory(gen){if(historyBusy||gen!==generation)return;historyBusy=true;const btn=$('#moreHistory');btn.disabled=true;$('#historyStatus').textContent='正在读取修改记录…';const r=await rpc('admin_attendance_history',{...args(),p_before:historyCursor});if(gen!==generation||A.sessionEnded())return;historyBusy=false;const d=r.data;if(r.error||!d||!Array.isArray(d.rows)||!(d.next_before===null||Number.isSafeInteger(d.next_before))||!d.rows.every(x=>Number.isSafeInteger(x.id)&&typeof x.operation==='string'&&typeof x.actor_name==='string'&&typeof x.held_on==='string')){$('#historyStatus').textContent='修改记录读取失败，可重试。这不表示没有修改。';btn.disabled=false;return;}
 const textStatus=v=>states[v]??'无记录';$('#historyList').insertAdjacentHTML('beforeend',d.rows.map(x=>'<article><strong>'+esc(x.held_on)+' · '+esc(x.name||x.title||'课次')+'</strong><p>'+esc(x.operation==='session_deleted'?'课次已删除':x.operation==='session_changed'?'课次信息已修改':textStatus(x.old_status)+' → '+textStatus(x.new_status))+'</p>'+((x.old_note||'')!==(x.new_note||'')?'<p>备注：'+esc(x.old_note||'无')+' → '+esc(x.new_note||'无')+'</p>':'')+'<p class="review-note">'+esc(x.actor_name)+' · '+esc(new Date(x.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Bangkok'}))+'</p></article>').join(''));historyCursor=d.next_before;btn.hidden=historyCursor===null;btn.disabled=false;btn.textContent='加载更早记录';$('#historyStatus').textContent=d.rows.length?'已读取修改记录'+(d.legacy_saves?'；另有旧版保存审计 '+d.legacy_saves+' 次。':''):'暂无本次升级后的修改记录'+(d.legacy_saves?'；旧版保存审计 '+d.legacy_saves+' 次仍保留。':'。');
 }
 async function load(){const q=args();if(!/^\d{4}-(0[1-9]|1[0-2])-01$/.test(q.p_month)||!q.p_cohort)return say('请选择班级和有效月份。',true);const gen=++generation;report=null;historyCursor=null;historyBusy=false;dayFilter='';$('#reviewContent').innerHTML='';say('正在读取本月考勤…');const r=await rpc('admin_attendance_month',q);if(gen!==generation||A.sessionEnded())return;if(r.error||!reportValid(r.data,q))return say('本月考勤读取失败，请重试。这不表示没有记录。',true);report=r.data;render();say('已读取 '+report.cohort+' '+report.month.slice(0,7)+' 的考勤。');await loadHistory(gen);}
 $('#refresh').onclick=load;$('#cohort').onchange=load;$('#month').onchange=load;
 const c=await Api.select('submission_cohorts',{columns:'name',order:[{column:'sort',asc:true}]});if(c.error||!Array.isArray(c.data))return say('班级列表读取失败，请刷新重试。',true);$('#cohort').innerHTML=c.data.map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join('');const wanted=new URLSearchParams(location.search).get('name')||'10月班';if(c.data.some(x=>x.name===wanted))$('#cohort').value=wanted;await load();
})();
</script></body></html>
