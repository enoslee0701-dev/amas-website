<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>找回密码 | AMAS 亚洲宣教神学院</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/portal.css?v=202609132141">
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <img src="../assets/img/school-seal.webp" alt="AMAS">
    <h1>亚洲宣教神学院</h1>
    <div class="en">ASIA MISSIONARY ASSOCIATION SEMINARY</div>
  </div>

  <div class="card">
    <div id="disabledNotice" class="notice" hidden><b>门户系统尚未启用。</b>如需协助请<a class="link" href="../index.html#contact">联系招生同工</a>。</div>
    <!-- 配置齐全、只是外部组件没加载下来；这种情况刷新就能好，不该说成「尚未启用」。 -->
    <div id="offlineNotice" class="notice" hidden><b>组件没能加载。</b>门户本身已就绪，是当前网络取不到重设密码所需的外部组件；换个网络或重新载入通常即可。如需协助请<a class="link" href="../index.html#contact">联系招生同工</a>。
      <div><button type="button" class="notice-act" id="btnReload">重新载入</button></div>
    </div>
    <h2>找回密码</h2>
    <p class="sub">输入注册邮箱，我们将发送重置链接。用学号登录且没有可用邮箱的账号，请联系教务同工人工核验后重置。</p>
    <form id="fpForm" novalidate>
      <div class="field">
        <label for="fEmail">电子邮箱</label>
        <input id="fEmail" type="email" autocomplete="email" placeholder="请输入注册邮箱" required>
      </div>
      <button class="btn" id="btnGo" type="submit">发送重置邮件</button>
      <div class="msg ok" id="ok"></div>
      <div class="msg err" id="err" role="alert"></div>
    </form>
  </div>

  <div class="foot"><a href="../login/">返回登录</a> · <a href="../index.html">返回官网</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-config.js?v=202609132141"></script>
<script src="../assets/js/portal/auth.js?v=202609132141"></script>
<script>
(function(){
  const A = window.AmasAuth;
  const ok = document.getElementById("ok"), err = document.getElementById("err");
  if (!A.CONFIGURED) {
    const offline = A.CONFIG_STATE === "sdk-unavailable";
    document.getElementById(offline ? "offlineNotice" : "disabledNotice").hidden = false;
    document.getElementById("btnGo").disabled = true;
    if (offline) document.getElementById("btnReload").addEventListener("click", () => location.reload());
  }
  document.getElementById("fpForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    ok.classList.remove("show"); err.classList.remove("show");
    const f = e.currentTarget;
    if (!f.checkValidity()) return f.reportValidity();
    const btn = document.getElementById("btnGo");
    btn.disabled = true; btn.textContent = "发送中…";
    const r = await A.resetPassword(document.getElementById("fEmail").value);
    btn.textContent = "发送重置邮件"; btn.disabled = !A.CONFIGURED;

    /* 返回值原来被**整个丢掉**，于是断网、5xx、被限流时页面一律说
       「重置链接已发送」—— 用户坐等一封永远不会来的邮件，而邮件投递本身
       还是独立阻塞项，他更难察觉哪里出了问题。

       但**「没拿到回执」不等于「没发出去」**：连接可能是在服务端已经受理之后
       才断的（独立反例 event342：服务端 accepted=1，页面却说没发出去）。
       所以传输层失败一律只说「没能确认处理结果」，并给两条能自救的指引：
       先查收邮件，过一会儿还没有再重试。断言方向错了，用户就会照着假前提行动。

       确定被拒的分支另说：429 是服务端明确回绝，这一次确实没有发信；
       not_configured 是根本没调出去。这两条可以说死。

       这里如实说明**不泄漏任何账号信息**：传输层结果与这个邮箱有没有注册无关。
       §5.3 的反枚举由下面那句统一文案保证 —— 只要请求被受理，
       无论邮箱是否存在都是同一句话。 */
    if (r && r.error) {
      const UNCERTAIN = "没能确认这次请求的处理结果 —— 重置邮件可能已经在发送，也可能没有。" +
        "请先查收邮件（含垃圾邮件）；如果过一会儿仍然没有收到，再重试一次。";
      const M = {
        network: UNCERTAIN,
        server: UNCERTAIN,
        unknown: UNCERTAIN,
        rate_limited: "请求太频繁，这一次没有发送。请稍等一会儿再试。",
        not_configured: "账号系统尚未启用，这一次没有发送。",
      };
      err.textContent = M[r.error] || UNCERTAIN;
      err.classList.add("show");
      return;
    }

    /* 统一提示：无论邮箱是否存在都返回同样文案，避免探测（§5.3）。
       措辞只说到「已经受理」为止 —— **请求被接受不代表邮件已经投递**
       （SMTP 上线配置仍是独立阻塞项），不能替投递打包票。 */
    ok.textContent = "如果该邮箱已注册，重置邮件已经在发送。请查收邮件（含垃圾邮件）；" +
      "如果过一会儿还没有收到，可以再试一次。";
    ok.classList.add("show");
  });
})();
</script>
</body>
</html>
