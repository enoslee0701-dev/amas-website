name: Isolated tests
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_OUT: logs/evidence/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v2.9.6'
      - name: Prepare isolated database dependency
        run: |
          echo "PGLITE_DIR=$RUNNER_TEMP/amas-pglite" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/amas-pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.7
      - name: Unit and static checks
        run: TEST_OUT=logs/evidence/ci-fast node scripts/test-all.mjs --group fast
      - name: Database and roles
        if: always()
        run: TEST_OUT=logs/evidence/ci-sql node scripts/test-all.mjs --group sql
      - name: Edge types and HTTP contracts
        if: always()
        run: TEST_OUT=logs/evidence/ci-types node scripts/test-all.mjs --group types
      - name: Critical browser journeys
        if: always()
        run: |
          google-chrome --version
          TEST_OUT=logs/evidence/ci-browser node scripts/test-all.mjs --group critical
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-test-results
          path: logs/evidence/ci-*
